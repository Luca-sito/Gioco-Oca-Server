name: Deploy su Oracle

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configura SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy su Oracle
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          if [ -n "$YOUTUBE_DATA_API_KEY" ]; then
            printf '%s\n' "$YOUTUBE_DATA_API_KEY" | ssh \
              -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }} \
              'set -e; umask 077
               directory="$HOME/.config/giochi-societa"
               mkdir -p "$directory"
               temporaneo=$(mktemp "$directory/youtube.key.XXXXXX")
               trap '"'"'rm -f -- "$temporaneo"'"'"' EXIT
               cat > "$temporaneo"
               if [ -f "$directory/youtube.verificata" ] && cmp -s "$temporaneo" "$directory/youtube.key"; then
                 exit 0
               fi
               read -r chiave < "$temporaneo"
               printf "header = \"x-goog-api-key: %s\"\n" "$chiave" |
                 curl --config - --fail --silent --show-error --max-time 15 --output /dev/null \
                   --get --data-urlencode "part=snippet" --data-urlencode "type=video" \
                   --data-urlencode "videoEmbeddable=true" --data-urlencode "maxResults=1" \
                   --data-urlencode "q=musica jazz" "https://www.googleapis.com/youtube/v3/search"
               mv -f -- "$temporaneo" "$directory/youtube.key"
               touch "$directory/youtube.verificata"
               echo "Ricerca YouTube verificata da Oracle"'
          fi

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            ${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }} <<'REMOTE'
              set -e

              cd /home/opc/Gioco-Oca-Server

              echo "=== Aggiornamento repository ==="
              git fetch origin main
              git reset --hard origin/main

              echo "=== Installazione dipendenze ==="
              npm ci

              echo "=== Riavvio server ==="
              pm2 restart giochi-societa-server

              echo "=== Stato PM2 ==="
              pm2 status

              echo "=== Deploy completato ==="
          REMOTE
