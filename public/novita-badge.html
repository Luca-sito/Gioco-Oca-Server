<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novità</title>
<style>
  *{box-sizing:border-box}
  html,body{
    width:100%;height:100%;margin:0;padding:0;
    background:transparent;overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
  }
  body{display:flex;align-items:center;justify-content:center}
  #badgeNovita{
    display:none; /* nascosto finché la verifica non conferma che va mostrato */
    align-items:center;
    justify-content:center;
    min-width:86px;
    height:30px;
    padding:0 12px;
    border-radius:7px;
    background:#1677ff;
    color:#fff;
    font-size:13px;
    font-weight:900;
    line-height:1;
    letter-spacing:.25px;
    white-space:nowrap;
    user-select:none;
  }
</style>
</head>
<body>
<div id="badgeNovita" role="status" aria-live="polite">NOVITÀ!</div>
<script>
(() => {
  "use strict";

  const badge = document.getElementById("badgeNovita");

  // ID della novità da controllare. Passalo nell'URL con cui incorpori
  // questa pagina in Wix, es:
  //   https://api.giochisocieta.com/novita-badge.html?id=dama_2026
  const parametri = new URLSearchParams(window.location.search);
  const idNovita = parametri.get("id") || "dama_2026";

  function mostra(visibile) {
    badge.style.display = visibile ? "inline-flex" : "none";
  }

  function controllaStato() {
    fetch("/api/novita/stato/" + encodeURIComponent(idNovita), {
      method: "GET",
      credentials: "include",
      headers: { "Accept": "application/json" }
    })
      .then(risposta => {
        if (!risposta.ok) throw new Error("HTTP " + risposta.status);
        return risposta.json();
      })
      .then(dati => {
        const giaVista = dati && dati.vista === true;
        mostra(!giaVista);
      })
      .catch(() => {
        // Utente non loggato, errore di rete, ecc.: per sicurezza mostriamo
        // comunque il badge piuttosto che nasconderlo per un falso negativo.
        mostra(true);
      });
  }

  // Controllo iniziale al caricamento della pagina.
  controllaStato();

  // FIX "torna indietro col browser": se questa pagina viene ripristinata
  // dalla bfcache (invece di essere ricaricata da zero), "load" non scatta
  // di nuovo e il badge resterebbe fermo al vecchio stato. "pageshow" con
  // persisted=true intercetta esattamente questo caso e rifà il controllo.
  window.addEventListener("pageshow", (evento) => {
    if (evento.persisted) controllaStato();
  });

  // Rete di sicurezza aggiuntiva: se la scheda torna visibile (cambio tab,
  // ritorno dall'app in background su mobile) rifacciamo comunque il controllo.
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") controllaStato();
  });
})();
</script>
</body>
</html>
