<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novità</title>
<style>
  *{box-sizing:border-box}
  html,body{
    width:100%;height:100%;margin:0;padding:0;
    background:transparent;overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
  }
  body{display:flex;align-items:center;justify-content:center}
  #badgeNovita{
    display:none;
    align-items:center;
    justify-content:center;
    min-width:86px;
    height:30px;
    padding:0 12px;
    border-radius:7px;
    background:#1677ff;
    color:#fff;
    font-size:13px;
    font-weight:900;
    line-height:1;
    letter-spacing:.25px;
    white-space:nowrap;
    user-select:none;
  }
</style>
</head>
<body>
<div id="badgeNovita" role="status" aria-live="polite">NOVITÀ!</div>
<script>
(() => {
  "use strict";

  const badge = document.getElementById("badgeNovita");
  const parametri = new URLSearchParams(window.location.search);
  const idNovita = parametri.get("id") || "dama_2026";

  function mostraInternamente(visibile) {
    badge.style.display = visibile ? "inline-flex" : "none";
  }

  // Dice a Wix di espandere (area cliccabile riservata al badge) o
  // collassare del tutto l'elemento (spazio libero, cliccabile da chi
  // sta sotto/dietro), invece di limitarsi a nascondere il contenuto
  // interno dell'iframe.
  function comunicaVisibilitaAWix(visibile) {
    try {
      window.parent.postMessage({ tipo: "novitaVisibilita", visibile }, "*");
    } catch (e) {}
  }

  function impostaStato(visibile) {
    mostraInternamente(visibile);
    comunicaVisibilitaAWix(visibile);
  }

  // Appena parte lo script, nel dubbio teniamo l'area COLLASSATA (quindi
  // già cliccabile) finché non sappiamo se il badge va davvero mostrato.
  comunicaVisibilitaAWix(false);

  function controllaStato() {
    fetch("/api/novita/stato/" + encodeURIComponent(idNovita), {
      method: "GET",
      credentials: "include",
      headers: { "Accept": "application/json" }
    })
      .then(risposta => {
        if (!risposta.ok) throw new Error("HTTP " + risposta.status);
        return risposta.json();
      })
      .then(dati => {
        const giaVista = dati && dati.vista === true;
        impostaStato(!giaVista);
      })
      .catch(() => {
        impostaStato(true);
      });
  }

  controllaStato();

  window.addEventListener("pageshow", (evento) => {
    if (evento.persisted) controllaStato();
  });

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") controllaStato();
  });
})();
</script>
</body>
</html>
