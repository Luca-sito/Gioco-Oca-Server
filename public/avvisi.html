<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avvisi | Giochi Società</title>
<style>
:root {
    --notte: #112438;
    --testo: #152433;
    --secondario: #536579;
    --sfondo: #edf2f5;
    --superficie: #fff;
    --bordo: #dae3eb;
    --giallo: #f6ce55;
    --raggio: 14px;
    color-scheme: light;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--sfondo); color: var(--testo); font-size: 15px; line-height: 1.55; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
:focus-visible { outline: 2px solid #20669b; outline-offset: 3px; }
.contenitore { width: min(1000px, calc(100% - 40px)); margin-inline: auto; }

.barra-sito { background: var(--superficie); border-bottom: 1px solid var(--bordo); }
.barra-interna {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 64px;
    padding-block: 8px;
}
.marchio { display: flex; align-items: center; gap: 10px; font-weight: 750; }
.marchio-sigla {
    display: grid;
    place-items: center;
    flex: 0 0 36px;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--notte);
    color: var(--giallo);
    font-size: 14px;
    font-weight: 850;
}
.btn-indietro, .btn-riprova, .conferma-annulla {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 44px;
    padding: 6px 12px;
    border: 1px solid var(--bordo);
    border-radius: 9px;
    background: var(--superficie);
    color: var(--testo);
    font-size: 14px;
    font-weight: 700;
}
.btn-indietro { flex-shrink: 0; }
.btn-indietro svg { width: 18px; height: 18px; }
.btn-indietro:hover, .btn-riprova:hover, .conferma-annulla:hover { background: var(--sfondo); }

.pagina-avvisi { padding-block: 20px 48px; }
.testata-avvisi {
    padding: clamp(22px, 4vw, 36px);
    border-top: 3px solid var(--giallo);
    border-radius: var(--raggio);
    background: linear-gradient(115deg, var(--notte) 38%, #203e54);
    color: #fff;
}
.testata-avvisi h1 {
    margin: 0;
    font-size: clamp(2rem, 5vw, 3.15rem);
    line-height: 1.12;
    letter-spacing: -.04em;
}
.testata-avvisi p { margin: 8px 0 0; color: #d2e0ea; }

.griglia-avvisi { display: grid; gap: 18px; margin-top: 20px; }
.sezione-avvisi, .pannello-admin { min-width: 0; }
.intestazione-lista {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 5px 14px;
    margin-bottom: 12px;
}
.intestazione-lista h2, .pannello-admin h2 { margin: 0; font-size: 1.15rem; line-height: 1.3; }
#conteggioAvvisi { color: var(--secondario); font-size: 14px; }
.lista-avvisi { display: grid; gap: 12px; }
.avviso, .pannello-admin, .stato {
    border: 1px solid var(--bordo);
    border-radius: var(--raggio);
    background: var(--superficie);
}
.avviso { padding: clamp(16px, 2.7vw, 24px); overflow-wrap: anywhere; }
.avviso.super-importante { border-inline-start: 4px solid #d6a625; }
.avviso-titolo { margin: 0; font-size: clamp(1.075rem, 2.5vw, 1.25rem); line-height: 1.32; }
.avviso-meta {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 5px 10px;
    margin-bottom: 10px;
    color: var(--secondario);
    font-size: 13px;
}
.avviso-tipo { padding: 3px 9px; border-radius: 999px; background: #e8f0f7; color: #26465e; font-weight: 700; }
.super-importante .avviso-tipo { background: #fff2c9; color: #614504; }
.avviso-testo { margin: 9px 0 0; white-space: pre-wrap; }
.avviso-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px 12px;
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid var(--bordo);
}
.avviso-autore { color: var(--secondario); font-size: 13px; }
.btn-elimina {
    min-height: 44px;
    padding: 6px 12px;
    border: 1px solid #f0cfd0;
    border-radius: 9px;
    background: #fff6f5;
    color: #9a2330;
    font-size: 14px;
    font-weight: 700;
}
.btn-elimina:hover { background: #fce7e7; }
.stato { padding: clamp(20px, 5vw, 36px) 16px; text-align: center; color: var(--secondario); }
.stato strong { display: block; color: var(--testo); font-size: 16px; }
.stato p { margin: 5px 0 0; }
.btn-riprova { margin-top: 14px; }

.pannello-admin { display: none; padding: 18px; }
.pannello-admin.visibile { display: block; }
.pannello-admin h2 { margin-bottom: 14px; }
.form-gruppo { margin-bottom: 12px; }
.form-gruppo label { display: block; margin-bottom: 4px; font-size: 14px; font-weight: 700; }
.form-gruppo input, .form-gruppo textarea, .form-gruppo select {
    width: 100%;
    min-height: 44px;
    padding: 8px 10px;
    border: 1px solid #bfccd9;
    border-radius: 9px;
    background: #f8fafc;
    color: var(--testo);
    font-size: 16px;
}
.form-gruppo textarea { display: block; min-height: 125px; resize: vertical; }
.btn-pubblica {
    min-height: 44px;
    padding: 6px 14px;
    border: 0;
    border-radius: 9px;
    background: var(--giallo);
    color: var(--notte);
    font-size: 14px;
    font-weight: 750;
}
.btn-pubblica:hover:enabled { background: #f2c43d; }

#toast {
    position: fixed;
    inset: auto 16px 16px auto;
    z-index: 10;
    display: grid;
    gap: 8px;
    max-width: min(360px, calc(100% - 32px));
    pointer-events: none;
}
.toast { padding: 10px 14px; border-radius: 9px; background: var(--notte); color: #fff; box-shadow: 0 5px 20px #17273335; font-size: 14px; }
.conferma-overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    padding: 16px;
    background: #11243888;
}
.conferma-overlay[hidden] { display: none; }
.conferma-box {
    width: min(420px, 100%);
    max-height: 100%;
    overflow: auto;
    border: 1px solid var(--bordo);
    border-radius: var(--raggio);
    background: var(--superficie);
    box-shadow: 0 20px 54px #11243833;
}
.conferma-corpo { padding: 18px; }
.conferma-titolo { margin: 0; font-size: 18px; }
.conferma-testo { margin-top: 6px; color: var(--secondario); }
.conferma-azioni { display: flex; justify-content: end; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--bordo); }
.conferma-pericolo { min-height: 44px; padding: 6px 14px; border: 0; border-radius: 9px; background: #a42c38; color: #fff; font-weight: 700; }
.conferma-pericolo:hover { background: #84232d; }

@media (min-width: 920px) {
    .griglia-avvisi:has(.pannello-admin.visibile) {
        grid-template-columns: minmax(0, 1fr) 290px;
        align-items: start;
    }
    .pannello-admin.visibile { grid-area: 1 / 2; }
    .sezione-avvisi { grid-area: 1 / 1; }
}

@media (max-width: 600px) {
    .contenitore { width: calc(100% - 24px); }
    .barra-interna { min-height: 56px; padding-block: 6px; }
    .pagina-avvisi { padding-block: 12px 32px; }
    .griglia-avvisi { margin-top: 16px; }
}
</style>
</head>
<body>

<header class="barra-sito">
    <div class="contenitore barra-interna">
        <div class="marchio"><span class="marchio-sigla" aria-hidden="true">GS</span> Giochi Società</div>
        <button class="btn-indietro" type="button" onclick="history.back()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m15 18-6-6 6-6"></path>
            </svg>
            Torna indietro
        </button>
    </div>
</header>

<main class="contenitore pagina-avvisi">
    <header class="testata-avvisi">
        <h1>Avvisi</h1>
        <p>Comunicazioni, aggiornamenti e manutenzioni di Giochi Società.</p>
    </header>

    <div class="griglia-avvisi">
        <section id="pannelloAdmin" class="pannello-admin" aria-labelledby="titoloPannelloAdmin">
            <h2 id="titoloPannelloAdmin">Pubblica un nuovo avviso</h2>
            <div class="form-gruppo">
                <label for="titoloAvviso">Titolo</label>
                <input id="titoloAvviso" type="text" maxlength="120">
            </div>
            <div class="form-gruppo">
                <label for="tipoAvviso">Tipo di avviso</label>
                <select id="tipoAvviso">
                    <option>Informazione</option>
                    <option>Aggiornamento</option>
                    <option>Importante</option>
                    <option>Manutenzione</option>
                    <option>Novità</option>
                </select>
            </div>
            <div class="form-gruppo">
                <label for="testoAvviso">Messaggio</label>
                <textarea id="testoAvviso" maxlength="2000"></textarea>
            </div>
            <button id="btnPubblica" type="button" class="btn-pubblica">Pubblica avviso</button>
        </section>

        <section class="sezione-avvisi" aria-labelledby="titoloListaAvvisi">
            <header class="intestazione-lista">
                <h2 id="titoloListaAvvisi">Comunicazioni dello staff</h2>
                <span id="conteggioAvvisi" role="status"></span>
            </header>
            <div id="listaAvvisi" class="lista-avvisi">
                <div class="stato" role="status">Caricamento avvisi…</div>
            </div>
        </section>
    </div>
</main>

<div id="toast" role="status"></div>
<div id="confermaOverlay" class="conferma-overlay" hidden aria-hidden="true">
    <div class="conferma-box" role="dialog" aria-modal="true" aria-labelledby="confermaTitolo" aria-describedby="confermaTesto">
        <div class="conferma-corpo">
            <h2 class="conferma-titolo" id="confermaTitolo">Conferma</h2>
            <div class="conferma-testo" id="confermaTesto"></div>
        </div>
        <div class="conferma-azioni">
            <button type="button" class="conferma-annulla" id="confermaAnnulla">Annulla</button>
            <button type="button" class="conferma-pericolo" id="confermaAzione">Elimina</button>
        </div>
    </div>
</div>

<script>

const API_BASE =
    "https://api.giochisocieta.com";

const CHIAVE_TOKEN_AUTH = "giochiSocietaAuthToken";
let sonoAdmin = false;

function acquisisciTokenAutenticazioneDaUrl() {
    try {
        const parametriHash = new URLSearchParams(
            window.location.hash.replace(/^#/, "")
        );
        const token = parametriHash.get("auth_token");

        if (token) {
            sessionStorage.setItem(CHIAVE_TOKEN_AUTH, token);
            parametriHash.delete("auth_token");

            const nuovoHash = parametriHash.toString();
            const nuovoUrl =
                window.location.pathname +
                window.location.search +
                (nuovoHash ? "#" + nuovoHash : "");

            window.history.replaceState(null, "", nuovoUrl);
        }
    } catch (errore) {
        console.warn("Impossibile acquisire il token di autenticazione:", errore);
    }
}

function ottieniTokenAutenticazione() {
    try {
        return sessionStorage.getItem(CHIAVE_TOKEN_AUTH) || "";
    } catch (errore) {
        return "";
    }
}

function headersConAutenticazione(headersIniziali) {
    const headers = new Headers(headersIniziali || {});
    const token = ottieniTokenAutenticazione();
    if (token) headers.set("Authorization", "Bearer " + token);
    return headers;
}

function fetchAutenticato(url, opzioni = {}) {
    return fetch(url, {
        ...opzioni,
        credentials: "include",
        headers: headersConAutenticazione(opzioni.headers)
    });
}

async function leggiJsonSicuro(risposta) {
    const tipo = risposta.headers.get("content-type") || "";
    if (!tipo.includes("application/json")) return {};
    try {
        return await risposta.json();
    } catch (errore) {
        return {};
    }
}


/* =========================================================
   UTILITY
   ========================================================= */

function mostraToast(testo) {

    const contenitore =
        document.getElementById("toast");

    const elemento =
        document.createElement("div");

    elemento.className = "toast";
    elemento.textContent = testo;

    contenitore.appendChild(elemento);

    setTimeout(() => {
        elemento.remove();
    }, 3500);
}


function chiediConferma(testo) {
    return new Promise(resolve => {
        const overlay = document.getElementById("confermaOverlay");
        const testoEl = document.getElementById("confermaTesto");
        const annulla = document.getElementById("confermaAnnulla");
        const azione = document.getElementById("confermaAzione");
        const focusPrecedente = document.activeElement;

        testoEl.textContent = testo;
        overlay.hidden = false;
        overlay.setAttribute("aria-hidden", "false");

        const chiudi = valore => {
            overlay.hidden = true;
            overlay.setAttribute("aria-hidden", "true");
            annulla.removeEventListener("click", onAnnulla);
            azione.removeEventListener("click", onAzione);
            overlay.removeEventListener("click", onOverlay);
            document.removeEventListener("keydown", onKeydown);
            focusPrecedente?.focus();
            resolve(valore);
        };

        const onAnnulla = () => chiudi(false);
        const onAzione = () => chiudi(true);
        const onOverlay = evento => { if (evento.target === overlay) chiudi(false); };
        const onKeydown = evento => {
            if (evento.key === "Escape") chiudi(false);
            if (evento.key !== "Tab") return;

            const primo = evento.shiftKey ? azione : annulla;
            const ultimo = evento.shiftKey ? annulla : azione;
            if (document.activeElement === ultimo) {
                evento.preventDefault();
                primo.focus();
            }
        };

        annulla.addEventListener("click", onAnnulla);
        azione.addEventListener("click", onAzione);
        overlay.addEventListener("click", onOverlay);
        document.addEventListener("keydown", onKeydown);
        annulla.focus();
    });
}

const formatoData = new Intl.DateTimeFormat("it-IT", {
    day: "numeric",
    month: "long",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
});


/* =========================================================
   AUTENTICAZIONE
   ========================================================= */

async function avvia() {

    try {

        const risposta =
            await fetchAutenticato(
                API_BASE + "/api/me",
                {
                    credentials: "include",
                    cache: "no-store"
                }
            );

        if (!risposta.ok) {

            window.location.href =
                "login.html?redirect=" +
                encodeURIComponent(
                    window.location.href
                );

            return;
        }

        const utente =
            await risposta.json();

        sonoAdmin =
            utente.ruolo === "admin";

        if (sonoAdmin) {

            document
                .getElementById("pannelloAdmin")
                .classList.add("visibile");

        }

        await caricaAvvisi();

    } catch (errore) {

        mostraErroreAvvisi("Impossibile verificare l'accesso", avvia);
    }
}


/* =========================================================
   CARICAMENTO
   ========================================================= */

async function segnaAvvisiComeLetti(finoA) {
    try {
        const risposta = await fetchAutenticato(
            API_BASE + "/api/avvisi/segna-letti",
            {
                method: "POST",
                cache: "no-store",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({
                    finoA: Math.max(0, Number(finoA) || 0)
                })
            }
        );

        if (!risposta.ok) {
            const dati = await leggiJsonSicuro(risposta);
            console.warn(
                dati.errore ||
                `Impossibile aggiornare lo stato di lettura degli avvisi (${risposta.status}).`
            );
            return false;
        }

        window.parent.postMessage({
            tipo: "avvisiLetti",
            nonLetti: 0
        }, "*");

        return true;
    } catch (errore) {
        console.warn("Impossibile segnare gli avvisi come letti:", errore);
        return false;
    }
}

async function caricaAvvisi() {

    try {

        const risposta =
            await fetch(
                API_BASE + "/api/avvisi",
                {
                    credentials: "include",
                    cache: "no-store"
                }
            );

        if (!risposta.ok) {

            throw new Error(
                "Errore caricamento."
            );
        }

        const dati =
            await leggiJsonSicuro(risposta);

        const avvisiCaricati =
            Array.isArray(dati.avvisi)
                ? dati.avvisi
                : [];

        renderAvvisi(avvisiCaricati);

        const ultimoAvvisoVisualizzatoIl =
            avvisiCaricati.reduce(
                (massimo, avviso) =>
                    Math.max(
                        massimo,
                        Number(avviso && avviso.data) || 0
                    ),
                0
            );

        await segnaAvvisiComeLetti(
            ultimoAvvisoVisualizzatoIl
        );

    } catch (errore) {

        mostraErroreAvvisi("Impossibile caricare gli avvisi", caricaAvvisi);
    }
}


/* =========================================================
   RENDER
   ========================================================= */

function mostraErroreAvvisi(titolo, riprova) {
    const contenitore = document.getElementById("listaAvvisi");
    document.getElementById("conteggioAvvisi").textContent = "";
    contenitore.innerHTML = `
        <div class="stato">
            <div role="alert">
                <strong></strong>
                <p>Controlla la connessione e riprova.</p>
            </div>
            <button type="button" class="btn-riprova">Riprova</button>
        </div>
    `;
    contenitore.querySelector("strong").textContent = titolo;
    const bottone = contenitore.querySelector(".btn-riprova");
    bottone.addEventListener("click", () => {
        bottone.disabled = true;
        bottone.textContent = "Caricamento…";
        riprova();
    });
}

function renderAvvisi(avvisi) {
    const contenitore = document.getElementById("listaAvvisi");
    const numero = avvisi.length;
    document.getElementById("conteggioAvvisi").textContent = numero ?
        numero + (numero === 1 ? " avviso" : " avvisi") : "";

    if (!numero) {
        contenitore.innerHTML = '<div class="stato" role="status"><strong>Nessun avviso</strong></div>';
        return;
    }

    const schede = document.createDocumentFragment();
    for (const avviso of avvisi) {
        const scheda = document.createElement("article");
        scheda.className = "avviso";
        scheda.classList.toggle("super-importante", avviso.tipo === "Importante");
        scheda.innerHTML = `
            <header class="avviso-header">
                <div class="avviso-meta"><span class="avviso-tipo"></span></div>
                <h3 class="avviso-titolo"></h3>
            </header>
            <p class="avviso-testo"></p>
            <footer class="avviso-footer"><span class="avviso-autore"></span></footer>
        `;
        scheda.querySelector(".avviso-tipo").textContent = avviso.tipo || "Informazione";
        scheda.querySelector(".avviso-titolo").textContent = avviso.titolo || "Avviso";
        scheda.querySelector(".avviso-testo").textContent = avviso.messaggio || "";
        scheda.querySelector(".avviso-autore").textContent = "Pubblicato da " + (avviso.pubblicatoDa || "Staff");

        const data = new Date(avviso.data);
        if (avviso.data && Number.isFinite(data.getTime())) {
            const tempo = document.createElement("time");
            tempo.className = "avviso-data";
            tempo.dateTime = data.toISOString();
            tempo.textContent = formatoData.format(data);
            scheda.querySelector(".avviso-meta").append(tempo);
        }

        if (sonoAdmin) {
            const elimina = document.createElement("button");
            elimina.type = "button";
            elimina.className = "btn-elimina";
            elimina.textContent = "Elimina";
            elimina.addEventListener("click", () => eliminaAvviso(avviso.id));
            scheda.querySelector(".avviso-footer").append(elimina);
        }

        schede.append(scheda);
    }
    contenitore.replaceChildren(schede);
}


/* =========================================================
   PUBBLICAZIONE
   ========================================================= */

document
    .getElementById("btnPubblica")
    .addEventListener(
        "click",
        pubblicaAvviso
    );

async function pubblicaAvviso() {

    const bottone =
        document.getElementById(
            "btnPubblica"
        );

    const titolo =
        document.getElementById(
            "titoloAvviso"
        ).value.trim();

    const tipo =
        document.getElementById(
            "tipoAvviso"
        ).value;

    const messaggio =
        document.getElementById(
            "testoAvviso"
        ).value.trim();

    if (!titolo) {

        mostraToast(
            "Inserisci un titolo."
        );

        return;
    }

    if (!messaggio) {

        mostraToast(
            "Inserisci il testo dell'avviso."
        );

        return;
    }

    bottone.disabled = true;
    bottone.textContent =
        "Pubblicazione...";

    try {

        const risposta =
            await fetchAutenticato(
                API_BASE +
                "/api/admin/avvisi",
                {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        titolo,
                        tipo,
                        messaggio
                    })
                }
            );

        const dati =
            await leggiJsonSicuro(risposta);

        if (!risposta.ok) {

            mostraToast(
                dati.errore ||
                `Impossibile pubblicare l'avviso (errore ${risposta.status}).`
            );

            return;
        }

        document.getElementById(
            "titoloAvviso"
        ).value = "";

        document.getElementById(
            "testoAvviso"
        ).value = "";

        mostraToast(
            "Avviso pubblicato."
        );

        await caricaAvvisi();

    } catch (errore) {

        console.error("Errore pubblicazione avviso:", errore);
        mostraToast(
            "Impossibile raggiungere il server. Controlla la connessione e riprova."
        );

    } finally {

        bottone.disabled = false;

        bottone.textContent =
            "Pubblica avviso";
    }
}


/* =========================================================
   ELIMINAZIONE
   ========================================================= */

async function eliminaAvviso(id) {

    const confermato = await chiediConferma(
        "Vuoi davvero eliminare questo avviso? L'operazione non può essere annullata."
    );

    if (!confermato) return;

    try {

        const risposta =
            await fetchAutenticato(
                API_BASE +
                "/api/admin/avvisi/" +
                encodeURIComponent(id),
                {
                    method: "DELETE",
                    credentials: "include"
                }
            );

        const dati =
            await leggiJsonSicuro(risposta);

        if (!risposta.ok) {

            mostraToast(
                dati.errore ||
                `Impossibile eliminare l'avviso (errore ${risposta.status}).`
            );

            return;
        }

        mostraToast(
            "Avviso eliminato."
        );

        await caricaAvvisi();

    } catch (errore) {

        mostraToast(
            "Errore di connessione."
        );
    }
}

acquisisciTokenAutenticazioneDaUrl();
avvia();

</script>
