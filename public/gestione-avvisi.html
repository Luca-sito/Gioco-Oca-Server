<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Gestione avvisi | Giochi Società</title>

<style>

* {
    box-sizing: border-box;
}

:root {
    --verde: #178861;
    --verde-scuro: #106d4d;
    --verde-chiaro: #eaf7f1;

    --testo: #17222b;
    --testo-2: #55636e;
    --testo-3: #8b97a1;

    --sfondo: #eef2f5;
    --superficie: #ffffff;

    --bordo: #e1e7eb;

    --ombra:
        0 10px 35px rgba(20, 31, 40, 0.07);
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;

    background:
        linear-gradient(
            180deg,
            #f5f7f9 0%,
            #eef2f5 100%
        );

    color: var(--testo);

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body {
    padding: 30px 18px 50px;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    border: 0;
}

.contenitore {
    width: min(1100px, 100%);
    margin: 0 auto;
}

/* =========================================================
   HEADER
   ========================================================= */

.intestazione {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;

    gap: 20px;

    margin-bottom: 24px;
}

.etichetta {
    margin-bottom: 7px;

    color: var(--verde);

    font-size: 11px;
    font-weight: 800;

    letter-spacing: 1.2px;
    text-transform: uppercase;
}

h1 {
    margin: 0;

    font-size: 31px;
    line-height: 1.1;
    font-weight: 800;

    letter-spacing: -0.8px;
}

.sottotitolo {
    margin-top: 8px;

    color: var(--testo-3);

    font-size: 14px;
    line-height: 1.5;
}

.btn-indietro {
    width: 44px;
    height: 44px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border: 1px solid #e1e6ea;
    border-radius: 12px;

    background: #ffffff;
    color: #586570;

    cursor: pointer;

    transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease;
}

.btn-indietro:hover {
    background: #f3f7f5;
    border-color: #cfe0d9;

    transform: translateY(-1px);
}

.btn-indietro svg {
    width: 19px;
    height: 19px;
}

/* =========================================================
   PANNELLO
   ========================================================= */

.pannello {
    padding: 24px;

    border: 1px solid var(--bordo);
    border-radius: 20px;

    background: var(--superficie);

    box-shadow: var(--ombra);

    margin-bottom: 22px;
}

.pannello-titolo {
    margin-bottom: 18px;

    font-size: 19px;
    font-weight: 800;
}

.form-gruppo {
    margin-bottom: 14px;
}

.form-gruppo label {
    display: block;

    margin-bottom: 6px;

    color: var(--testo-2);

    font-size: 12px;
    font-weight: 750;
}

.form-gruppo input,
.form-gruppo textarea,
.form-gruppo select {
    width: 100%;

    border: 1px solid #dce4e8;
    border-radius: 11px;

    background: #ffffff;
    color: var(--testo);

    outline: none;
}

.form-gruppo input,
.form-gruppo select {
    height: 46px;
    padding: 0 13px;
}

.form-gruppo textarea {
    min-height: 150px;

    padding: 12px 13px;

    resize: vertical;
}

.form-gruppo input:focus,
.form-gruppo textarea:focus,
.form-gruppo select:focus {
    border-color: #99d1bb;

    box-shadow:
        0 0 0 3px
        rgba(23, 136, 97, 0.07);
}

.btn-pubblica {
    min-height: 46px;

    padding: 0 21px;

    border-radius: 11px;

    background: var(--verde);
    color: #ffffff;

    font-size: 13px;
    font-weight: 800;

    cursor: pointer;

    transition:
        background .18s ease,
        transform .18s ease;
}

.btn-pubblica:hover {
    background: var(--verde-scuro);
    transform: translateY(-1px);
}

.btn-pubblica:disabled {
    opacity: .55;
    cursor: default;
    transform: none;
}

/* =========================================================
   AVVISI PUBBLICATI
   ========================================================= */

.lista-avvisi {
    display: flex;
    flex-direction: column;

    gap: 14px;
}

.avviso {
    padding: 21px 23px;

    border:
        1px solid var(--bordo);

    border-radius: 17px;

    background: #ffffff;

    box-shadow: var(--ombra);
}

.avviso.importante {
    border-color: #efd9aa;

    background:
        linear-gradient(
            135deg,
            #fffaf1,
            #ffffff
        );
}

.avviso-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    gap: 15px;
}

.avviso-titolo {
    margin: 0;

    font-size: 18px;
    line-height: 1.25;
    font-weight: 800;
}

.avviso-meta {
    display: flex;
    align-items: center;

    gap: 8px;

    flex-wrap: wrap;

    margin-top: 8px;
}

.avviso-tipo {
    padding: 5px 9px;

    border-radius: 999px;

    background: var(--verde-chiaro);
    color: var(--verde-scuro);

    font-size: 10px;
    font-weight: 800;
}

.avviso.importante .avviso-tipo {
    background: #fff0cc;
    color: #996500;
}

.avviso-data {
    color: var(--testo-3);

    font-size: 10px;
}

.avviso-testo {
    margin-top: 16px;

    color: var(--testo-2);

    font-size: 14px;
    line-height: 1.75;

    white-space: pre-wrap;
}

.avviso-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 10px;

    margin-top: 17px;
    padding-top: 12px;

    border-top: 1px solid #edf1f3;
}

.autore {
    color: #96a1a8;
    font-size: 10px;
}

.btn-elimina {
    padding: 6px 10px;

    border-radius: 8px;

    background: #fff2f2;
    color: #c43b43;

    font-size: 10px;
    font-weight: 750;

    cursor: pointer;
}

.btn-elimina:hover {
    background: #ffe3e3;
}

/* =========================================================
   ACCESSO NEGATO
   ========================================================= */

.accesso-negato {
    width: min(500px, 100%);

    margin: 100px auto;

    padding: 35px 25px;

    border:
        1px solid var(--bordo);

    border-radius: 20px;

    background: #ffffff;

    box-shadow: var(--ombra);

    text-align: center;
}

.accesso-negato-icon {
    width: 66px;
    height: 66px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 18px;

    border-radius: 18px;

    background: #fff3f3;
    color: #cf4148;
}

.accesso-negato-icon svg {
    width: 31px;
    height: 31px;
}

.accesso-negato h2 {
    margin: 0 0 8px;

    font-size: 21px;
}

.accesso-negato p {
    margin: 0;

    color: var(--testo-3);

    font-size: 13px;
    line-height: 1.6;
}

/* =========================================================
   TOAST
   ========================================================= */

#toast {
    position: fixed;

    right: 20px;
    bottom: 20px;

    z-index: 1000;
}

.toast {
    padding: 12px 15px;

    border-radius: 11px;

    background: #18232d;
    color: #ffffff;

    box-shadow:
        0 12px 35px rgba(20,31,40,.2);

    font-size: 13px;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    body {
        padding:
            16px
            10px
            35px;
    }

    h1 {
        font-size: 25px;
    }

    .sottotitolo {
        font-size: 12px;
    }

    .pannello {
        padding: 17px;
        border-radius: 16px;
    }

    .avviso {
        padding: 17px;
        border-radius: 15px;
    }

    .avviso-header {
        flex-direction: column;
    }

    .avviso-titolo {
        font-size: 17px;
    }

    .avviso-testo {
        font-size: 13px;
    }

    #toast {
        right: 10px;
        bottom: 10px;
        left: 10px;
    }

    .toast {
        width: 100%;
    }
}

</style>

</head>

<body>

<div id="contenutoPagina">

    <!-- viene riempito dopo il controllo admin -->

</div>

<div id="toast"></div>


<script>

const API_BASE =
    "https://gioco-oca-server.onrender.com";

let avvisiCache = [];


/* =========================================================
   UTILITY
   ========================================================= */

function mostraToast(testo) {

    const contenitore =
        document.getElementById("toast");

    const elemento =
        document.createElement("div");

    elemento.className =
        "toast";

    elemento.textContent =
        testo;

    contenitore.appendChild(
        elemento
    );

    setTimeout(() => {
        elemento.remove();
    }, 3500);
}

function formatoData(timestamp) {

    if (!timestamp) {
        return "";
    }

    return new Date(
        Number(timestamp)
    ).toLocaleString(
        "it-IT",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================================================
   AUTENTICAZIONE ADMIN
   ========================================================= */

async function controllaAccesso() {

    try {

        const risposta =
            await fetch(
                API_BASE + "/api/me",
                {
                    credentials: "include",
                    cache: "no-store"
                }
            );

        if (!risposta.ok) {

            vaiAlLogin();

            return;
        }

        const utente =
            await risposta.json();

        if (
            !utente ||
            utente.ruolo !== "admin"
        ) {

            mostraAccessoNegato();

            return;
        }

        mostraPaginaAdmin();

        await caricaAvvisi();

    } catch (errore) {

        mostraAccessoNegato();
    }
}

function vaiAlLogin() {

    window.location.href =
        "login.html?redirect=" +
        encodeURIComponent(
            window.location.href
        );
}


/* =========================================================
   ACCESSO NEGATO
   ========================================================= */

function mostraAccessoNegato() {

    document.getElementById(
        "contenutoPagina"
    ).innerHTML = `

        <div class="accesso-negato">

            <div class="accesso-negato-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <rect
                        x="4"
                        y="10"
                        width="16"
                        height="11"
                        rx="2"
                    ></rect>

                    <path
                        d="M8 10V7a4 4 0 0 1 8 0v3"
                    ></path>

                </svg>

            </div>

            <h2>
                Accesso non autorizzato
            </h2>

            <p>
                Questa sezione è riservata
                agli amministratori di
                Giochi Società.
            </p>

        </div>
    `;
}


/* =========================================================
   PAGINA ADMIN
   ========================================================= */

function mostraPaginaAdmin() {

    document.getElementById(
        "contenutoPagina"
    ).innerHTML = `

        <div class="contenitore">

            <header class="intestazione">

                <div>

                    <div class="etichetta">
                        Giochi Società · Amministrazione
                    </div>

                    <h1>
                        Gestione avvisi
                    </h1>

                    <div class="sottotitolo">
                        Pubblica comunicazioni importanti
                        per gli utenti della piattaforma.
                    </div>

                </div>

                <button
                    type="button"
                    class="btn-indietro"
                    title="Torna indietro"
                    onclick="history.back()"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M15 18l-6-6 6-6"></path>
                    </svg>
                </button>

            </header>


            <section class="pannello">

                <div class="pannello-titolo">
                    Pubblica nuovo avviso
                </div>

                <div class="form-gruppo">

                    <label for="titoloAvviso">
                        Titolo
                    </label>

                    <input
                        id="titoloAvviso"
                        type="text"
                        maxlength="120"
                        placeholder="Es. Importante aggiornamento"
                    >

                </div>

                <div class="form-gruppo">

                    <label for="tipoAvviso">
                        Categoria
                    </label>

                    <select id="tipoAvviso">

                        <option value="Informazione">
                            Informazione
                        </option>

                        <option value="Aggiornamento">
                            Aggiornamento
                        </option>

                        <option value="Importante">
                            Importante
                        </option>

                        <option value="Manutenzione">
                            Manutenzione
                        </option>

                        <option value="Novità">
                            Novità
                        </option>

                    </select>

                </div>

                <div class="form-gruppo">

                    <label for="messaggioAvviso">
                        Testo dell'avviso
                    </label>

                    <textarea
                        id="messaggioAvviso"
                        maxlength="2000"
                        placeholder="Scrivi qui il messaggio che riceveranno gli utenti..."
                    ></textarea>

                </div>

                <button
                    type="button"
                    id="btnPubblica"
                    class="btn-pubblica"
                >
                    Pubblica avviso
                </button>

            </section>


            <section>

                <div
                    class="pannello-titolo"
                    style="margin-bottom:14px;"
                >
                    Avvisi pubblicati
                </div>

                <div
                    id="listaAvvisi"
                    class="lista-avvisi"
                >
                    <div>
                        Caricamento...
                    </div>
                </div>

            </section>

        </div>
    `;

    document
        .getElementById("btnPubblica")
        .addEventListener(
            "click",
            pubblicaAvviso
        );
}


/* =========================================================
   CARICAMENTO AVVISI
   ========================================================= */

async function caricaAvvisi() {

    try {

        const risposta =
            await fetch(
                API_BASE + "/api/avvisi",
                {
                    credentials: "include",
                    cache: "no-store"
                }
            );

        const dati =
            await risposta.json();

        if (!risposta.ok) {
            throw new Error(
                dati.errore ||
                "Errore."
            );
        }

        avvisiCache =
            Array.isArray(dati.avvisi)
                ? dati.avvisi
                : [];

        renderAvvisi();

    } catch (errore) {

        const lista =
            document.getElementById(
                "listaAvvisi"
            );

        if (lista) {

            lista.innerHTML = `
                <div>
                    Impossibile caricare gli avvisi.
                </div>
            `;
        }
    }
}


/* =========================================================
   RENDER
   ========================================================= */

function renderAvvisi() {

    const lista =
        document.getElementById(
            "listaAvvisi"
        );

    if (!lista) return;

    lista.innerHTML = "";

    if (!avvisiCache.length) {

        lista.innerHTML = `
            <div
                style="
                    padding:30px 0;
                    color:#8b97a1;
                "
            >
                Non hai ancora pubblicato nessun avviso.
            </div>
        `;

        return;
    }

    avvisiCache.forEach(
        avviso => {

            const elemento =
                document.createElement(
                    "article"
                );

            elemento.className =
                "avviso" +
                (
                    avviso.tipo === "Importante"
                        ? " importante"
                        : ""
                );


            const header =
                document.createElement(
                    "div"
                );

            header.className =
                "avviso-header";


            const sinistra =
                document.createElement(
                    "div"
                );


            const titolo =
                document.createElement(
                    "h2"
                );

            titolo.className =
                "avviso-titolo";

            titolo.textContent =
                avviso.titolo ||
                "Avviso";


            const meta =
                document.createElement(
                    "div"
                );

            meta.className =
                "avviso-meta";


            const tipo =
                document.createElement(
                    "span"
                );

            tipo.className =
                "avviso-tipo";

            tipo.textContent =
                avviso.tipo ||
                "Informazione";


            const data =
                document.createElement(
                    "span"
                );

            data.className =
                "avviso-data";

            data.textContent =
                formatoData(
                    avviso.data
                );


            meta.appendChild(tipo);
            meta.appendChild(data);

            sinistra.appendChild(titolo);
            sinistra.appendChild(meta);

            header.appendChild(
                sinistra
            );

            elemento.appendChild(
                header
            );


            const testo =
                document.createElement(
                    "div"
                );

            testo.className =
                "avviso-testo";

            testo.textContent =
                avviso.messaggio ||
                "";

            elemento.appendChild(
                testo
            );


            const footer =
                document.createElement(
                    "div"
                );

            footer.className =
                "avviso-footer";


            const autore =
                document.createElement(
                    "div"
                );

            autore.className =
                "autore";

            autore.textContent =
                "Pubblicato da " +
                (
                    avviso.pubblicatoDa ||
                    "Amministratore"
                );


            const elimina =
                document.createElement(
                    "button"
                );

            elimina.type =
                "button";

            elimina.className =
                "btn-elimina";

            elimina.textContent =
                "Elimina";

            elimina.addEventListener(
                "click",
                () =>
                    eliminaAvviso(
                        avviso.id
                    )
            );


            footer.appendChild(
                autore
            );

            footer.appendChild(
                elimina
            );

            elemento.appendChild(
                footer
            );

            lista.appendChild(
                elemento
            );
        }
    );
}


/* =========================================================
   PUBBLICAZIONE
   ========================================================= */

async function pubblicaAvviso() {

    const titoloInput =
        document.getElementById(
            "titoloAvviso"
        );

    const tipoInput =
        document.getElementById(
            "tipoAvviso"
        );

    const messaggioInput =
        document.getElementById(
            "messaggioAvviso"
        );

    const bottone =
        document.getElementById(
            "btnPubblica"
        );

    const titolo =
        titoloInput.value.trim();

    const tipo =
        tipoInput.value;

    const messaggio =
        messaggioInput.value.trim();


    if (!titolo) {

        mostraToast(
            "Inserisci il titolo."
        );

        return;
    }

    if (!messaggio) {

        mostraToast(
            "Scrivi il testo dell'avviso."
        );

        return;
    }


    bottone.disabled = true;

    bottone.textContent =
        "Pubblicazione...";


    try {

        const risposta =
            await fetch(
                API_BASE +
                "/api/admin/avvisi",
                {
                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            titolo,
                            tipo,
                            messaggio
                        })
                }
            );


        const dati =
            await risposta.json();


        if (!risposta.ok) {

            mostraToast(
                dati.errore ||
                "Impossibile pubblicare."
            );

            return;
        }


        titoloInput.value = "";
        messaggioInput.value = "";


        mostraToast(
            "Avviso pubblicato e notifiche inviate."
        );


        await caricaAvvisi();

    } catch (errore) {

        mostraToast(
            "Errore di connessione."
        );

    } finally {

        bottone.disabled = false;

        bottone.textContent =
            "Pubblica avviso";
    }
}


/* =========================================================
   ELIMINAZIONE
   ========================================================= */

async function eliminaAvviso(id) {

    if (
        !confirm(
            "Vuoi davvero eliminare questo avviso?"
        )
    ) {
        return;
    }


    try {

        const risposta =
            await fetch(
                API_BASE +
                "/api/admin/avvisi/" +
                encodeURIComponent(id),
                {
                    method: "DELETE",
                    credentials: "include"
                }
            );


        const dati =
            await risposta.json();


        if (!risposta.ok) {

            mostraToast(
                dati.errore ||
                "Impossibile eliminare l'avviso."
            );

            return;
        }


        mostraToast(
            "Avviso eliminato."
        );


        await caricaAvvisi();

    } catch (errore) {

        mostraToast(
            "Errore di connessione."
        );
    }
}


controllaAccesso();

</script>

</body>
</html>
