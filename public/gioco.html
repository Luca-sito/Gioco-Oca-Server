<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gioco dell'Oca - Partita</title>
<link rel="stylesheet" href="gioco.css">
</head>
<body>

<div id="scena">

  <div id="area-tabellone">
    <img id="immagine-tabellone" src="https://gioco-oca-server.onrender.com/Immagini/tabellone.png" alt="Tabellone">
    <div id="contenitore-pedine"></div>
    <div id="area-dadi" class="disabilitato" title="Clicca per tirare">
      <div id="dado1"></div>
      <div id="dado2"></div>
    </div>
  </div>

  <div id="pannello-giocatori">
    <div id="riga-turno">Caricamento...</div>
    <div id="lista-giocatori"></div>
  </div>

  <div id="menu-wrapper">
    <button id="btn-menu" title="Menu">☰</button>
    <div id="pannello-menu" class="nascosto">
      <button onclick="apriProfilo()">👤 Profilo</button>
      <button onclick="apriImpostazioni()">⚙️ Impostazioni</button>
      <button class="voce-pericolo" onclick="abbandonaPartita()">🚪 Abbandona partita</button>
    </div>
  </div>

  <div id="messaggi-gioco"></div>
  <div id="media-wrapper">
    <div id="media-stato"></div>
    <div id="media-videos"></div>
    <div id="media-controls">
      <button id="btn-microfono" type="button">🎤 Microfono</button>
      <button id="btn-webcam" type="button">📷 Webcam</button>
    </div>
  </div>


  <style>
    /* ===== CHAT AUDIO/VIDEO ===== */
    #media-wrapper {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 1200;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      pointer-events: none;
    }
    #media-controls {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    #media-controls button {
      border: 0;
      border-radius: 12px;
      padding: 9px 12px;
      background: rgba(20,20,20,.9);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,.25);
      font-weight: 600;
    }
    #media-controls button:hover { filter: brightness(1.12); }
    #media-videos {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 180px));
      gap: 8px;
      max-width: min(70vw, 580px);
      pointer-events: auto;
    }
    .media-tile {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #151515;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(0,0,0,.28);
    }
    .media-tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #111;
    }
    .media-tile .media-name {
      position: absolute;
      left: 7px;
      bottom: 6px;
      padding: 4px 7px;
      border-radius: 8px;
      background: rgba(0,0,0,.65);
      color: #fff;
      font-size: 12px;
      max-width: calc(100% - 14px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .media-tile.audio-only::before {
      content: "🎤";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 34px;
      background: radial-gradient(circle at center, #262626 0, #111 70%);
      z-index: 0;
    }
    .media-tile.audio-only video { opacity: 0; }
    #media-stato {
      color: #fff;
      background: rgba(20,20,20,.9);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,.2);
      display: none;
    }
    @media (max-width: 700px) {
      #media-wrapper { left: 10px; bottom: 10px; }
      #media-videos { grid-template-columns: repeat(2, minmax(110px, 150px)); max-width: 86vw; }
      #media-controls button { padding: 8px 10px; font-size: 12px; }
    }
  </style>

  <div id="chat-wrapper">
    <button id="btn-chat" title="Apri chat">💬</button>
    <div id="pannello-chat" class="nascosto">
      <div id="chat-messaggi"></div>
      <div id="chat-input-riga">
        <input id="chat-input" placeholder="Scrivi un messaggio">
        <button onclick="inviaChatPartita()">➤</button>
      </div>
    </div>
  </div>

</div>

<div id="overlay-vittoria" class="overlay">
  <div class="popup-vittoria">
    <h2 id="testo-vincitore"></h2>
    <button onclick="tornaAllaLobby()">Torna alla Lobby</button>
  </div>
</div>

<script src="gioco.js"></script>
</body>
</html>
