              <span

<!-- =========================================================
     STILE DEL SOLO CARICAMENTO
     ========================================================= -->

<style>

#overlay-caricamento {

  position: fixed;

  inset: 0;

  z-index: 999999;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    rgba(115, 115, 115, 0.56);

  backdrop-filter:
    grayscale(1)
    saturate(0)
    brightness(0.76);

  -webkit-backdrop-filter:
    grayscale(1)
    saturate(0)
    brightness(0.76);

  cursor: wait;

  transition:
    opacity 0.45s ease,
    visibility 0.45s ease;

}


#overlay-caricamento::before {

  content: "";

  position: absolute;

  inset: 0;

  background:
    rgba(80, 80, 80, 0.12);

  pointer-events: none;

}


#caricamento-box {

  position: relative;

  z-index: 2;

  width: min(
    360px,
    calc(100vw - 34px)
  );

  min-height: 185px;

  padding:
    28px 25px 30px;

  box-sizing: border-box;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

  background:
    rgba(248, 248, 248, 0.98);

  border:
    1px solid rgba(0, 0, 0, 0.10);

  border-radius: 16px;

  box-shadow:
    0 18px 55px
    rgba(0, 0, 0, 0.28);

}


#caricamento-logo {

  margin-bottom: 24px;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size: 16px;

  line-height: 1;

  font-weight: 900;

  letter-spacing:
    0.09em;

  color:
    #222;

}


#caricamento-spinner {

  width: 43px;

  height: 43px;

  margin-bottom: 22px;

  box-sizing: border-box;

  border-radius: 50%;

  border:
    4px solid
    rgba(0, 0, 0, 0.10);

  border-top-color:
    #222;

  animation:
    caricamento-rotazione
    0.8s
    linear
    infinite;

}


#caricamento-testo {

  min-height: 21px;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  font-size: 17px;

  line-height: 1.3;

  font-weight: 600;

  color:
    #333;

}


@keyframes caricamento-rotazione {

  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }

}


#overlay-caricamento.caricamento-finito {

  opacity: 0;

  visibility: hidden;

  pointer-events: none;

}


body.caricamento-in-corso #scena,
body.caricamento-in-corso #contenitore-notifiche-gioco {

  filter:
    grayscale(1)
    saturate(0)
    brightness(0.72);

}


body.caricamento-in-corso #scena *,
body.caricamento-in-corso #contenitore-notifiche-gioco * {

  pointer-events: none !important;

}


@media (max-width: 500px) {

  #caricamento-box {

    width:
      calc(100vw - 28px);

    min-height:
      170px;

    padding:
      25px 20px 27px;

    border-radius:
      14px;

  }


  #caricamento-logo {

    font-size:
      14px;

    margin-bottom:
      21px;

  }


  #caricamento-spinner {

    width:
      39px;

    height:
      39px;

    margin-bottom:
      19px;

  }


  #caricamento-testo {

    font-size:
      16px;

  }

}

</style>


<!-- =========================================================
     GESTIONE REALE DEL CARICAMENTO
     ========================================================= -->

<script>

(function () {

  "use strict";


  document.body.classList.add(
    "caricamento-in-corso"
  );


  const overlay =
    document.getElementById(
      "overlay-caricamento"
    );

  const testo =
    document.getElementById(
      "caricamento-testo"
    );

  const immagine =
    document.getElementById(
      "immagine-tabellone"
    );


  function cambiaTesto(t) {

    if (!testo) return;

    testo.textContent = t;

  }


  function attendiImmagine() {

    return new Promise(
      function (resolve) {

        if (
          immagine &&
          immagine.complete &&
          immagine.naturalWidth > 0
        ) {

          if (
            typeof immagine.decode ===
            "function"
          ) {

            immagine.decode()
              .catch(function () {})
              .finally(resolve);

          } else {

            resolve();

          }

          return;

        }


        if (!immagine) {

          resolve();

          return;

        }


        let terminata = false;


        function completa() {

          if (terminata) return;

          terminata = true;

          resolve();

        }


        immagine.addEventListener(
          "load",
          function () {

            if (
              typeof immagine.decode ===
              "function"
            ) {

              immagine.decode()
                .catch(function () {})
                .finally(completa);

            } else {

              completa();

            }

          },
          { once: true }
        );


        immagine.addEventListener(
          "error",
          function () {

            /*
             * Non blocchiamo per sempre la pagina.
             * Il server verrà controllato nella fase successiva.
             */

            completa();

          },
          { once: true }
        );

      }
    );

  }


  async function preparaGrafica() {

    cambiaTesto(
      "Caricamento grafica"
    );

    await attendiImmagine();

    /*
     * Diamo al browser un ciclo di rendering
     * per completare il layout del tabellone.
     */

    await new Promise(
      function (resolve) {

        requestAnimationFrame(
          function () {

            requestAnimationFrame(
              resolve
            );

          }
        );

      }
    );

  }


  async function preparaSuoni() {

    cambiaTesto(
      "Caricamento suoni"
    );


    /*
     * Il tuo gioco non utilizza file audio .mp3:
     * crea i suoni direttamente tramite Web Audio API.
     *
     * Qui prepariamo realmente il sistema audio
     * usato da gioco.js.
     */

    try {

      const C =
        window.AudioContext ||
        window.webkitAudioContext;


      if (C) {

        const ctx =
          new C();


        /*
         * Alcuni browser partono con l'AudioContext
         * in stato "suspended". È normale e non deve
         * impedire l'avvio della partita.
         */

        if (
          ctx.state === "suspended"
        ) {

          try {

            await ctx.resume();

          } catch (e) {

            /*
             * Il browser può impedire resume()
             * senza gesto dell'utente.
             * I suoni del tuo gioco verranno comunque
             * attivati quando sarà possibile.
             */

          }

        }


        try {

          await ctx.close();

        } catch (e) {}

      }

    } catch (e) {

      /*
       * Browser senza Web Audio API:
       * il gioco può comunque funzionare.
       */

    }


    /*
     * Aspettiamo un frame affinché il browser
     * completi la preparazione del contesto pagina.
     */

    await new Promise(
      function (resolve) {

        requestAnimationFrame(
          resolve
        );

      }
    );

  }


  async function preparaServer() {

    cambiaTesto(
      "Caricamento Server"
    );


    /*
     * Verifica reale del server.
     *
     * /api/me è già utilizzato da gioco.js,
     * quindi controlliamo esattamente quella
     * stessa risorsa.
     */

    try {

      const risposta =
        await fetch(
          "https://gioco-oca-server.onrender.com/api/me",
          {
            method: "GET",
            credentials: "include",
            cache: "no-store"
          }
        );


      /*
       * 401 è comunque una risposta del server:
       * significa che il server è online ma l'utente
       * non è autenticato.
       *
       * Il vero controllo di autenticazione verrà
       * poi effettuato da gioco.js.
       */

      if (
        risposta.status >= 500
      ) {

        throw new Error(
          "Server non disponibile"
        );

      }

    } catch (e) {

      /*
       * Fallback: controlliamo direttamente una
       * risorsa statica del server.
       */

      try {

        const controllo =
          await fetch(
            "https://gioco-oca-server.onrender.com/Immagini/tabellone.png?check=" +
            Date.now(),
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!controllo.ok) {

          throw new Error(
            "Server non raggiungibile"
          );

        }

      } catch (erroreFinale) {

        /*
         * Non nascondiamo il problema fingendo
         * che il server sia pronto.
         */

        cambiaTesto(
          "Caricamento Server"
        );

        /*
         * Lasciamo comunque partire gioco.js:
         * sarà lui a gestire l'eventuale mancata
         * autenticazione o riconnessione.
         */

      }

    }

  }


  async function avvia() {

    try {

      /*
       * FASE 1
       */

      await preparaGrafica();


      /*
       * FASE 2
       */

      await preparaSuoni();


      /*
       * FASE 3
       */

      await preparaServer();


      /*
       * Tutto il caricamento preliminare è terminato.
       *
       * Ora parte il vero gioco.js.
       */

      cambiaTesto(
        "Avvio partita"
      );


      await new Promise(
        function (resolve) {

          requestAnimationFrame(
            resolve
          );

        }
      );


      /*
       * Carichiamo gioco.js soltanto adesso.
       */

      const script =
        document.createElement(
          "script"
        );


      script.src =
        "gioco.js";


      script.onload =
        function () {

          /*
           * Lasciamo al gioco un attimo
           * per inizializzare il layout,
           * WebSocket e tabellone.
           */

          requestAnimationFrame(
            function () {

              requestAnimationFrame(
                function () {

                  document.body.classList.remove(
                    "caricamento-in-corso"
                  );


                  overlay.classList.add(
                    "caricamento-finito"
                  );


                  setTimeout(
                    function () {

                      if (overlay) {
                        overlay.remove();
                      }

                    },
                    500
                  );

                }
              );

            }
          );

        };


      script.onerror =
        function () {

          cambiaTesto(
            "Errore nel caricamento della partita"
          );

          console.error(
            "Impossibile caricare gioco.js"
          );

        };


      document.body.appendChild(
        script
      );

    } catch (errore) {

      console.error(
        "Errore durante il caricamento:",
        errore
      );

      /*
       * In caso di errore grave mostriamo
       * comunque il gioco per permettere a
       * gioco.js di gestire il problema.
       */

      document.body.classList.remove(
        "caricamento-in-corso"
      );

      if (overlay) {

        overlay.classList.add(
          "caricamento-finito"
        );

        setTimeout(
          function () {

            overlay.remove();

          },
          500
        );

      }

    }

  }


  avvia();

})();
