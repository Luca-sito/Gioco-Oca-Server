<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gioco dell'Oca - GIOCHI SOCIETA</title>
<link rel="stylesheet" href="gioco.css">
</head>
<body>

<div id="overlay-caricamento" aria-live="polite" aria-atomic="true">
  <div id="caricamento-box">
    <div id="caricamento-logo">GIOCHI SOCIETA</div>
    <div id="caricamento-spinner" aria-hidden="true"></div>
    <div id="caricamento-testo">Caricamento grafica</div>
  </div>
</div>

<div id="banner-disconnesso" class="nascosto">🔴 Connessione persa — riconnessione in corso...</div>

<div id="contenitore-notifiche-gioco"></div>

<div id="scena">
  <div id="mondo-ruotato">

    <div id="flash-messaggio-gioco"><span></span></div>

    <div id="overlay-determinazione" class="overlay">
      <div class="popup-determinazione">
        <h2>🎲 CHI INIZIA?</h2>
        <p class="sottotitolo-determinazione" id="sottotitolo-determinazione">I giocatori tirano i dadi uno alla volta per stabilire l'ordine.</p>
        <div id="lista-determinazione"></div>
        <div id="slot-dadi-determinazione"></div>
      </div>
    </div>

    <div id="popup-richiesta-audio" class="nascosto">
      <div class="popup-richiesta-audio-box">
        <p id="testo-richiesta-audio"></p>
        <div class="richiesta-audio-bottoni">
          <button type="button" class="btn-rifiuta-audio" onclick="rispondiRichiestaAudioRicevuta(false)">Rifiuta</button>
          <button type="button" class="btn-accetta-audio" onclick="rispondiRichiestaAudioRicevuta(true)">Accetta</button>
        </div>
      </div>
    </div>

    <div id="area-tabellone">
      <img id="immagine-tabellone" src="immagini/tabellone.png" alt="Tabellone del Gioco dell'Oca" draggable="false" decoding="async">
      <div id="contenitore-pedine"></div>
      <div id="area-dadi" class="disabilitato" title="Clicca per tirare" role="button" aria-label="Tira i dadi" tabindex="0">
        <div id="dado1" class="dado-3d">
          <div class="cubo">
            <div class="faccia faccia-1"><span class="pip pip-rossa" style="grid-area:2/2;"></span></div>
            <div class="faccia faccia-2"><span class="pip" style="grid-area:1/3;"></span><span class="pip" style="grid-area:3/1;"></span></div>
            <div class="faccia faccia-3"><span class="pip" style="grid-area:1/3;"></span><span class="pip" style="grid-area:2/2;"></span><span class="pip" style="grid-area:3/1;"></span></div>
            <div class="faccia faccia-4"><span class="pip pip-rossa" style="grid-area:1/1;"></span><span class="pip pip-rossa" style="grid-area:1/3;"></span><span class="pip pip-rossa" style="grid-area:3/1;"></span><span class="pip pip-rossa" style="grid-area:3/3;"></span></div>
            <div class="faccia faccia-5"><span class="pip" style="grid-area:1/1;"></span><span class="pip" style="grid-area:1/3;"></span><span class="pip" style="grid-area:2/2;"></span><span class="pip" style="grid-area:3/1;"></span><span class="pip" style="grid-area:3/3;"></span></div>
            <div class="faccia faccia-6"><span class="pip" style="grid-area:1/1;"></span><span class="pip" style="grid-area:2/1;"></span><span class="pip" style="grid-area:3/1;"></span><span class="pip" style="grid-area:1/3;"></span><span class="pip" style="grid-area:2/3;"></span><span class="pip" style="grid-area:3/3;"></span></div>
          </div>
        </div>
        <div id="dado2" class="dado-3d">
          <div class="cubo">
            <div class="faccia faccia-1"><span class="pip pip-rossa" style="grid-area:2/2;"></span></div>
            <div class="faccia faccia-2"><span class="pip" style="grid-area:1/3;"></span><span class="pip" style="grid-area:3/1;"></span></div>
            <div class="faccia faccia-3"><span class="pip" style="grid-area:1/3;"></span><span class="pip" style="grid-area:2/2;"></span><span class="pip" style="grid-area:3/1;"></span></div>
            <div class="faccia faccia-4"><span class="pip pip-rossa" style="grid-area:1/1;"></span><span class="pip pip-rossa" style="grid-area:1/3;"></span><span class="pip pip-rossa" style="grid-area:3/1;"></span><span class="pip pip-rossa" style="grid-area:3/3;"></span></div>
            <div class="faccia faccia-5"><span class="pip" style="grid-area:1/1;"></span><span class="pip" style="grid-area:1/3;"></span><span class="pip" style="grid-area:2/2;"></span><span class="pip" style="grid-area:3/1;"></span><span class="pip" style="grid-area:3/3;"></span></div>
            <div class="faccia faccia-6"><span class="pip" style="grid-area:1/1;"></span><span class="pip" style="grid-area:2/1;"></span><span class="pip" style="grid-area:3/1;"></span><span class="pip" style="grid-area:1/3;"></span><span class="pip" style="grid-area:2/3;"></span><span class="pip" style="grid-area:3/3;"></span></div>
          </div>
        </div>
      </div>
    </div>

    <div id="pannello-giocatori">
      <div id="riga-turno">Caricamento...</div>
      <div id="lista-giocatori"></div>
    </div>

    <div id="giocatori-wrapper">
      <button id="btn-giocatori" type="button" title="Giocatori" aria-label="Apri giocatori">👤</button>
    </div>

    <div id="menu-wrapper">
      <button id="btn-menu" type="button" title="Menu" aria-label="Apri menu">☰</button>
      <div id="pannello-menu" class="nascosto">
        <button type="button" onclick="apriProfilo()">👤 Profilo</button>
        <button type="button" onclick="apriImpostazioni()">⚙️ Impostazioni</button>
        <button id="btn-toggle-suoni" type="button" onclick="toggleSuoni()">🔊 Suoni: On</button>
        <button id="btn-toggle-fullscreen" type="button" onclick="toggleFullscreen()">⛶ Tutto schermo</button>
        <button id="btn-toggle-microfono" type="button" onclick="toggleMicrofono()">🎤 Microfono: Off</button>
        <button class="voce-pericolo" type="button" onclick="abbandonaPartita()">🚪 Abbandona partita</button>
      </div>
    </div>

    <div id="messaggi-gioco"></div>

    <div id="overlay-vittoria" class="overlay">
      <div class="popup-vittoria">
        <h2 id="testo-vincitore"></h2>
        <button type="button" onclick="tornaAllaLobby()">Torna alla Lobby</button>
      </div>
    </div>

  </div>

  <div id="backdrop-giocatori"></div>

  <div id="chat-wrapper">
    <button id="btn-chat" type="button" title="Apri chat" aria-label="Apri chat">💬<span id="badge-chat-partita" class="badge-chat-partita" style="display:none;">0</span></button>
    <div id="pannello-chat" class="nascosto">
      <div id="chat-messaggi"></div>
      <div id="chat-input-riga">
        <input id="chat-input" type="text" placeholder="Scrivi un messaggio" autocomplete="off" maxlength="500">
        <button type="button" onclick="inviaChatPartita()" aria-label="Invia messaggio">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  document.body.classList.add("caricamento-in-corso");
  const overlay = document.getElementById("overlay-caricamento");
  const testo = document.getElementById("caricamento-testo");
  const immagine = document.getElementById("immagine-tabellone");

  function cambiaTesto(t) { if (testo) testo.textContent = t; }

  function attendiImmagine() {
    return new Promise(function (resolve) {
      if (immagine && immagine.complete && immagine.naturalWidth > 0) {
        if (typeof immagine.decode === "function") immagine.decode().catch(function () {}).finally(resolve);
        else resolve();
        return;
      }
      if (!immagine) { resolve(); return; }
      let terminata = false;
      function completa() { if (terminata) return; terminata = true; resolve(); }
      immagine.addEventListener("load", function () {
        if (typeof immagine.decode === "function") immagine.decode().catch(function () {}).finally(completa);
        else completa();
      }, { once: true });
      immagine.addEventListener("error", function () { completa(); }, { once: true });
    });
  }

  async function preparaGrafica() {
    cambiaTesto("Caricamento grafica");
    await attendiImmagine();
    await new Promise(function (resolve) { requestAnimationFrame(function () { requestAnimationFrame(resolve); }); });
  }

  async function preparaSuoni() {
    cambiaTesto("Caricamento suoni");
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (C) {
        const ctx = new C();
        if (ctx.state === "suspended") { try { await ctx.resume(); } catch (e) {} }
        try { await ctx.close(); } catch (e) {}
      }
    } catch (e) {}
    await new Promise(function (resolve) { requestAnimationFrame(resolve); });
  }

  async function preparaServer() {
    cambiaTesto("Caricamento Server");
    try {
      const risposta = await fetch("https://gioco-oca-server.onrender.com/api/me", { method: "GET", credentials: "include", cache: "no-store" });
      if (risposta.status >= 500) throw new Error("Server non disponibile");
    } catch (e) {
      try {
        const controllo = await fetch("https://gioco-oca-server.onrender.com/immagini/tabellone.png?check=" + Date.now(), { method: "GET", cache: "no-store" });
        if (!controllo.ok) throw new Error("Server non raggiungibile");
      } catch (erroreFinale) {
        cambiaTesto("Caricamento Server");
      }
    }
  }

  async function avviaCaricamento() {
    try {
      await preparaGrafica();
      await preparaSuoni();
      await preparaServer();
      cambiaTesto("Avvio partita");
      await new Promise(function (resolve) { requestAnimationFrame(resolve); });

      const script = document.createElement("script");
      script.src = "gioco.js";
      script.onload = function () {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            document.body.classList.remove("caricamento-in-corso");
            overlay.classList.add("caricamento-finito");
            setTimeout(function () { if (overlay) overlay.remove(); }, 500);
          });
        });
      };
      script.onerror = function () {
        cambiaTesto("Errore nel caricamento della partita");
        console.error("Impossibile caricare gioco.js");
      };
      document.body.appendChild(script);
    } catch (errore) {
      console.error("Errore durante il caricamento:", errore);
      document.body.classList.remove("caricamento-in-corso");
      if (overlay) { overlay.classList.add("caricamento-finito"); setTimeout(function () { overlay.remove(); }, 500); }
    }
  }
  avviaCaricamento();
})();
</script>
</body>
</html>
