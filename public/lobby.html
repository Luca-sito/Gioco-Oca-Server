<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gioco di Società - Lobby</title>
<style>
*{ box-sizing:border-box; font-family:Arial,sans-serif; }
body{ margin:0; background:#f2f2f2; }
.contenitore{ display:flex; height:100vh; gap:5px; padding:5px; }
.sinistra,.centro,.destra{ background:white; border:2px solid #ff6600; border-radius:5px; overflow:hidden; }
.sinistra{ width:25%; } .centro{ width:50%; }
.destra{ width:25%; overflow-y:auto; }
h2{ margin:0; padding:12px; background:#111; color:white; text-align:center; font-size:18px; }
.box{ padding:15px; } .box p{ font-weight:bold; }
select,button,input{ width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #ccc; font-size:15px; }
button{ cursor:pointer; background:#333; color:white; font-weight:bold; }
button:hover{ opacity:0.8; }
button:disabled{ background:#ccc; cursor:not-allowed; opacity:1; }
.crea{ background:#ffc400; color:#000; }
.elimina{ background:#dc3545; color:white; }
#partite{ height:45%; overflow-y:auto; padding:10px; }
.partita{ border:1px solid #ddd; padding:12px; margin-bottom:10px; border-radius:8px; background:#fafafa; }
.partita button{ background:#ff6600; color:#fff; margin-top:8px; }
.partita button:disabled{ background:#ccc; cursor:not-allowed; }
#chat{ height:39%; margin-left:10px; border-top:1px solid #ddd; padding:10px; overflow-y:auto; background:#fff; }
.messaggio{ padding:5px; border-bottom:1px dashed #ddd; }
#messaggio{ width:75%; display:inline-block; }
#messaggio+button{ width:23%; display:inline-block; }
#top{ padding:10px; }
#online{ color:#00a000; font-size:25px; font-weight:bold; }
.utente-box{ padding:15px; text-align:center; }
.avatar-container{ display:flex; justify-content:center; }
.nickname{ font-weight:bold; margin-top:10px; }
.nickname-riga{ font-weight:bold; }
.dispositivo{ margin-top:8px; font-size:14px; color:#555; font-weight:bold; }
#listaOnline{ max-height:500px; overflow-y:auto; padding:10px; }
.giocatore-online{ display:flex; align-items:center; gap:10px; padding:10px; border-bottom:1px solid #ddd; }
.avatar-mini{ width:40px; height:40px; border-radius:50%; object-fit:cover; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:#43a047; color:white; font-weight:bold; font-size:16px; }
.avatar{ width:70px; height:70px; border-radius:50%; object-fit:cover; border:3px solid #222; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; font-size:25px; }

/* Campanella notifiche (invariata) */
#areaCampanella{ position:fixed; top:14px; right:14px; z-index:520; }
#btnCampanella{ position:relative; width:44px; height:44px; border-radius:50%; background:#111; color:#ffd700; font-size:19px; border:2px solid #ffd700; cursor:pointer; padding:0; margin:0; }
.badge-notifiche{ position:absolute; top:-4px; right:-4px; background:#e53935; color:white; font-size:10px; font-weight:bold; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
.pannello-notifiche{ position:absolute; top:52px; right:0; width:300px; max-width:calc(100vw - 20px); background:white; border:1px solid #ccc; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.25); max-height:400px; overflow-y:auto; }
.pannello-notifiche.nascosto{ display:none; }
.notifiche-titolo{ padding:12px 14px; font-weight:bold; background:#111; color:#ffd700; border-radius:10px 10px 0 0; }
.notifica-riga{ padding:10px 14px; border-bottom:1px solid #eee; font-size:13px; }
.notifica-testo{ margin-bottom:4px; }
.notifica-data{ font-size:11px; color:#999; margin-bottom:6px; }
.notifica-azioni{ display:flex; gap:6px; }
.notifica-vuota{ padding:20px; text-align:center; color:#999; font-style:italic; font-size:13px; }
.btn-mini{ padding:6px 10px; border:none; border-radius:6px; font-size:12px; font-weight:bold; cursor:pointer; text-decoration:none; display:inline-block; }
.btn-mini.btn-accetta{ background:#43a047; color:white; }
.btn-mini.btn-rifiuta{ background:#e53935; color:white; }
.btn-mini.btn-vai{ background:#ff6600; color:white; }

/* Invito ricevuto */
#cardInvitoRicevuto{ position:fixed; top:66px; right:14px; z-index:510; width:260px; max-width:calc(100vw - 28px); background:white; border:2px solid #ffd700; border-radius:10px; padding:14px; box-shadow:0 8px 24px rgba(0,0,0,0.3); font-size:14px; }
#cardInvitoRicevuto.nascosto{ display:none; }
.invito-bottoni{ display:flex; gap:8px; margin-top:10px; }
.invito-bottoni button{ flex:1; padding:9px; border:none; border-radius:6px; font-weight:bold; cursor:pointer; margin:0; }
.btn-rifiuta-invito{ background:#e53935; color:white; }
.btn-accetta-invito{ background:#43a047; color:white; }

/* Popup piccolo su un giocatore */
.overlay-popup-giocatore, .overlay-modal-invito{ display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.55); z-index:700; align-items:center; justify-content:center; }
.overlay-popup-giocatore.aperto, .overlay-modal-invito.aperto{ display:flex; }
.popup-giocatore-box{ position:relative; background:white; border-radius:12px; padding:22px; width:260px; max-width:calc(100vw - 32px); text-align:center; }
.popup-giocatore-box .chiudi-popup{ position:absolute; top:8px; right:10px; background:none; border:none; font-size:16px; color:#999; width:auto; padding:4px; margin:0; }
.popup-avatar-container{ display:flex; justify-content:center; margin-bottom:8px; }
.popup-avatar{ width:64px; height:64px; border-radius:50%; object-fit:cover; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; font-size:24px; }
.popup-nickname{ font-weight:bold; font-size:16px; margin-bottom:4px; }
.popup-stato-online{ font-size:12px; color:#666; margin-bottom:14px; }
.popup-azioni{ margin-bottom:10px; display:flex; gap:8px; }
.btn-popup{ flex:1; padding:10px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:13px; margin:0; }
.btn-popup:disabled{ background:#ddd; color:#888; cursor:not-allowed; }
.btn-invia-richiesta{ background:#ffc400; color:#111; }
.btn-accetta{ background:#43a047; color:white; }
.btn-rifiuta{ background:#e53935; color:white; }
.btn-rimuovi-amico{ background:#7a1b1b; color:#ffab91; }
.popup-link-profilo{ display:block; font-size:12px; color:#ff6600; text-decoration:none; margin-top:6px; }

/* Modal invita giocatori (partita privata) */
.modal-invito-box{ background:white; border-radius:12px; width:380px; max-width:calc(100vw - 32px); max-height:75vh; display:flex; flex-direction:column; overflow:hidden; }
.modal-invito-titolo{ padding:14px 16px; background:#111; color:#ffd700; font-weight:bold; display:flex; justify-content:space-between; align-items:center; }
.modal-invito-titolo button{ background:none; border:none; color:#ffd700; font-size:16px; cursor:pointer; width:auto; padding:0; margin:0; }
#listaModalInvito{ overflow-y:auto; padding:10px; }
.modal-invito-riga{ display:flex; align-items:center; gap:10px; padding:10px; border-radius:8px; cursor:pointer; }
.modal-invito-riga:hover{ background:#f4f4f4; }
.modal-invito-riga-invitato{ opacity:0.55; cursor:default; }
.modal-invito-avatar{ width:38px; height:38px; border-radius:50%; object-fit:cover; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; flex-shrink:0; }
.modal-invito-check{ margin-left:auto; font-size:12px; color:#43a047; font-weight:bold; }

/* ===== NUOVO: barre e pannello a comparsa per cellulare ===== */
#barraSuperioreMobile, #barraFabMobile, #overlayPannelloMobile{ display:none; }

@media(max-width:900px){
  html, body{ height:100%; overflow:hidden; }
  body{ padding-top:42px; padding-bottom:78px; box-sizing:border-box; }
  .contenitore{ flex-direction:column; height:100%; padding:5px; gap:4px; }
  .sinistra, .destra{ display:none; } /* il loro contenuto compare solo nel pannello a comparsa, quando richiesto */
  .centro{ width:100%; flex:1 1 auto; display:flex; flex-direction:column; min-height:0; }
  .centro h2{ flex-shrink:0; }
  #partite{ flex:1 1 auto; height:auto; min-height:0; overflow-y:auto; }
  #chat{ height:110px; flex-shrink:0; margin-left:0; width:100%; }

  #barraSuperioreMobile{
    display:block; position:fixed; top:0; left:0; width:100%;
    padding:11px 70px 11px 14px; background:#111; color:#ffc400;
    font-weight:bold; font-size:14px; z-index:60; box-sizing:border-box;
  }

  #barraFabMobile{
    display:flex; position:fixed; bottom:0; left:0; width:100%;
    justify-content:center; gap:22px;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
    background:#111; z-index:60; box-sizing:border-box;
  }
  .fab-tonda{
    position:relative; width:50px; height:50px; border-radius:50%;
    background:#222; border:2px solid #ffc400; color:#ffc400;
    font-size:21px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0; margin:0;
  }
  .fab-tonda:hover{ opacity:0.85; }
  .badge-fab{
    position:absolute; top:-4px; right:-4px; background:#e53935; color:white;
    font-size:10px; font-weight:bold; min-width:16px; height:16px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; padding:0 3px;
  }

  #overlayPannelloMobile{ position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:600; align-items:flex-end; justify-content:center; }
  #overlayPannelloMobile.aperto{ display:flex; }
  .pannello-mobile-box{ background:white; width:100%; max-height:78vh; border-radius:16px 16px 0 0; display:flex; flex-direction:column; overflow:hidden; }
  .pannello-mobile-titolo{ display:flex; justify-content:space-between; align-items:center; padding:14px 16px; background:#111; color:#ffc400; font-weight:bold; flex-shrink:0; }
  .pannello-mobile-titolo button{ background:none; border:none; color:#ffc400; font-size:18px; cursor:pointer; width:auto; padding:4px; margin:0; }
  .pannello-mobile-corpo{ padding:14px; overflow-y:auto; }
  #corpoPannelloMobile .sinistra{ width:100%; border:none; background:none; border-radius:0; display:block; }
}

@media(max-width:480px){
  #barraSuperioreMobile{ font-size:13px; padding:9px 60px 9px 12px; }
  .fab-tonda{ width:44px; height:44px; font-size:18px; }
  #barraFabMobile{ gap:16px; }
  .pannello-mobile-box{ max-height:82vh; }
  #areaCampanella{ top:8px; right:8px; }
  #cardInvitoRicevuto{ top:58px; right:8px; left:8px; width:auto; max-width:none; }
  .pannello-notifiche{ width:calc(100vw - 16px); right:-6px; }
  .modal-invito-box{ width:calc(100vw - 24px); }
}
</style>
</head>
<body>

<div id="areaCampanella">
  <button id="btnCampanella" onclick="toggleNotifiche()">🔔<span id="badgeNotifiche" class="badge-notifiche" style="display:none;">0</span></button>
  <div id="pannelloNotifiche" class="pannello-notifiche nascosto">
    <div class="notifiche-titolo">Notifiche</div>
    <div id="listaNotifiche">Caricamento...</div>
  </div>
</div>

<div id="cardInvitoRicevuto" class="nascosto">
  <div id="testoInvitoRicevuto"></div>
  <div class="invito-bottoni">
    <button class="btn-rifiuta-invito" onclick="rispondiInvito(false)">Rifiuta</button>
    <button class="btn-accetta-invito" onclick="rispondiInvito(true)">Accetta invito</button>
  </div>
</div>

<div id="overlayPopupGiocatore" class="overlay-popup-giocatore">
  <div class="popup-giocatore-box">
    <button class="chiudi-popup" onclick="chiudiPopupGiocatore()">✕</button>
    <div id="popupGiocatoreContenuto">Caricamento...</div>
  </div>
</div>

<div id="overlayModalInvito" class="overlay-modal-invito">
  <div class="modal-invito-box">
    <div class="modal-invito-titolo">
      Seleziona chi vuoi invitare
      <button onclick="chiudiModalInvito()">✕</button>
    </div>
    <div id="listaModalInvito"></div>
  </div>
</div>

<!-- ===== NUOVO: interfaccia per cellulare ===== -->
<div id="barraSuperioreMobile">
  <span id="nomeStanzaMobileTesto"></span>
</div>

<div id="barraFabMobile">
  <button class="fab-tonda" onclick="apriPannelloMobile('pannelloCrea','Crea una partita')" title="Crea tavolo">🪑</button>
  <button class="fab-tonda" onclick="apriPannelloMobile('pannelloOnline','Online in questa stanza')" title="Giocatori online">👥<span id="badgeOnlineMobile" class="badge-fab">0</span></button>
  <button class="fab-tonda" onclick="apriPannelloMobile('pannelloClassifica','Classifica')" title="Classifica">🏆</button>
</div>

<div id="overlayPannelloMobile">
  <div class="pannello-mobile-box">
    <div class="pannello-mobile-titolo">
      <span id="titoloPannelloMobile">Titolo</span>
      <button onclick="chiudiPannelloMobile()">✕</button>
    </div>
    <div id="corpoPannelloMobile" class="pannello-mobile-corpo"></div>
  </div>
</div>

<div class="contenitore">
  <div class="sinistra" id="pannelloCrea">
    <h2>Opzioni di gioco</h2>
    <div class="box">
      <p>Numero giocatori</p>
      <select id="numeroGiocatori">
        <option value="2">2 giocatori</option>
        <option value="3">3 giocatori</option>
        <option value="4">4 giocatori</option>
        <option value="5">5 giocatori</option>
        <option value="6">6 giocatori</option>
        <option value="7">7 giocatori</option>
        <option value="8">8 giocatori</option>
      </select>

      <p>Tempo di mossa</p>
      <select id="tempo">
        <option value="15">15 secondi</option>
        <option value="30">30 secondi</option>
        <option value="60">60 secondi</option>
      </select>

      <p>Punti partita</p>
      <select id="punti"><option>100</option><option>150</option><option>200</option></select>

      <p>Tipo partita</p>
      <select id="tipoPartita">
        <option value="pubblica">🔓 Pubblica</option>
        <option value="privata">🔒 Privata (solo su invito)</option>
      </select>

      <button class="crea" onclick="creaPartita()">Crea partita</button>
      <button class="elimina" onclick="eliminaPartita()">🗑 Elimina partita</button>
    </div>
  </div>

  <div class="centro">
    <h2>GIOCO DELL'OCA</h2>
    <div id="partite"><p>Nessuna partita disponibile</p></div>
    <h2>Chat</h2>
    <div id="chat"></div>
    <input id="messaggio" placeholder="Scrivi un messaggio">
    <button onclick="inviaChat()">Invia</button>
  </div>

  <div class="destra">
    <div id="pannelloClassifica">
      <h2>🏆 Top giocatori</h2>
      <div id="top">Caricamento...</div>
    </div>
    <hr>
    <div id="pannelloOnline">
      <h2 id="nomeStanza">STANZA</h2>
      <h3 style="text-align:center;">👤 <span id="online">0</span> online &nbsp; 👥 <span id="amiciOnline">0</span> amici</h3>
      <div id="areaUtente"></div>
      <h2>🟢 Online in questa stanza</h2>
      <div id="listaOnline"></div>
    </div>
  </div>
</div>

<script>
let socket;
const parametri = new URLSearchParams(window.location.search);
const stanza = parametri.get("stanza") || "BAR";
document.getElementById("nomeStanza").innerHTML = stanza;
document.getElementById("nomeStanzaMobileTesto").textContent = "🏠 " + stanza;

let mioUid = null;
let mieiAmiciUid = new Set();
let ultimaListaOnlineStanza = [];
let aspettaPropriaPartitaPrivata = false;
let partitaDaInvitareId = null;
let invitoAttivoPartitaId = null;

function iniziale(nome) { return (nome || "?").trim().charAt(0).toUpperCase(); }
function coloreDaNome(nome) {
  const colori = ["#6a2c70", "#1e40af", "#43a047", "#f57c00", "#c0ca33", "#e53935", "#00838f", "#8d6e63"];
  let somma = 0;
  for (let i = 0; i < nome.length; i++) somma += nome.charCodeAt(i);
  return colori[somma % colori.length];
}

function iconaDispositivo(tipo) {
  if (tipo === "cellulare") return "📱 Cellulare";
  if (tipo === "tablet") return "📲 Tablet";
  return "🖥️ Computer";
}

function rilevaTipoDispositivoClient() {
  const ua = navigator.userAgent;
  if (/iPad/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua))) return "tablet";
  if (/iPhone|iPod/i.test(ua) || (/Android/i.test(ua) && /Mobile/i.test(ua))) return "cellulare";
  return "computer";
}

async function verificaSessione() {
  try {
    const risposta = await fetch("https://gioco-oca-server.onrender.com/api/me", { credentials: "include" });
    if (!risposta.ok) { window.location.href = "login.html?redirect=" + encodeURIComponent(window.location.href); return; }
    const dati = await risposta.json();
    mioUid = dati.uid;

    const immagineAvatar = dati.avatar
      ? `<img class="avatar" src="${dati.avatar}">`
      : `<div class="avatar" style="background:${coloreDaNome(dati.nickname)};">${iniziale(dati.nickname)}</div>`;

    document.getElementById("areaUtente").innerHTML = `
      <div class="utente-box">
        <div class="avatar-container">${immagineAvatar}</div>
        <div class="nickname">${dati.nickname}</div>
        <div class="dispositivo">${iconaDispositivo(rilevaTipoDispositivoClient())}</div>
        <button onclick="window.location.href='profilo.html'">👤 Il mio profilo</button>
        <button onclick="window.location.href='messaggi-privati.html'">💬 Messaggi</button>
        <button onclick="vaiAccount()">⚙️ Il mio account</button>
        <button onclick="esci()">🚪 Logout</button>
      </div>
    `;

    connetti();
    caricaAmici();
    caricaNotifiche(false);
  } catch (e) {
    window.location.href = "login.html?redirect=" + encodeURIComponent(window.location.href);
  }
}

function vaiAccount() { window.location.href = "opzioni-account.html"; }

async function esci() {
  try { await fetch("https://gioco-oca-server.onrender.com/api/logout", { method: "POST", credentials: "include" }); } catch (e) {}
  window.location.href = "login.html";
}

function connetti() {
  socket = new WebSocket("wss://gioco-oca-server.onrender.com");

  socket.onopen = () => {
    socket.send(JSON.stringify({ tipo: "entraLobby", stanza: stanza }));
  };

  socket.onclose = () => { setTimeout(() => location.reload(), 3000); };

  socket.onmessage = (msg) => {
    const dati = JSON.parse(msg.data);

    if (dati.tipo === "sessioneScaduta") {
      window.location.href = "login.html?redirect=" + encodeURIComponent(window.location.href);
      return;
    }
    if (dati.tipo === "online") {
      document.getElementById("online").innerHTML = dati.numero;
      const badgeOnlineMobile = document.getElementById("badgeOnlineMobile");
      if (badgeOnlineMobile) badgeOnlineMobile.textContent = dati.numero;
    }
    if (dati.tipo === "conteggioStanze" && dati.giocatori) mostraGiocatori(dati.giocatori[stanza] || []);
    if (dati.tipo === "chat") aggiungiMessaggio(dati.uid, dati.nome, dati.testo);
    if (dati.tipo === "listaPartite") mostraPartite(dati.partite);
    if (dati.tipo === "errore") alert(dati.messaggio);
    if (dati.tipo === "partitaAvviata") window.location.href = `gioco.html?partita=${dati.partitaId}&stanza=${stanza}`;
    if (dati.tipo === "invitoRicevuto") mostraInvitoRicevuto(dati);
    if (dati.tipo === "invitoInviato") segnaInvitatoNelModal(dati.destinatarioUid);
    if (dati.tipo === "invitoRifiutato") alert((dati.destinatarioNome || "Il giocatore") + " ha rifiutato l'invito.");
  };
}

// ===== CREAZIONE / LISTA PARTITE =====
function creaPartita() {
  const tipo = document.getElementById("tipoPartita").value;
  socket.send(JSON.stringify({
    tipo: "creaPartita",
    tempo: document.getElementById("tempo").value,
    punti: document.getElementById("punti").value,
    modalita: tipo,
    maxGiocatori: document.getElementById("numeroGiocatori").value
  }));
  if (tipo === "privata") aspettaPropriaPartitaPrivata = true;
  chiudiPannelloMobile();
}

function eliminaPartita() {
  if (!confirm("Vuoi eliminare la partita creata?")) return;
  socket.send(JSON.stringify({ tipo: "eliminaPartita" }));
}

function mostraPartite(lista) {
  let html = "";
  if (lista.length === 0) html = "<p>Nessuna partita disponibile</p>";
  lista.forEach(partita => {
    const piena = partita.numGiocatoriAttuali >= partita.maxGiocatori;
    const eMia = partita.creatoDa === mioUid;
    let bottoneHtml;
    if (partita.modalita === "privata") {
      if (eMia) {
        bottoneHtml = `<button onclick="apriModalInvito('${partita.id}')" ${piena ? 'disabled' : ''}>${piena ? 'Al completo' : '➕ Invita giocatori'}</button>`;
      } else {
        bottoneHtml = `<button disabled>🔒 Solo su invito</button>`;
      }
    } else {
      bottoneHtml = `<button onclick="entraPartita('${partita.id}')" ${piena ? 'disabled' : ''}>${piena ? 'Piena' : 'Entra'}</button>`;
    }
    html += `
    <div class="partita">
      🎲 ${partita.creatore}<br>
      ${partita.modalita === "privata" ? "🔒 Privata" : "🔓 Pubblica"}<br>
      ⏱ ${partita.tempo} secondi<br>
      🏆 ${partita.punti} punti<br>
      👥 ${partita.numGiocatoriAttuali} su ${partita.maxGiocatori}
      ${bottoneHtml}
    </div>`;
  });
  document.getElementById("partite").innerHTML = html;

  if (aspettaPropriaPartitaPrivata) {
    const mia = lista.find(p => p.creatoDa === mioUid && p.modalita === "privata");
    if (mia) { aspettaPropriaPartitaPrivata = false; apriModalInvito(mia.id); }
  }
}

function entraPartita(id) {
  socket.send(JSON.stringify({ tipo: "entraPartita", id: id }));
}

// ===== CHAT =====
function inviaChat() {
  let testo = document.getElementById("messaggio").value;
  if (testo === "") return;
  socket.send(JSON.stringify({ tipo: "chat", testo: testo }));
  document.getElementById("messaggio").value = "";
}

function aggiungiMessaggio(uid, nome, testo) {
  let chat = document.getElementById("chat");
  const cliccabile = uid && uid !== mioUid;
  const nomeHtml = cliccabile
    ? `<span class="nickname-riga" style="cursor:pointer;color:#ff6600;" onclick="apriPopupGiocatore('${uid}','${nome}')">${nome}</span>`
    : `<b>${nome}</b>`;
  chat.innerHTML += `<div class="messaggio">${nomeHtml}: ${testo}</div>`;
  chat.scrollTop = chat.scrollHeight;
}

// ===== ONLINE IN QUESTA STANZA =====
function mostraGiocatori(lista) {
  ultimaListaOnlineStanza = lista || [];
  aggiornaContatoreAmiciOnline();

  const contenitore = document.getElementById("listaOnline");
  if (!contenitore) return;

  if (!lista || lista.length === 0) {
    contenitore.innerHTML = "<p style='color:#999; font-style:italic;'>Nessun giocatore online</p>";
    return;
  }

  contenitore.innerHTML = lista.map(g => {
    const immagine = g.avatar
      ? `<img class="avatar-mini" src="${g.avatar}">`
      : `<div class="avatar-mini" style="background:${coloreDaNome(g.nickname)};">${iniziale(g.nickname)}</div>`;

    const cliccabile = g.uid && g.uid !== mioUid;

    return `
      <div class="giocatore-online" ${cliccabile ? `onclick="apriPopupGiocatore('${g.uid}','${g.nickname}')" style="cursor:pointer;"` : ""}>
        ${immagine}
        <div>
          <span class="nickname-riga">${g.nickname}</span>
          <div style="font-size:13px;color:#777;">${iconaDispositivo(g.tipoDispositivo)}</div>
        </div>
      </div>`;
  }).join("");
}

async function caricaTopGiocatori() {
  try {
    const risposta = await fetch("/api/top-giocatori");
    const dati = await risposta.json();
    const contenitore = document.getElementById("top");
    if (!dati.giocatori || dati.giocatori.length === 0) { contenitore.innerHTML = "Nessun giocatore ancora."; return; }
    contenitore.innerHTML = dati.giocatori.map((g, index) => {
      let medaglia = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : "🏅";
      return `<div class="top-player">${medaglia} <b><a href="profilo-pubblico.html?nickname=${encodeURIComponent(g.nickname)}" style="color:inherit;">${g.nickname}</a></b><br>🎯 Vittorie: ${g.vinte}<br>🎮 Partite: ${g.giocate}</div><br>`;
    }).join("");
  } catch (e) {
    document.getElementById("top").innerHTML = "Errore caricamento classifica";
  }
}

// ===== AMICI =====
async function caricaAmici() {
  try {
    const r = await fetch("https://gioco-oca-server.onrender.com/api/amici", { credentials: "include" });
    if (!r.ok) return;
    const d = await r.json();
    mieiAmiciUid = new Set((d.amici || []).map(a => a.uid));
    aggiornaContatoreAmiciOnline();
  } catch (e) {}
}
function aggiornaContatoreAmiciOnline() {
  const conteggio = ultimaListaOnlineStanza.filter(g => mieiAmiciUid.has(g.uid)).length;
  const el = document.getElementById("amiciOnline");
  if (el) el.textContent = conteggio;
}

// ===== POPUP PICCOLO SU UN GIOCATORE =====
function apriPopupGiocatore(uidTarget, nomeTarget) {
  if (!uidTarget || uidTarget === mioUid) return;
  const overlay = document.getElementById("overlayPopupGiocatore");
  document.getElementById("popupGiocatoreContenuto").innerHTML = "Caricamento...";
  overlay.classList.add("aperto");
  caricaDatiPopupGiocatore(nomeTarget);
}
function chiudiPopupGiocatore() {
  document.getElementById("overlayPopupGiocatore").classList.remove("aperto");
}
document.getElementById("overlayPopupGiocatore").addEventListener("click", (e) => {
  if (e.target.id === "overlayPopupGiocatore") chiudiPopupGiocatore();
});

async function caricaDatiPopupGiocatore(nomeTarget) {
  try {
    const risposta = await fetch("https://gioco-oca-server.onrender.com/api/profilo-pubblico/" + encodeURIComponent(nomeTarget), { credentials: "include" });
    if (!risposta.ok) { document.getElementById("popupGiocatoreContenuto").innerHTML = "Errore nel caricamento."; return; }
    const dati = await risposta.json();
    disegnaPopupGiocatore(dati);
  } catch (e) {
    document.getElementById("popupGiocatoreContenuto").innerHTML = "Errore di connessione.";
  }
}

function disegnaPopupGiocatore(dati) {
  const online = ultimaListaOnlineStanza.some(g => g.uid === dati.uid);
  const immagine = dati.avatar
    ? `<img class="popup-avatar" src="${dati.avatar}">`
    : `<div class="popup-avatar" style="background:${coloreDaNome(dati.nickname)};">${iniziale(dati.nickname)}</div>`;

  let azioneHtml;
  if (dati.statoAmicizia === "amici") {
    azioneHtml = `<button class="btn-popup btn-rimuovi-amico" onclick="rimuoviAmico('${dati.uid}')">🗑️ Rimuovi amico</button>`;
  } else if (dati.statoAmicizia === "richiesta_inviata") {
    azioneHtml = `<button class="btn-popup" disabled>⏳ Richiesta inviata</button>`;
  } else if (dati.statoAmicizia === "richiesta_ricevuta") {
    azioneHtml = `<button class="btn-popup btn-accetta" onclick="accettaAmicizia('${dati.uid}')">✅ Accetta</button><button class="btn-popup btn-rifiuta" onclick="rifiutaAmicizia('${dati.uid}')">❌ Rifiuta</button>`;
  } else {
    azioneHtml = `<button class="btn-popup btn-invia-richiesta" onclick="inviaRichiestaAmicizia('${dati.uid}')">➕ Invia richiesta</button>`;
  }

  document.getElementById("popupGiocatoreContenuto").innerHTML = `
    <div class="popup-avatar-container">${immagine}</div>
    <div class="popup-nickname">${dati.nickname}</div>
    <div class="popup-stato-online">${online ? "🟢 Online ora in questa stanza" : "⚫ Non online in questa stanza al momento"}</div>
    <div class="popup-azioni">${azioneHtml}</div>
    <a href="profilo-pubblico.html?nickname=${encodeURIComponent(dati.nickname)}" class="popup-link-profilo">👤 Vedi profilo completo</a>
  `;
}

async function inviaRichiestaAmicizia(destinatarioUid) {
  try {
    const r = await fetch("https://gioco-oca-server.onrender.com/api/amici/richiedi", {
      method: "POST", credentials: "include", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ destinatarioUid })
    });
    const d = await r.json();
    if (!r.ok) { alert(d.errore || "Errore."); return; }
    chiudiPopupGiocatore();
  } catch (e) { alert("Errore di connessione."); }
}
async function accettaAmicizia(daUid) {
  try {
    const r = await fetch("https://gioco-oca-server.onrender.com/api/amici/accetta", {
      method: "POST", credentials: "include", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ daUid })
    });
    if (!r.ok) { const d = await r.json(); alert(d.errore || "Errore."); return; }
    chiudiPopupGiocatore();
    caricaAmici();
  } catch (e) { alert("Errore di connessione."); }
}
async function rifiutaAmicizia(daUid) {
  try {
    await fetch("https://gioco-oca-server.onrender.com/api/amici/rifiuta", {
      method: "POST", credentials: "include", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ daUid })
    });
    chiudiPopupGiocatore();
  } catch (e) { alert("Errore di connessione."); }
}
async function rimuoviAmico(altroUid) {
  if (!confirm("Vuoi rimuovere questa persona dai tuoi amici?")) return;
  try {
    const r = await fetch("https://gioco-oca-server.onrender.com/api/amici/rimuovi", {
      method: "POST", credentials: "include", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ altroUid })
    });
    if (!r.ok) { const d = await r.json(); alert(d.errore || "Errore."); return; }
    chiudiPopupGiocatore();
    caricaAmici();
  } catch (e) { alert("Errore di connessione."); }
}

// ===== NOTIFICHE =====
async function caricaNotifiche(apriPannello) {
  try {
    const r = await fetch("https://gioco-oca-server.onrender.com/api/notifiche", { credentials: "include" });
    if (!r.ok) return;
    const d = await r.json();
    aggiornaBadgeNotifiche(d.nonLette || 0);
    if (apriPannello) disegnaListaNotifiche(d.notifiche || []);
  } catch (e) {}
}
function aggiornaBadgeNotifiche(n) {
  const badge = document.getElementById("badgeNotifiche");
  if (n > 0) { badge.style.display = "flex"; badge.textContent = n > 9 ? "9+" : n; }
  else badge.style.display = "none";
}
function disegnaListaNotifiche(lista) {
  const box = document.getElementById("listaNotifiche");
  if (!lista.length) { box.innerHTML = '<div class="notifica-vuota">Nessuna notifica</div>'; return; }
  box.innerHTML = lista.map(n => {
    let azioni = "";
    if (n.tipo === "richiestaAmicizia") {
      azioni = `<div class="notifica-azioni">
        <button class="btn-mini btn-accetta" onclick="accettaAmiciziaDaNotifica('${n.daUid}', this)">Accetta</button>
        <button class="btn-mini btn-rifiuta" onclick="rifiutaAmiciziaDaNotifica('${n.daUid}', this)">Rifiuta</button>
      </div>`;
    } else if (n.tipo === "invitoPartita" && n.stanza) {
      azioni = `<a class="btn-mini btn-vai" href="lobby.html?stanza=${encodeURIComponent(n.stanza)}">Vai alla stanza</a>`;
    } else if (n.tipo === "avviso") {
      azioni = `<a class="btn-mini btn-vai" href="messaggi.html">Vedi avviso</a>`;
    }
    return `<div class="notifica-riga">
      <div class="notifica-testo">🔔 ${n.testo}</div>
      <div class="notifica-data">${new Date(n.data).toLocaleString("it-IT")}</div>
      ${azioni}
    </div>`;
  }).join("");
}
function toggleNotifiche() {
  const pannello = document.getElementById("pannelloNotifiche");
  const aperto = !pannello.classList.contains("nascosto");
  if (aperto) { pannello.classList.add("nascosto"); return; }
  pannello.classList.remove("nascosto");
  caricaNotifiche(true);
  fetch("https://gioco-oca-server.onrender.com/api/notifiche/segna-lette", { method: "POST", credentials: "include" })
    .then(() => aggiornaBadgeNotifiche(0))
    .catch(() => {});
}
document.addEventListener("click", (e) => {
  if (!e.target.closest("#areaCampanella")) document.getElementById("pannelloNotifiche").classList.add("nascosto");
});
async function accettaAmiciziaDaNotifica(daUid, bottone) {
  await accettaAmicizia(daUid);
  bottone.closest(".notifica-riga").remove();
  caricaAmici();
}
async function rifiutaAmiciziaDaNotifica(daUid, bottone) {
  await rifiutaAmicizia(daUid);
  bottone.closest(".notifica-riga").remove();
}
setInterval(() => caricaNotifiche(false), 10000);

// ===== INVITO A PARTITA PRIVATA =====
function apriModalInvito(partitaId) {
  partitaDaInvitareId = partitaId;
  disegnaListaModalInvito();
  document.getElementById("overlayModalInvito").classList.add("aperto");
}
function chiudiModalInvito() {
  document.getElementById("overlayModalInvito").classList.remove("aperto");
  partitaDaInvitareId = null;
}
document.getElementById("overlayModalInvito").addEventListener("click", (e) => {
  if (e.target.id === "overlayModalInvito") chiudiModalInvito();
});
function disegnaListaModalInvito() {
  const altri = ultimaListaOnlineStanza.filter(g => g.uid !== mioUid);
  const box = document.getElementById("listaModalInvito");
  if (!altri.length) { box.innerHTML = "<p style='text-align:center;color:#999;padding:20px;'>Nessun altro giocatore online in questa stanza al momento.</p>"; return; }
  box.innerHTML = altri.map(g => {
    const immagine = g.avatar
      ? `<img class="modal-invito-avatar" src="${g.avatar}">`
      : `<div class="modal-invito-avatar" style="background:${coloreDaNome(g.nickname)};">${iniziale(g.nickname)}</div>`;
    return `
      <div class="modal-invito-riga" id="rigaInvito-${g.uid}" onclick="invitaGiocatore('${g.uid}')">
        ${immagine}
        <span>${g.nickname}</span>
      </div>`;
  }).join("");
}
function invitaGiocatore(destinatarioUid) {
  if (!partitaDaInvitareId) return;
  socket.send(JSON.stringify({ tipo: "invitaPartita", partitaId: partitaDaInvitareId, destinatarioUid }));
}
function segnaInvitatoNelModal(destinatarioUid) {
  const riga = document.getElementById("rigaInvito-" + destinatarioUid);
  if (riga) {
    riga.classList.add("modal-invito-riga-invitato");
    riga.innerHTML += ' <span class="modal-invito-check">✓ Invitato</span>';
    riga.onclick = null;
  }
}

function mostraInvitoRicevuto(dati) {
  invitoAttivoPartitaId = dati.partitaId;
  document.getElementById("testoInvitoRicevuto").textContent = "🎲 " + dati.daNome + " ti ha invitato a giocare!";
  document.getElementById("cardInvitoRicevuto").classList.remove("nascosto");
}
function rispondiInvito(accettato) {
  if (!invitoAttivoPartitaId) return;
  socket.send(JSON.stringify({ tipo: "rispostaInvito", partitaId: invitoAttivoPartitaId, accettato }));
  document.getElementById("cardInvitoRicevuto").classList.add("nascosto");
  invitoAttivoPartitaId = null;
}

// ===== NUOVO: pannello a comparsa per cellulare (sposta il contenuto reale, non lo duplica) =====
let elementoNelPannelloMobile = null;
let genitoreOriginalePannello = null;
let fratelloSuccessivoOriginalePannello = null;

function apriPannelloMobile(elementoId, titolo) {
  if (elementoNelPannelloMobile) restituisciElementoAlPostoOriginale();

  const elemento = document.getElementById(elementoId);
  if (!elemento) return;
  genitoreOriginalePannello = elemento.parentNode;
  fratelloSuccessivoOriginalePannello = elemento.nextSibling;
  elementoNelPannelloMobile = elemento;

  document.getElementById("titoloPannelloMobile").textContent = titolo;
  document.getElementById("corpoPannelloMobile").appendChild(elemento);
  document.getElementById("overlayPannelloMobile").classList.add("aperto");
}

function restituisciElementoAlPostoOriginale() {
  if (elementoNelPannelloMobile && genitoreOriginalePannello) {
    if (fratelloSuccessivoOriginalePannello) {
      genitoreOriginalePannello.insertBefore(elementoNelPannelloMobile, fratelloSuccessivoOriginalePannello);
    } else {
      genitoreOriginalePannello.appendChild(elementoNelPannelloMobile);
    }
  }
  elementoNelPannelloMobile = null;
}

function chiudiPannelloMobile() {
  restituisciElementoAlPostoOriginale();
  document.getElementById("overlayPannelloMobile").classList.remove("aperto");
}
document.getElementById("overlayPannelloMobile").addEventListener("click", (e) => {
  if (e.target.id === "overlayPannelloMobile") chiudiPannelloMobile();
});

caricaTopGiocatori();
verificaSessione();
</script>
