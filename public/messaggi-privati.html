<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Messaggi privati | Giochi Società</title>

<style>
:root {
    color-scheme: light;
    --notte: #112438;
    --testo: #182a3b;
    --secondario: #526879;
    --sfondo: #edf2f5;
    --superficie: #fff;
    --tenue: #f4f7f9;
    --bordo: #dae3eb;
    --giallo: #f6ce55;
    --giallo-vivo: #ffdb73;
    --avorio: #fff3d1;
    --rosso: #982737;
    --raggio: 16px;
    --contenitore: min(1200px, calc(100% - 48px));
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--sfondo); color: var(--testo); font-size: 15px; line-height: 1.5; }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: wait; opacity: .6; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 3px solid #2374a8; outline-offset: 3px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.icona { width: 19px; height: 19px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.pagina-messaggi { display: flex; flex-direction: column; height: 100%; height: var(--altezza-messaggi, 100dvh); min-height: 0; }
.barra-sito { flex: 0 0 auto; background: var(--superficie); border-bottom: 1px solid var(--bordo); }
.barra-interno, .contenitore-messaggi { width: var(--contenitore); margin-inline: auto; }
.barra-interno { display: flex; min-height: 64px; justify-content: space-between; align-items: center; gap: 10px; }
.marca-sito { display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 750; }
.logo-sito {
    display: grid; place-items: center; width: 39px; height: 39px; flex: 0 0 39px;
    border-radius: 10px; background: var(--notte); color: var(--giallo); font-size: 14px; font-weight: 850;
}
.btn-indietro, .btn-chat-azione, .btn-riprova {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px;
    padding: 6px 11px; border: 1px solid var(--bordo); border-radius: 8px;
    background: var(--superficie); color: var(--testo); font-size: 14px; font-weight: 700;
}
.btn-indietro { flex-shrink: 0; }
.btn-indietro:hover, .btn-chat-azione:hover, .btn-riprova:hover { background: var(--tenue); }

.contenitore-messaggi { display: flex; flex: 1; flex-direction: column; gap: 14px; min-height: 0; padding: 16px 0 20px; }
.testata-messaggi {
    position: relative; display: flex; flex: 0 0 auto; align-items: center; overflow: hidden;
    min-height: 92px; padding: 13px clamp(18px, 4vw, 36px); border: 0; border-top: 4px solid var(--giallo);
    border-radius: var(--raggio); background: var(--notte); color: #fff;
}
.testata-messaggi::before {
    content: ""; position: absolute; inset: 0 0 0 40%; opacity: .78;
    background: linear-gradient(90deg, var(--notte), transparent 65%), url("community-tavolo.webp") 74% 56% / cover no-repeat;
}
.testata-messaggi h1 { position: relative; margin: 0; font-size: clamp(1.75rem, 3.6vw, 2.5rem); line-height: 1.15; letter-spacing: -.035em; }
.app-messaggi { display: grid; grid-template-columns: minmax(252px, .95fr) minmax(0, 2.15fr); flex: 1; min-height: 0; gap: 14px; }
.sidebar-conversazioni, .area-chat {
    display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
    border: 1px solid var(--bordo); border-radius: var(--raggio); background: var(--superficie);
}
.sidebar-header { flex: 0 0 auto; padding: 15px 14px 12px; border-bottom: 1px solid var(--bordo); }
.sidebar-titolo-riga { display: flex; gap: 6px 8px; flex-wrap: wrap; align-items: baseline; justify-content: space-between; margin-bottom: 9px; }
.sidebar-titolo { margin: 0; font-size: 19px; letter-spacing: -.02em; }
.riepilogo-conversazioni { margin: 0; color: #644703; font-size: 12px; font-weight: 750; }
.ricerca-conversazioni { position: relative; }
.ricerca-conversazioni svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--secondario); pointer-events: none; }
#ricercaContatti { width: 100%; min-height: 44px; padding: 7px 10px 7px 37px; border: 1px solid var(--bordo); border-radius: 8px; background: var(--tenue); color: var(--testo); font-size: 16px; }
#ricercaContatti::placeholder, .input-messaggio::placeholder { color: var(--secondario); opacity: 1; }
.lista-conversazioni, .messaggi-chat { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.lista-conversazioni { padding: 5px 8px 9px; }
.stato-lista { display: grid; justify-items: start; gap: 4px; padding: 14px 8px; color: var(--secondario); font-size: 14px; }
.stato-lista strong { color: var(--testo); }
.stato-lista .btn-riprova { margin-top: 4px; }
.conversazione {
    width: 100%; min-height: 67px; display: flex; align-items: center; gap: 9px;
    padding: 8px; border: 1px solid transparent; border-bottom-color: var(--bordo); border-radius: 8px;
    background: var(--superficie); color: var(--testo); text-align: left;
}
.conversazione:last-child { border-bottom-color: transparent; }
.conversazione:hover { background: var(--tenue); }
.conversazione.attiva { border-color: #e3c875; background: #fff8e4; }
.conversazione:focus-visible, .messaggi-chat:focus-visible { outline-offset: -3px; }
.avatar-conversazione {
    display: grid; place-items: center; flex: 0 0 40px; width: 40px; height: 40px;
    border-radius: 50%; background: #36536a; color: #fff; font-size: 15px; font-weight: 800;
}
.conversazione-corpo { min-width: 0; flex: 1; }
.conversazione-riga-superiore, .conversazione-riga-inferiore { display: flex; align-items: center; gap: 7px; }
.conversazione-riga-inferiore { margin-top: 3px; }
.conversazione-nome, .conversazione-anteprima { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conversazione-nome { font-size: 14px; font-weight: 760; }
.conversazione-data { flex-shrink: 0; color: var(--secondario); font-size: 11px; }
.conversazione-anteprima { color: var(--secondario); font-size: 13px; }
.badge-non-letti {
    display: inline-grid; place-items: center; min-width: 23px; height: 23px; flex-shrink: 0;
    padding-inline: 4px; border-radius: 99px; background: var(--notte); color: #fff; font-size: 12px; font-weight: 760;
}

.chat-vuota, .chat-caricamento {
    display: flex; flex: 1; align-items: center; justify-content: center; flex-direction: column;
    gap: 10px; padding: 20px; color: var(--secondario); text-align: center;
}
.chat-vuota { background: var(--tenue); }
.chat-vuota-icon, .richiesta-messaggio-icon { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 12px; background: var(--avorio); color: #644703; }
.chat-vuota-icon svg, .richiesta-messaggio-icon svg { width: 27px; height: 27px; }
.chat-vuota h2 { margin: 0; color: var(--testo); font-size: 22px; letter-spacing: -.02em; }
.chat-vuota p { margin: 0; }
#chatAttiva { display: flex; flex: 1; flex-direction: column; min-height: 0; }
#chatAttiva[hidden], #chatVuota[hidden], .compositore[hidden] { display: none; }
.chat-header { display: flex; flex: 0 0 auto; align-items: center; gap: 10px; min-height: 64px; padding: 9px 15px; border-bottom: 1px solid var(--bordo); }
.btn-chat-azione { display: none; width: 44px; flex: 0 0 44px; padding: 0; }
.chat-header-info { min-width: 0; }
.chat-header-nome { margin: 0; font-size: 18px; font-weight: 760; line-height: 1.2; overflow-wrap: anywhere; }
.chat-header-stato { margin-top: 3px; color: var(--secondario); font-size: 12px; }
.messaggi-chat { padding: 14px 18px; background: var(--tenue); }
.giorno-chat { margin: 12px 0; color: var(--secondario); text-align: center; font-size: 12px; font-weight: 700; }
.riga-messaggio { display: flex; margin: 5px 0; }
.riga-messaggio.mio { justify-content: flex-end; }
.bolla {
    max-width: min(79%, 64ch); min-width: 0; padding: 8px 11px 5px; border: 1px solid var(--bordo);
    border-radius: 12px 12px 12px 3px; background: var(--superficie); font-size: 15px; overflow-wrap: anywhere;
}
.riga-messaggio.mio .bolla { border-color: #ead796; border-radius: 12px 12px 3px 12px; background: var(--avorio); }
.testo-messaggio { white-space: pre-wrap; }
.meta-messaggio { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 9px; margin-top: 3px; color: var(--secondario); font-size: 11px; }
.riga-messaggio.mio .meta-messaggio { justify-content: flex-end; }
.segnala-messaggio { border: 0; padding: 3px 0; background: transparent; color: var(--rosso); font-size: 12px; }
.segnala-messaggio:hover { text-decoration: underline; }
.chat-caricamento { min-height: min(185px, 100%); }
.chat-caricamento strong { color: var(--testo); }

.compositore { flex: 0 0 auto; padding: 9px 13px 8px; border-top: 1px solid var(--bordo); background: var(--superficie); }
.riga-compositore { display: flex; align-items: flex-end; gap: 8px; }
.input-messaggio {
    width: 100%; flex: 1; min-width: 0; min-height: 44px; max-height: 130px; padding: 9px 10px;
    border: 1px solid var(--bordo); border-radius: 8px; resize: none; background: var(--tenue); color: var(--testo); font-size: 16px; line-height: 1.4;
}
.btn-invia, .btn-accetta-messaggio, .btn-ignora-messaggio {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 6px 11px;
    border: 1px solid transparent; border-radius: 8px; background: var(--giallo); color: #202c35; font-size: 14px; font-weight: 750;
}
.btn-invia:hover, .btn-accetta-messaggio:hover { background: var(--giallo-vivo); }
.btn-ignora-messaggio { border-color: var(--bordo); background: var(--superficie); }
.btn-ignora-messaggio:hover { background: var(--tenue); }
.compositore-info { display: flex; justify-content: space-between; gap: 7px; margin-top: 4px; color: var(--secondario); font-size: 12px; }
.contatore-messaggio { margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }
.richiesta-messaggio {
    display: grid; justify-items: start; gap: 8px; width: min(420px, 100%); margin: 18px auto; padding: 16px;
    border: 1px solid var(--bordo); border-radius: var(--raggio); background: var(--superficie);
}
.richiesta-messaggio h3, .richiesta-messaggio p { margin: 0; }
.richiesta-messaggio p { color: var(--secondario); }
.richiesta-messaggio-azioni { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
#contenitore-toast { position: fixed; right: 14px; bottom: 18px; z-index: 5; display: grid; gap: 6px; max-width: min(360px, calc(100% - 28px)); pointer-events: none; }
.toast { padding: 9px 13px; border-radius: 8px; background: var(--notte); color: #fff; box-shadow: 0 5px 20px #17273335; font-size: 14px; }

@media (max-width: 940px) {
    :root { --contenitore: calc(100% - 28px); }
    .app-messaggi { gap: 10px; grid-template-columns: minmax(240px, .95fr) minmax(0, 1.8fr); }
}
@media (max-width: 740px) {
    :root { --contenitore: calc(100% - 20px); }
    .barra-interno { min-height: 56px; }
    .contenitore-messaggi { gap: 9px; padding: 9px 0 max(9px, env(safe-area-inset-bottom)); }
    .testata-messaggi { min-height: 71px; }
    .testata-messaggi::before { inset-inline-start: 27%; opacity: .52; }
    .app-messaggi { grid-template-columns: minmax(0, 1fr); }
    body.thread-aperto .sidebar-conversazioni, body:not(.thread-aperto) .area-chat { display: none; }
    body.thread-aperto .barra-sito { display: none; }
    body.thread-aperto .testata-messaggi {
        position: absolute; width: 1px; height: 1px; min-height: 0; margin: -1px; padding: 0;
        border: 0; clip-path: inset(50%); white-space: nowrap;
    }
    body.thread-aperto .contenitore-messaggi { padding-top: max(8px, env(safe-area-inset-top)); }
    .chat-header { padding: 7px 10px; }
    .btn-chat-azione { display: inline-flex; }
    .messaggi-chat { padding: 9px 10px; }
    .bolla { max-width: 91%; }
    .compositore { padding-inline: 9px; }
    .scorciatoia-tastiera, .testo-invia { display: none; }
    .btn-invia { width: 44px; flex: 0 0 44px; padding: 0; }
}
@media (max-width: 380px) {
    .marca-sito { gap: 7px; font-size: 13px; }
    .logo-sito { width: 32px; height: 32px; flex-basis: 32px; font-size: 12px; }
    .btn-indietro { padding-inline: 7px; font-size: 13px; }
    .chat-header-nome { font-size: 16px; }
}
@media (max-height: 540px) {
    .testata-messaggi { min-height: 54px; }
    .testata-messaggi h1 { font-size: 23px; }
    .contenitore-messaggi { gap: 8px; padding-block: 8px; }
}
</style>
</head>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-freccia" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-cerca" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-9 8.5 8.63 8.63 0 0 1-4-.95L3 21l1.75-4.1A8.35 8.35 0 0 1 3 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5Z"/></symbol>
    <symbol id="i-invia" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></symbol>
</svg>

<div class="pagina-messaggi">
    <header class="barra-sito">
        <div class="barra-interno">
            <a class="marca-sito" href="/Community.html" target="_top" aria-label="Giochi Società, Community">
                <span class="logo-sito" aria-hidden="true">GS</span><span>Giochi Società</span>
            </a>
            <button type="button" class="btn-indietro" title="Torna indietro" onclick="tornaIndietro()">
                <svg class="icona" aria-hidden="true"><use href="#i-freccia"></use></svg> Torna indietro
            </button>
        </div>
    </header>

    <main class="contenitore-messaggi" aria-labelledby="titolo-messaggi">
        <header class="testata-messaggi"><h1 id="titolo-messaggi">Messaggi privati</h1></header>
        <div class="app-messaggi">
            <aside class="sidebar-conversazioni" aria-labelledby="titolo-conversazioni">
                <div class="sidebar-header">
                    <div class="sidebar-titolo-riga">
                        <h2 class="sidebar-titolo" id="titolo-conversazioni" tabindex="-1">Conversazioni</h2>
                        <p class="riepilogo-conversazioni" id="riepilogoConversazioni" hidden></p>
                    </div>
                    <div class="ricerca-conversazioni" role="search" aria-label="Conversazioni">
                        <svg class="icona" aria-hidden="true"><use href="#i-cerca"></use></svg>
                        <label class="visually-hidden" for="ricercaContatti">Cerca conversazioni</label>
                        <input id="ricercaContatti" type="search" placeholder="Cerca per nickname" autocomplete="off">
                    </div>
                </div>
                <div class="lista-conversazioni" id="listaConversazioni">
                    <div class="stato-lista" role="status">Caricamento delle conversazioni…</div>
                </div>
            </aside>

            <section class="area-chat" aria-label="Conversazione privata">
                <div class="chat-vuota" id="chatVuota">
                    <div class="chat-vuota-icon" aria-hidden="true"><svg class="icona"><use href="#i-chat"></use></svg></div>
                    <h2>Seleziona una conversazione</h2>
                    <p>Scegli una chat dall’elenco per leggere e rispondere.</p>
                </div>

                <section id="chatAttiva" aria-labelledby="chatNome" hidden>
                    <header class="chat-header">
                        <button type="button" class="btn-chat-azione" title="Torna alle conversazioni" aria-label="Torna alle conversazioni" id="btnTornaConversazioni">
                            <svg class="icona" aria-hidden="true"><use href="#i-freccia"></use></svg>
                        </button>
                        <div id="chatAvatar" class="avatar-conversazione" aria-hidden="true"></div>
                        <div class="chat-header-info">
                            <h2 id="chatNome" class="chat-header-nome" tabindex="-1">Utente</h2>
                            <div class="chat-header-stato">Conversazione privata</div>
                        </div>
                    </header>
                    <div id="messaggiChat" class="messaggi-chat" role="region" aria-label="Cronologia dei messaggi" tabindex="0"></div>
                    <form class="compositore" id="compositore" hidden>
                        <div class="riga-compositore">
                            <label class="visually-hidden" for="inputMessaggio">Scrivi un messaggio</label>
                            <textarea id="inputMessaggio" class="input-messaggio" placeholder="Scrivi un messaggio…" maxlength="500" rows="1" aria-describedby="contatoreMessaggio"></textarea>
                            <button type="submit" id="btnInvia" class="btn-invia" aria-label="Invia messaggio" title="Invia messaggio">
                                <svg class="icona" aria-hidden="true"><use href="#i-invia"></use></svg><span class="testo-invia">Invia</span>
                            </button>
                        </div>
                        <div class="compositore-info">
                            <span class="scorciatoia-tastiera">Invio per inviare · Maiusc + Invio per andare a capo</span>
                            <span class="contatore-messaggio" id="contatoreMessaggio" aria-label="0 di 500 caratteri">0 / 500</span>
                        </div>
                    </form>
                </section>
            </section>
        </div>
    </main>
</div>

<div id="contenitore-toast" role="status"></div>

<script>
/* ============================================================
   CONFIGURAZIONE
   ============================================================ */

const API_BASE =
    "https://api.giochisocieta.com";

const parametri =
    new URLSearchParams(window.location.search);

let mioUid = null;

let uidConversazioneAperta =
    parametri.get("con");

let nomeConversazioneAperta =
    parametri.get("nome") || "";

let conversazioniCache = [];

let timerAggiornamento =
    null;

let timerAggiornamentoInbox =
    null;

let richiestaMessaggi = null;
let firmaMessaggi = null;
let firmaConversazioni = null;
const vistaCompatta = window.matchMedia("(max-width: 740px)");

let caricamentoInboxInCorso =
    false;


/* ============================================================
   UTILITY
   ============================================================ */

const PALETTE = [
    "#6a2c70",
    "#1e40af",
    "#2e7d59",
    "#c46c19",
    "#87951f",
    "#c93636",
    "#007c83",
    "#76584a"
];

function coloreDaNome(nome) {

    let somma = 0;

    for (
        let i = 0;
        i < (nome || "?").length;
        i++
    ) {
        somma +=
            nome.charCodeAt(i);
    }

    return PALETTE[
        somma % PALETTE.length
    ];
}

function iniziale(nome) {

    return (
        (nome || "?")
            .trim()
            .charAt(0)
            .toUpperCase()
        || "?"
    );
}

function escapeHtml(testo) {

    const div =
        document.createElement("div");

    div.textContent =
        testo == null
            ? ""
            : String(testo);

    return div.innerHTML;
}

function formatoOra(timestamp) {

    try {

        return new Date(timestamp)
            .toLocaleTimeString(
                "it-IT",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

    } catch {

        return "";
    }
}

function formatoGiorno(timestamp) {

    try {

        const data =
            new Date(timestamp);

        const oggi =
            new Date();

        const ieri =
            new Date();

        ieri.setDate(
            ieri.getDate() - 1
        );

        if (
            data.toDateString() ===
            oggi.toDateString()
        ) {
            return "Oggi";
        }

        if (
            data.toDateString() ===
            ieri.toDateString()
        ) {
            return "Ieri";
        }

        return data.toLocaleDateString(
            "it-IT",
            {
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

    } catch {

        return "";
    }
}

function mostraToast(testo) {

    const contenitore =
        document.getElementById(
            "contenitore-toast"
        );

    const toast =
        document.createElement("div");

    toast.className =
        "toast";

    toast.textContent =
        testo;

    contenitore.appendChild(
        toast
    );

    setTimeout(() => {

        toast.remove();

    }, 4000);
}


/* ============================================================
   AUTENTICAZIONE
   ============================================================ */

async function avvia() {

    try {

        const risposta =
            await fetch(
                API_BASE + "/api/me",
                {
                    credentials: "include"
                }
            );

        if (!risposta.ok) {

            window.location.href =
                "login.html?redirect=" +
                encodeURIComponent(
                    window.location.href
                );

            return;
        }

        const dati =
            await risposta.json();

        mioUid =
            dati.uid;

        await caricaInbox();

avviaAggiornamentoInbox();

if (
    uidConversazioneAperta
) {

            const conversazione =
                conversazioniCache.find(
                    c =>
                        c.altroUid ===
                        uidConversazioneAperta
                );

            apriThread(
                uidConversazioneAperta,
                conversazione
                    ? conversazione.altroNome
                    : nomeConversazioneAperta
            );
        }

    } catch (errore) {

        window.location.href =
            "login.html?redirect=" +
            encodeURIComponent(
                window.location.href
            );
    }
}


/* ============================================================
   INBOX
   ============================================================ */

function aggiornaElencoConversazioni(dati) {
    const lista = Array.isArray(dati.conversazioni) ? dati.conversazioni : [];
    const firma = JSON.stringify(lista);
    if (firma === firmaConversazioni) return;
    firmaConversazioni = firma;
    conversazioniCache = lista;
    renderConversazioni();
}

async function caricaInbox() {
    try {
        const risposta = await fetch(API_BASE + "/api/conversazioni", { credentials: "include", cache: "no-store" });
        if (risposta.status === 401) {
            location.href = "login.html?redirect=" + encodeURIComponent(location.href);
            return;
        }
        if (!risposta.ok) throw new Error("Conversazioni non disponibili");
        aggiornaElencoConversazioni(await risposta.json());
    } catch (errore) {
        firmaConversazioni = null;
        const lista = document.getElementById("listaConversazioni");
        lista.innerHTML = '<div class="stato-lista"><strong>Impossibile caricare i messaggi</strong><button type="button" class="btn-riprova">Riprova</button></div>';
        lista.querySelector("button").addEventListener("click", caricaInbox);
    }
}

function avviaAggiornamentoInbox() {

    if (timerAggiornamentoInbox) {

        clearInterval(
            timerAggiornamentoInbox
        );
    }

    timerAggiornamentoInbox =
        setInterval(
            () => {

                aggiornaInboxSilenziosa();

            },
            2500
        );
}

function bottoneConversazione(uid) {
    return document.querySelector(`.conversazione[data-uid="${CSS.escape(uid)}"]`);
}

function renderConversazioni() {
    const lista = document.getElementById("listaConversazioni");
    const ricerca = document.getElementById("ricercaContatti").value.trim().toLowerCase();
    const filtrate = conversazioniCache.filter(c => (c.altroNome || "").toLowerCase().includes(ricerca));
    const nonLetti = conversazioniCache.reduce((totale, c) => totale + Math.max(0, Number(c.nonLetti) || 0), 0);
    const riepilogo = document.getElementById("riepilogoConversazioni");
    riepilogo.hidden = nonLetti === 0;
    riepilogo.textContent = nonLetti === 1 ? "1 non letto" : nonLetti + " non letti";

    if (!filtrate.length) {
        lista.innerHTML = conversazioniCache.length
            ? '<div class="stato-lista"><strong>Nessun risultato</strong><span>Prova a cercare un altro nickname.</span></div>'
            : '<div class="stato-lista"><strong>Nessuna conversazione</strong><span>Le nuove conversazioni appariranno qui.</span></div>';
        return;
    }

    const uidConFocus = lista.contains(document.activeElement) ? document.activeElement.dataset.uid : null;
    lista.replaceChildren(...filtrate.map(c => {
        const attiva = c.altroUid === uidConversazioneAperta;
        const bottone = document.createElement("button");
        bottone.className = "conversazione" + (attiva ? " attiva" : "");
        bottone.type = "button";
        bottone.dataset.uid = c.altroUid;
        if (attiva) bottone.setAttribute("aria-current", "true");
        const nome = c.altroNome || "Utente";
        const data = formatoOra(c.ultimaData);
        const nuovi = Math.max(0, Number(c.nonLetti) || 0);
        bottone.innerHTML = `
            <span class="avatar-conversazione" aria-hidden="true" style="background:${coloreDaNome(nome)}">${escapeHtml(iniziale(nome))}</span>
            <span class="conversazione-corpo">
                <span class="conversazione-riga-superiore">
                    <span class="conversazione-nome">${escapeHtml(nome)}</span>
                    <span class="conversazione-data">${escapeHtml(data)}</span>
                </span>
                <span class="conversazione-riga-inferiore">
                    <span class="conversazione-anteprima">${escapeHtml(c.ultimoTesto || "")}</span>
                    ${nuovi ? `<span class="badge-non-letti" aria-label="${nuovi} ${nuovi === 1 ? "messaggio non letto" : "messaggi non letti"}">${nuovi}</span>` : ""}
                </span>
            </span>`;
        bottone.addEventListener("click", () => apriThread(c.altroUid, nome));
        return bottone;
    }));

    if (uidConFocus) bottoneConversazione(uidConFocus)?.focus({ preventScroll: true });
}


/* ============================================================
   THREAD
   ============================================================ */

function annullaRichiestaMessaggi() {
    richiestaMessaggi?.abort();
    richiestaMessaggi = null;
}

function mostraStatoThread(testo, riprova = false) {
    const stato = document.createElement("div");
    stato.className = "chat-caricamento";
    const messaggio = document.createElement("span");
    messaggio.setAttribute("role", "status");
    messaggio.textContent = testo;
    stato.append(messaggio);
    if (riprova) {
        const bottone = document.createElement("button");
        bottone.className = "btn-riprova";
        bottone.type = "button";
        bottone.textContent = "Riprova";
        bottone.addEventListener("click", () => caricaMessaggiThread(true));
        stato.append(bottone);
    }
    document.getElementById("messaggiChat").replaceChildren(stato);
}

async function apriThread(uidDestinatario, nomeDestinatario) {
    const dialogoAperto = document.body.classList.contains("thread-aperto");
    if (dialogoAperto && uidConversazioneAperta === uidDestinatario) return;
    annullaRichiestaMessaggi();
    firmaMessaggi = null;
    uidConversazioneAperta = uidDestinatario;
    nomeConversazioneAperta = nomeDestinatario || "Utente";
    document.body.classList.add("thread-aperto");
    const parametriThread = new URLSearchParams({ con: uidDestinatario, nome: nomeDestinatario || "" });
    history.replaceState(history.state, "", "messaggi-privati.html?" + parametriThread);

    document.getElementById("chatVuota").hidden = true;
    document.getElementById("chatAttiva").hidden = false;
    document.getElementById("compositore").hidden = true;
    inputMessaggio.value = "";
    ridimensionaTextarea();
    mostraStatoThread("Caricamento dei messaggi…");

    const avatar = document.getElementById("chatAvatar");
    avatar.style.background = coloreDaNome(nomeConversazioneAperta);
    avatar.textContent = iniziale(nomeConversazioneAperta);
    const titolo = document.getElementById("chatNome");
    titolo.textContent = nomeConversazioneAperta;

    renderConversazioni();
    titolo.focus({ preventScroll: true });
    avviaAggiornamentoThread();
    await caricaMessaggiThread(true);
    if (!vistaCompatta.matches && uidConversazioneAperta === uidDestinatario && document.activeElement === titolo &&
        !document.getElementById("compositore").hidden) inputMessaggio.focus({ preventScroll: true });
}

function chiudiThread() {
    const precedente = uidConversazioneAperta;
    uidConversazioneAperta = null;
    nomeConversazioneAperta = "";
    annullaRichiestaMessaggi();
    clearInterval(timerAggiornamento);
    timerAggiornamento = null;

    document.body.classList.remove("thread-aperto");
    document.getElementById("chatAttiva").hidden = true;
    document.getElementById("chatVuota").hidden = false;
    history.replaceState(history.state, "", "messaggi-privati.html");

    renderConversazioni();
    const ritorno = precedente ? bottoneConversazione(precedente) : null;
    (ritorno || document.getElementById("titolo-conversazioni")).focus();
}

function tornaIndietro() {
    if (history.length > 1) history.back();
    else location.href = "Community.html";
}

function avviaAggiornamentoThread() {

    if (
        timerAggiornamento
    ) {

        clearInterval(
            timerAggiornamento
        );
    }

    timerAggiornamento =
        setInterval(
            () => {
                caricaMessaggiThread(
                    false
                );
            },
            2500
        );
}


/* ============================================================
   CARICAMENTO MESSAGGI
   ============================================================ */

async function caricaMessaggiThread(forzaScroll = false) {
    const uid = uidConversazioneAperta;
    if (!uid || (richiestaMessaggi && !forzaScroll)) return;
    annullaRichiestaMessaggi();
    const richiesta = new AbortController();
    richiestaMessaggi = richiesta;
    const attuale = () => richiestaMessaggi === richiesta && uidConversazioneAperta === uid;

    try {
        const risposta = await fetch(API_BASE + "/api/messaggi-privati/" + encodeURIComponent(uid), {
            credentials: "include", cache: "no-store", signal: richiesta.signal
        });
        if (!attuale()) return;
        if (risposta.status === 401) {
            location.href = "login.html?redirect=" + encodeURIComponent(location.href);
            return;
        }
        const dati = await risposta.json();
        if (!attuale()) return;

        const compositore = document.getElementById("compositore");
        if (dati.bloccata === true && dati.richiestaAmicizia === true) {
            if (firmaMessaggi !== "richiesta") renderRichiestaMessaggio(nomeConversazioneAperta);
            firmaMessaggi = "richiesta";
            return;
        }
        if (risposta.status === 403) {
            compositore.hidden = true;
            if (firmaMessaggi !== "403") mostraStatoThread(dati.errore || "Questa conversazione non è disponibile.");
            firmaMessaggi = "403";
            return;
        }
        if (!risposta.ok) throw new Error(dati.errore || "Impossibile caricare i messaggi.");

        const messaggi = Array.isArray(dati.messaggi) ? dati.messaggi : [];
        const firma = JSON.stringify(messaggi);
        compositore.hidden = false;
        if (firma !== firmaMessaggi) {
            renderMessaggi(messaggi, forzaScroll);
            firmaMessaggi = firma;
        } else if (forzaScroll) {
            requestAnimationFrame(scrollFondo);
        }
        aggiornaInboxSilenziosa();
    } catch (errore) {
        if (errore.name !== "AbortError" && attuale() && firmaMessaggi === null) {
            mostraStatoThread("Impossibile caricare i messaggi. Controlla la connessione.", true);
        }
    } finally {
        if (richiestaMessaggi === richiesta) richiestaMessaggi = null;
    }
}

function renderRichiestaMessaggio(
    nomeMittente
) {

    const box =
        document.getElementById(
            "messaggiChat"
        );

    document.getElementById("compositore").hidden = true;

    box.innerHTML = `
        <div class="richiesta-messaggio">

            <div class="richiesta-messaggio-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M21 11.5a8.38 8.38 0 0 1-9 8.5 8.63 8.63 0 0 1-4-.95L3 21l1.75-4.1A8.35 8.35 0 0 1 3 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5Z"></path>
                </svg>

            </div>

            <h3>
                Nuovo messaggio
            </h3>

            <p>
                <strong>${escapeHtml(nomeMittente || "Questo giocatore")}</strong>
                ti ha inviato un messaggio.
                Per leggerlo devi prima diventare suo amico.
            </p>

            <div class="richiesta-messaggio-azioni">

                <button
                    type="button"
                    class="btn-accetta-messaggio"
                    id="btnAccettaMessaggio"
                >
                    Diventa amico e leggi
                </button>

                <button
                    type="button"
                    class="btn-ignora-messaggio"
                    id="btnIgnoraMessaggio"
                >
                    Ignora
                </button>

            </div>

        </div>
    `;

    document
        .getElementById(
            "btnAccettaMessaggio"
        )
        .addEventListener(
            "click",
            accettaMessaggioEdiventaAmico
        );

    document
        .getElementById(
            "btnIgnoraMessaggio"
        )
        .addEventListener(
            "click",
            ignoraRichiestaMessaggio
        );
}

function renderMessaggi(
    messaggi,
    forzaScroll
) {

    const box =
        document.getElementById(
            "messaggiChat"
        );

    const posizione = box.scrollTop;

    const eraInFondo =
        box.scrollHeight -
        box.scrollTop -
        box.clientHeight <
        120;

    box.innerHTML = "";

    if (
        !messaggi.length
    ) {

        box.innerHTML = `
            <div class="chat-caricamento">
                Nessun messaggio. Inizia la conversazione!
            </div>
        `;

        return;
    }

    let ultimoGiorno =
        null;

    messaggi.forEach(
        messaggio => {

            const giorno =
                formatoGiorno(
                    messaggio.data
                );

            if (
                giorno &&
                giorno !== ultimoGiorno
            ) {

                const separatore =
                    document.createElement(
                        "div"
                    );

                separatore.className =
                    "giorno-chat";

                separatore.textContent =
                    giorno;

                box.appendChild(
                    separatore
                );

                ultimoGiorno =
                    giorno;
            }

            box.appendChild(
                creaBolla(
                    messaggio
                )
            );
        }
    );

    if (
        forzaScroll ||
        eraInFondo
    ) {

        requestAnimationFrame(
            scrollFondo
        );

    } else {
        box.scrollTop = posizione;
    }
}

function creaBolla(
    messaggio
) {

    const mio =
        messaggio.daUid === mioUid;

    const riga =
        document.createElement(
            "div"
        );

    riga.className =
        "riga-messaggio " +
        (mio ? "mio" : "altro");

    const bolla =
        document.createElement(
            "div"
        );

    bolla.className =
        "bolla";

    const testo =
        document.createElement(
            "div"
        );

    testo.className = "testo-messaggio";
    testo.textContent = messaggio.testo || "";

    const meta =
        document.createElement(
            "div"
        );

    meta.className =
        "meta-messaggio";

    const ora =
        document.createElement(
            "span"
        );

    ora.textContent =
        formatoOra(
            messaggio.data
        );

    meta.appendChild(
        ora
    );

    if (!mio) {

        const segnala =
            document.createElement(
                "button"
            );

        segnala.type =
            "button";

        segnala.className =
            "segnala-messaggio";

        segnala.textContent =
            "Segnala";

        segnala.addEventListener(
            "click",
            () => {

                segnalaMessaggio(
                    messaggio.daNome ||
                    "Utente",
                    messaggio.testo ||
                    ""
                );
            }
        );

        meta.appendChild(
            segnala
        );
    }

    bolla.appendChild(
        testo
    );

    bolla.appendChild(
        meta
    );

    riga.appendChild(
        bolla
    );

    return riga;
}

function scrollFondo() {

    const box =
        document.getElementById(
            "messaggiChat"
        );

    box.scrollTop =
        box.scrollHeight;
}

async function accettaMessaggioEdiventaAmico() {

    if (!uidConversazioneAperta) {
        return;
    }

    const bottone =
        document.getElementById(
            "btnAccettaMessaggio"
        );

    const bottoneIgnora =
        document.getElementById(
            "btnIgnoraMessaggio"
        );

    if (bottone) {
        bottone.disabled = true;
        bottone.textContent = "Accettazione...";
    }

    if (bottoneIgnora) {
        bottoneIgnora.disabled = true;
    }

    try {

        const risposta =
            await fetch(
                API_BASE +
                "/api/amici/accetta-messaggio",
                {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        altroUid:
                            uidConversazioneAperta
                    })
                }
            );

        const dati =
            await risposta.json();

        if (!risposta.ok) {

            mostraToast(
                dati.errore ||
                "Impossibile accettare il messaggio."
            );

            if (bottone) {
                bottone.disabled = false;
                bottone.textContent =
                    "Diventa amico e leggi";
            }

            if (bottoneIgnora) {
                bottoneIgnora.disabled = false;
            }

            return;
        }

        await aggiornaInboxSilenziosa();

        await caricaMessaggiThread(
            true
        );

    } catch (errore) {

        mostraToast(
            "Errore di connessione al server."
        );

        if (bottone) {
            bottone.disabled = false;
            bottone.textContent =
                "Diventa amico e leggi";
        }

        if (bottoneIgnora) {
            bottoneIgnora.disabled = false;
        }
    }
}

function ignoraRichiestaMessaggio() {
    chiudiThread();
}


/* ============================================================
   INVIO MESSAGGI
   ============================================================ */

async function inviaMessaggio() {
    const uid = uidConversazioneAperta;
    const testo = inputMessaggio.value.trim();
    const bottone = document.getElementById("btnInvia");
    if (!testo || !uid || bottone.disabled || document.getElementById("compositore").hidden) return;

    bottone.disabled = true;
    inputMessaggio.value = "";
    ridimensionaTextarea();
    try {
        const risposta = await fetch(API_BASE + "/api/messaggi-privati", {
            method: "POST", credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ destinatarioUid: uid, testo })
        });
        const dati = await risposta.json();
        if (!risposta.ok) throw new Error(dati.errore || "Errore durante l’invio.");
        if (uidConversazioneAperta === uid) await caricaMessaggiThread(true);
    } catch (errore) {
        if (uidConversazioneAperta === uid && !inputMessaggio.value) {
            inputMessaggio.value = testo;
            ridimensionaTextarea();
        }
        mostraToast(errore.message || "Errore di connessione al server.");
    } finally {
        bottone.disabled = false;
        if (uidConversazioneAperta === uid && !document.getElementById("compositore").hidden) inputMessaggio.focus();
    }
}


/* ============================================================
   SEGNALAZIONE
   ============================================================ */

async function segnalaMessaggio(
    mittente,
    testoMessaggio
) {

    const conferma =
        window.confirm(
            "Vuoi segnalare questo messaggio allo staff?"
        );

    if (!conferma) {
        return;
    }

    try {

        const risposta =
            await fetch(
                API_BASE +
                "/api/contatti",
                {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        categoria:
                            "Segnalazione",

                        messaggio:
                            `Segnalazione messaggio privato da "${mittente}": "${testoMessaggio}"`
                    })
                }
            );

        const dati =
            await risposta.json();

        if (!risposta.ok) {

            mostraToast(
                dati.errore ||
                "Errore durante la segnalazione."
            );

            return;
        }

        mostraToast(
            "Segnalazione inviata allo staff."
        );

    } catch (errore) {

        mostraToast(
            "Errore durante l'invio della segnalazione."
        );
    }
}


/* ============================================================
   AGGIORNAMENTO INBOX
   ============================================================ */

async function aggiornaInboxSilenziosa() {

    if (caricamentoInboxInCorso) {
        return;
    }

    caricamentoInboxInCorso = true;

    try {

        const risposta =
            await fetch(
                API_BASE +
                "/api/conversazioni",
                {
                    credentials: "include",
                    cache: "no-store"
                }
            );

        if (
            risposta.status === 401
        ) {

            window.location.href =
                "login.html?redirect=" +
                encodeURIComponent(
                    window.location.href
                );

            return;
        }

        if (!risposta.ok) {
            return;
        }

        const dati =
            await risposta.json();

        aggiornaElencoConversazioni(dati);

    } catch (errore) {

        /* aggiornamento silenzioso */

    } finally {

        caricamentoInboxInCorso =
            false;
    }
}


/* ============================================================
   RICERCA
   ============================================================ */

document
    .getElementById(
        "ricercaContatti"
    )
    .addEventListener(
        "input",
        renderConversazioni
    );


/* ============================================================
   PULSANTI
   ============================================================ */

document
    .getElementById(
        "btnTornaConversazioni"
    )
    .addEventListener(
        "click",
        chiudiThread
    );

document.getElementById("compositore").addEventListener("submit", evento => {
    evento.preventDefault();
    inviaMessaggio();
});


/* ============================================================
   TEXTAREA RESPONSIVE
   ============================================================ */

const inputMessaggio =
    document.getElementById(
        "inputMessaggio"
    );

function ridimensionaTextarea() {
    const contatore = document.getElementById("contatoreMessaggio");
    contatore.textContent = inputMessaggio.value.length + " / " + inputMessaggio.maxLength;
    contatore.setAttribute("aria-label", inputMessaggio.value.length + " di " + inputMessaggio.maxLength + " caratteri");
    inputMessaggio.style.height = "auto";
    inputMessaggio.style.height = Math.min(inputMessaggio.scrollHeight, 130) + "px";
}

inputMessaggio.addEventListener(
    "input",
    ridimensionaTextarea
);

inputMessaggio.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey && !event.isComposing
        ) {

            event.preventDefault();

            inviaMessaggio();
        }
    }
);


/* ============================================================
   AVVIO
   ============================================================ */

window.addEventListener(
    "beforeunload",
    () => {

        if (
            timerAggiornamento
        ) {

            clearInterval(
                timerAggiornamento
            );
        }

        if (
            timerAggiornamentoInbox
        ) {

            clearInterval(
                timerAggiornamentoInbox
            );
        }
    }
);

function aggiornaAltezzaMessaggi() {
    const viewport = window.visualViewport;
    if (viewport && viewport.scale === 1) {
        document.documentElement.style.setProperty("--altezza-messaggi", viewport.height + "px");
    } else {
        document.documentElement.style.removeProperty("--altezza-messaggi");
    }
}

window.visualViewport?.addEventListener("resize", aggiornaAltezzaMessaggi);
aggiornaAltezzaMessaggi();
avvia();
</script>
