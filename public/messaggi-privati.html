<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messaggi | Giochi Società</title>

<style>
    * {
        box-sizing: border-box;
    }

    :root {
        --verde: #1f8f6a;
        --verde-scuro: #167653;
        --verde-chiaro: #e9f7f1;

        --testo: #17212b;
        --testo-secondario: #74808c;
        --bordo: #e5e9ed;

        --sfondo: #f5f7f9;
        --bianco: #ffffff;

        --messaggio-mio: #dcf8c6;
        --messaggio-altro: #ffffff;

        --ombra: 0 12px 40px rgba(20, 35, 45, 0.08);
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--sfondo);
        color: var(--testo);
        font-family:
            Arial,
            Helvetica,
            sans-serif;
    }

    button,
    input {
        font: inherit;
    }

    button {
        border: 0;
    }

    /* =========================================================
       PAGINA PRINCIPALE
       ========================================================= */

    .pagina-messaggi {
        width: 100%;
        height: 100%;
        padding: 24px;
        display: flex;
        align-items: stretch;
        justify-content: center;
        background:
            linear-gradient(
                180deg,
                #f8fafb 0%,
                #f3f6f8 100%
            );
    }

    .app-messaggi {
        width: min(1500px, 100%);
        height: 100%;
        min-height: 0;
        display: flex;
        overflow: hidden;

        background: var(--bianco);
        border: 1px solid #e4e8ec;
        border-radius: 22px;
        box-shadow: var(--ombra);
    }

    /* =========================================================
       SIDEBAR CONTATTI
       ========================================================= */

    .sidebar-conversazioni {
        width: 380px;
        min-width: 330px;
        height: 100%;
        display: flex;
        flex-direction: column;

        background: #ffffff;
        border-right: 1px solid var(--bordo);
    }

    .sidebar-header {
        padding: 22px 22px 16px;
        border-bottom: 1px solid var(--bordo);
        background: #ffffff;
    }

    .sidebar-titolo-riga {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        margin-bottom: 18px;
    }

    .sidebar-titolo {
        margin: 0;
        font-size: 25px;
        font-weight: 800;
        letter-spacing: -0.5px;
    }

    .sidebar-sottotitolo {
        margin-top: 4px;
        color: var(--testo-secondario);
        font-size: 13px;
    }

    .btn-indietro {
        width: 42px;
        height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;
        background: #f1f4f6;
        color: #26323b;

        cursor: pointer;
        transition:
            background 0.18s ease,
            transform 0.18s ease;
    }

    .btn-indietro:hover {
        background: #e5eaee;
        transform: translateY(-1px);
    }

    .btn-indietro:active {
        transform: scale(0.96);
    }

    .btn-indietro svg {
        width: 19px;
        height: 19px;
    }

    .ricerca-conversazioni {
        position: relative;
    }

    .ricerca-conversazioni svg {
        position: absolute;
        left: 14px;
        top: 50%;
        width: 18px;
        height: 18px;
        transform: translateY(-50%);
        color: #8b97a2;
        pointer-events: none;
    }

    .ricerca-conversazioni input {
        width: 100%;
        height: 44px;
        padding: 0 16px 0 44px;

        border: 1px solid #e1e6ea;
        border-radius: 12px;
        outline: none;

        background: #f6f8f9;
        color: var(--testo);
        font-size: 14px;

        transition:
            border-color 0.18s ease,
            background 0.18s ease,
            box-shadow 0.18s ease;
    }

    .ricerca-conversazioni input:focus {
        background: #ffffff;
        border-color: #a9d8c6;
        box-shadow: 0 0 0 3px rgba(31, 143, 106, 0.08);
    }

    .lista-conversazioni {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #d6dde2 transparent;
    }

    .lista-conversazioni::-webkit-scrollbar {
        width: 8px;
    }

    .lista-conversazioni::-webkit-scrollbar-thumb {
        background: #d6dde2;
        border-radius: 20px;
    }

    .stato-lista {
        padding: 40px 24px;
        text-align: center;
        color: var(--testo-secondario);
        font-size: 14px;
    }

    .stato-lista strong {
        display: block;
        margin-bottom: 6px;
        color: var(--testo);
        font-size: 15px;
    }

    .conversazione {
        width: 100%;
        min-height: 82px;
        display: flex;
        align-items: center;
        gap: 13px;

        padding: 13px 18px;

        background: #ffffff;
        border-bottom: 1px solid #f0f2f4;

        cursor: pointer;
        text-align: left;

        transition:
            background 0.16s ease;
    }

    .conversazione:hover {
        background: #f8fafb;
    }

    .conversazione.attiva {
        background: var(--verde-chiaro);
    }

    .avatar-conversazione {
        width: 52px;
        height: 52px;
        min-width: 52px;

        border-radius: 50%;
        object-fit: cover;

        display: flex;
        align-items: center;
        justify-content: center;

        color: #ffffff;
        font-size: 18px;
        font-weight: 800;
        overflow: hidden;
    }

    .avatar-conversazione img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .conversazione-corpo {
        min-width: 0;
        flex: 1;
    }

    .conversazione-riga-superiore {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    .conversazione-nome {
        min-width: 0;

        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;

        color: #17212b;
        font-size: 15px;
        font-weight: 700;
    }

    .conversazione-data {
        flex-shrink: 0;
        color: #99a3ac;
        font-size: 11px;
    }

    .conversazione-riga-inferiore {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 5px;
    }

    .conversazione-anteprima {
        min-width: 0;
        flex: 1;

        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;

        color: #7a858f;
        font-size: 13px;
    }

    .badge-non-letti {
        min-width: 21px;
        height: 21px;
        padding: 0 6px;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        border-radius: 999px;

        background: var(--verde);
        color: #ffffff;

        font-size: 11px;
        font-weight: 800;
    }

    /* =========================================================
       AREA CHAT
       ========================================================= */

    .area-chat {
        flex: 1;
        min-width: 0;
        min-height: 0;

        display: flex;
        flex-direction: column;

        background:
            radial-gradient(
                circle at 20% 20%,
                rgba(31, 143, 106, 0.025) 0,
                rgba(31, 143, 106, 0.025) 1px,
                transparent 1px
            ),
            #f7f9fa;

        background-size: 24px 24px;
    }

    .chat-vuota {
        flex: 1;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        padding: 30px;
        text-align: center;
    }

    .chat-vuota-icon {
        width: 86px;
        height: 86px;

        display: flex;
        align-items: center;
        justify-content: center;

        margin-bottom: 22px;

        border-radius: 50%;
        background: #eaf7f2;
        color: var(--verde);
    }

    .chat-vuota-icon svg {
        width: 42px;
        height: 42px;
    }

    .chat-vuota h2 {
        margin: 0 0 8px;
        font-size: 24px;
    }

    .chat-vuota p {
        max-width: 460px;
        margin: 0;
        color: var(--testo-secondario);
        font-size: 14px;
        line-height: 1.6;
    }

    /* HEADER CHAT */

    .chat-header {
        min-height: 78px;

        display: flex;
        align-items: center;
        gap: 13px;

        padding: 13px 22px;

        background: #ffffff;
        border-bottom: 1px solid var(--bordo);

        box-shadow: 0 2px 8px rgba(20, 30, 40, 0.03);
    }

    .chat-header-info {
        min-width: 0;
        flex: 1;
    }

    .chat-header-nome {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;

        font-size: 16px;
        font-weight: 800;
    }

    .chat-header-stato {
        margin-top: 4px;
        color: var(--verde);
        font-size: 12px;
        font-weight: 600;
    }

    .chat-header-azioni {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .btn-chat-azione {
        width: 38px;
        height: 38px;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;
        background: #f3f5f6;
        color: #53606a;

        cursor: pointer;
        transition:
            background 0.18s ease,
            color 0.18s ease;
    }

    .btn-chat-azione:hover {
        background: #e8ecef;
        color: var(--testo);
    }

    .btn-chat-azione svg {
        width: 18px;
        height: 18px;
    }

    /* MESSAGGI */

    .messaggi-chat {
        flex: 1;
        min-height: 0;

        overflow-y: auto;

        padding: 26px 30px 22px;

        display: flex;
        flex-direction: column;
        gap: 8px;

        scrollbar-width: thin;
        scrollbar-color: #ccd4da transparent;
    }

    .messaggi-chat::-webkit-scrollbar {
        width: 8px;
    }

    .messaggi-chat::-webkit-scrollbar-thumb {
        background: #ccd4da;
        border-radius: 20px;
    }

    .giorno-chat {
        align-self: center;

        margin: 4px 0 10px;
        padding: 6px 12px;

        border-radius: 999px;
        background: rgba(255, 255, 255, 0.92);

        color: #87929c;
        font-size: 11px;
        font-weight: 700;

        box-shadow: 0 2px 8px rgba(20, 30, 40, 0.05);
    }

    .riga-messaggio {
        width: 100%;
        display: flex;
    }

    .riga-messaggio.mio {
        justify-content: flex-end;
    }

    .riga-messaggio.altro {
        justify-content: flex-start;
    }

    .bolla {
        max-width: min(72%, 620px);

        padding: 10px 13px 8px;

        border-radius: 15px;

        color: var(--testo);
        font-size: 14px;
        line-height: 1.48;

        word-break: break-word;
        white-space: pre-wrap;

        box-shadow:
            0 1px 2px rgba(20, 30, 40, 0.06);
    }

    .riga-messaggio.mio .bolla {
        background: var(--messaggio-mio);
        border-bottom-right-radius: 5px;
    }

    .riga-messaggio.altro .bolla {
        background: var(--messaggio-altro);
        border-bottom-left-radius: 5px;
        border: 1px solid #edf0f2;
    }

    .meta-messaggio {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;

        margin-top: 4px;

        color: #7d878f;
        font-size: 10px;
    }

    .riga-messaggio.mio .meta-messaggio {
        color: #6e8270;
    }

    .segnala-messaggio {
        padding: 0;
        background: none;
        color: #8a969f;
        font-size: 10px;

        cursor: pointer;
        text-decoration: underline;
    }

    .segnala-messaggio:hover {
        color: #d9363e;
    }

    .chat-caricamento {
        align-self: center;
        padding: 12px 16px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.88);
        color: #818c95;
        font-size: 13px;
    }

    /* =========================================================
       AREA INVIO
       ========================================================= */

    .compositore {
        padding: 14px 18px 17px;

        background: #ffffff;
        border-top: 1px solid var(--bordo);
    }

    .riga-compositore {
        display: flex;
        align-items: flex-end;
        gap: 10px;

        padding: 7px 7px 7px 14px;

        border: 1px solid #dfe5e9;
        border-radius: 17px;
        background: #f8fafb;

        transition:
            border-color 0.18s ease,
            box-shadow 0.18s ease;
    }

    .riga-compositore:focus-within {
        background: #ffffff;
        border-color: #9ed6c0;
        box-shadow: 0 0 0 3px rgba(31, 143, 106, 0.08);
    }

    .input-messaggio {
        flex: 1;
        min-width: 0;

        max-height: 130px;
        min-height: 40px;

        padding: 9px 2px;

        border: 0;
        outline: none;
        resize: none;

        background: transparent;
        color: var(--testo);

        font-size: 14px;
        line-height: 1.4;
    }

    .input-messaggio::placeholder {
        color: #909ba4;
    }

    .btn-invia {
        width: 42px;
        height: 42px;
        flex-shrink: 0;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: var(--verde);
        color: #ffffff;

        cursor: pointer;

        transition:
            background 0.18s ease,
            transform 0.18s ease;
    }

    .btn-invia:hover {
        background: var(--verde-scuro);
        transform: translateY(-1px);
    }

    .btn-invia:active {
        transform: scale(0.96);
    }

    .btn-invia:disabled {
        opacity: 0.5;
        cursor: default;
        transform: none;
    }

    .btn-invia svg {
        width: 18px;
        height: 18px;
    }

    .compositore-info {
        margin-top: 7px;
        padding: 0 4px;

        color: #98a1a8;
        font-size: 10px;
    }

    /* =========================================================
       TOAST
       ========================================================= */

    #contenitore-toast {
        position: fixed;
        right: 20px;
        bottom: 20px;

        z-index: 1000;

        display: flex;
        flex-direction: column;
        gap: 8px;

        pointer-events: none;
    }

    .toast {
        max-width: 340px;

        padding: 12px 15px;

        border-radius: 12px;

        background: #17212b;
        color: #ffffff;

        box-shadow: 0 10px 30px rgba(20, 30, 40, 0.22);

        font-size: 13px;
        animation: comparsaToast 0.2s ease;
    }

    @keyframes comparsaToast {
        from {
            opacity: 0;
            transform: translateY(8px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 900px) {

        html,
        body {
            overflow: hidden;
        }

        .pagina-messaggi {
            padding: 0;
        }

        .app-messaggi {
            width: 100%;
            height: 100%;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        .sidebar-conversazioni {
            width: 100%;
            min-width: 0;
        }

        .area-chat {
            width: 100%;
        }

        body.thread-aperto .sidebar-conversazioni {
            display: none;
        }

        body.thread-aperto .area-chat {
            display: flex;
        }

        body:not(.thread-aperto) .area-chat {
            display: none;
        }

        .chat-header {
            min-height: 68px;
            padding: 10px 12px;
        }

        .chat-header-azioni {
            display: none;
        }

        .messaggi-chat {
            padding: 18px 12px 15px;
        }

        .bolla {
            max-width: 84%;
            font-size: 13px;
        }

        .compositore {
            padding: 9px 10px 11px;
        }

        .sidebar-header {
            padding: 16px 14px 12px;
        }

        .sidebar-titolo {
            font-size: 22px;
        }

        .btn-indietro {
            width: 38px;
            height: 38px;
        }

        .conversazione {
            padding: 11px 13px;
        }

        .avatar-conversazione {
            width: 48px;
            height: 48px;
            min-width: 48px;
        }
    }

    @media (max-width: 520px) {

        .sidebar-titolo {
            font-size: 20px;
        }

        .sidebar-sottotitolo {
            font-size: 12px;
        }

        .conversazione {
            min-height: 76px;
        }

        .avatar-conversazione {
            width: 45px;
            height: 45px;
            min-width: 45px;
            font-size: 16px;
        }

        .conversazione-nome {
            font-size: 14px;
        }

        .conversazione-anteprima {
            font-size: 12px;
        }

        .chat-header-nome {
            font-size: 15px;
        }

        .chat-header-stato {
            font-size: 11px;
        }

        .bolla {
            max-width: 88%;
            padding: 8px 11px 7px;
            font-size: 12.5px;
        }

        .input-messaggio {
            font-size: 13px;
        }

        .btn-invia {
            width: 40px;
            height: 40px;
        }
    }
</style>
</head>

<body>

<div class="pagina-messaggi">

    <div class="app-messaggi">

        <!-- =====================================================
             SIDEBAR CONVERSAZIONI
             ===================================================== -->

        <aside class="sidebar-conversazioni">

            <div class="sidebar-header">

                <div class="sidebar-titolo-riga">

                    <div>
                        <h1 class="sidebar-titolo">Messaggi</h1>
                        <div class="sidebar-sottotitolo">
                            Le tue conversazioni private
                        </div>
                    </div>

                    <button
                        type="button"
                        class="btn-indietro"
                        title="Torna indietro"
                        onclick="history.back()"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M15 18l-6-6 6-6"></path>
                        </svg>
                    </button>

                </div>

                <div class="ricerca-conversazioni">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-4-4"></path>
                    </svg>

                    <input
                        id="ricercaContatti"
                        type="text"
                        placeholder="Cerca conversazione..."
                        autocomplete="off"
                    >

                </div>

            </div>

            <div
                class="lista-conversazioni"
                id="listaConversazioni"
            >
                <div class="stato-lista">
                    Caricamento conversazioni...
                </div>
            </div>

        </aside>

        <!-- =====================================================
             CHAT
             ===================================================== -->

        <main class="area-chat">

            <section
                class="chat-vuota"
                id="chatVuota"
            >

                <div class="chat-vuota-icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M21 11.5a8.38 8.38 0 0 1-9 8.5 8.63 8.63 0 0 1-4-.95L3 21l1.75-4.1A8.35 8.35 0 0 1 3 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5Z"></path>
                    </svg>

                </div>

                <h2>I tuoi messaggi</h2>

                <p>
                    Seleziona una conversazione a sinistra per iniziare
                    a parlare con un altro giocatore.
                </p>

            </section>

            <section
                id="chatAttiva"
                style="display:none; flex:1; min-height:0; flex-direction:column;"
            >

                <!-- HEADER CHAT -->

                <header class="chat-header">

                    <button
                        type="button"
                        class="btn-chat-azione"
                        title="Torna alle conversazioni"
                        id="btnTornaConversazioni"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M15 18l-6-6 6-6"></path>
                        </svg>
                    </button>

                    <div
                        id="chatAvatar"
                        class="avatar-conversazione"
                    ></div>

                    <div class="chat-header-info">

                        <div
                            id="chatNome"
                            class="chat-header-nome"
                        >
                            Utente
                        </div>

                        <div class="chat-header-stato">
                            Conversazione privata
                        </div>

                    </div>

                </header>

                <!-- MESSAGGI -->

                <div
                    id="messaggiChat"
                    class="messaggi-chat"
                ></div>

                <!-- COMPOSITORE -->

                <div class="compositore">

                    <div class="riga-compositore">

                        <textarea
                            id="inputMessaggio"
                            class="input-messaggio"
                            placeholder="Scrivi un messaggio..."
                            maxlength="500"
                            rows="1"
                        ></textarea>

                        <button
                            type="button"
                            id="btnInvia"
                            class="btn-invia"
                            title="Invia messaggio"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="m22 2-7 20-4-9-9-4Z"></path>
                                <path d="M22 2 11 13"></path>
                            </svg>
                        </button>

                    </div>

                    <div class="compositore-info">
                        Premi Invio per inviare · massimo 500 caratteri
                    </div>

                </div>

            </section>

        </main>

    </div>

</div>

<div id="contenitore-toast"></div>

<script>
/* ============================================================
   CONFIGURAZIONE
   ============================================================ */

const API_BASE =
    "https://gioco-oca-server.onrender.com";

const parametri =
    new URLSearchParams(window.location.search);

let mioUid = null;

let uidConversazioneAperta =
    parametri.get("con");

let nomeConversazioneAperta =
    parametri.get("nome") || "";

let conversazioniCache = [];

let timerAggiornamento =
    null;

let caricamentoMessaggiInCorso =
    false;


/* ============================================================
   UTILITY
   ============================================================ */

const PALETTE = [
    "#6a2c70",
    "#1e40af",
    "#43a047",
    "#f57c00",
    "#c0ca33",
    "#e53935",
    "#00838f",
    "#8d6e63"
];

function coloreDaNome(nome) {

    let somma = 0;

    for (
        let i = 0;
        i < (nome || "?").length;
        i++
    ) {
        somma +=
            nome.charCodeAt(i);
    }

    return PALETTE[
        somma % PALETTE.length
    ];
}

function iniziale(nome) {

    return (
        (nome || "?")
            .trim()
            .charAt(0)
            .toUpperCase()
        || "?"
    );
}

function escapeHtml(testo) {

    const div =
        document.createElement("div");

    div.textContent =
        testo == null
            ? ""
            : String(testo);

    return div.innerHTML;
}

function formatoOra(timestamp) {

    try {

        return new Date(timestamp)
            .toLocaleTimeString(
                "it-IT",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

    } catch {

        return "";
    }
}

function formatoGiorno(timestamp) {

    try {

        const data =
            new Date(timestamp);

        const oggi =
            new Date();

        const ieri =
            new Date();

        ieri.setDate(
            ieri.getDate() - 1
        );

        if (
            data.toDateString() ===
            oggi.toDateString()
        ) {
            return "Oggi";
        }

        if (
            data.toDateString() ===
            ieri.toDateString()
        ) {
            return "Ieri";
        }

        return data.toLocaleDateString(
            "it-IT",
            {
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

    } catch {

        return "";
    }
}

function mostraToast(testo) {

    const contenitore =
        document.getElementById(
            "contenitore-toast"
        );

    const toast =
        document.createElement("div");

    toast.className =
        "toast";

    toast.textContent =
        testo;

    contenitore.appendChild(
        toast
    );

    setTimeout(() => {

        toast.remove();

    }, 4000);
}


/* ============================================================
   AUTENTICAZIONE
   ============================================================ */

async function avvia() {

    try {

        const risposta =
            await fetch(
                API_BASE + "/api/me",
                {
                    credentials: "include"
                }
            );

        if (!risposta.ok) {

            window.location.href =
                "login.html?redirect=" +
                encodeURIComponent(
                    window.location.href
                );

            return;
        }

        const dati =
            await risposta.json();

        mioUid =
            dati.uid;

        await caricaInbox();

        if (
            uidConversazioneAperta
        ) {

            const conversazione =
                conversazioniCache.find(
                    c =>
                        c.altroUid ===
                        uidConversazioneAperta
                );

            apriThread(
                uidConversazioneAperta,
                conversazione
                    ? conversazione.altroNome
                    : nomeConversazioneAperta
            );
        }

    } catch (errore) {

        window.location.href =
            "login.html?redirect=" +
            encodeURIComponent(
                window.location.href
            );
    }
}


/* ============================================================
   INBOX
   ============================================================ */

async function caricaInbox() {

    try {

        const risposta =
            await fetch(
                API_BASE + "/api/conversazioni",
                {
                    credentials: "include"
                }
            );

        if (risposta.status === 401) {

            window.location.href =
                "login.html?redirect=" +
                encodeURIComponent(
                    window.location.href
                );

            return;
        }

        const dati =
            await risposta.json();

        conversazioniCache =
            Array.isArray(
                dati.conversazioni
            )
                ? dati.conversazioni
                : [];

        renderConversazioni();

    } catch (errore) {

        document.getElementById(
            "listaConversazioni"
        ).innerHTML = `
            <div class="stato-lista">
                <strong>Impossibile caricare i messaggi</strong>
                Controlla la connessione e riprova.
            </div>
        `;
    }
}

function renderConversazioni() {

    const contenitore =
        document.getElementById(
            "listaConversazioni"
        );

    const ricerca =
        document
            .getElementById(
                "ricercaContatti"
            )
            .value
            .trim()
            .toLowerCase();

    const filtrate =
        conversazioniCache.filter(
            c =>
                !ricerca ||
                (c.altroNome || "")
                    .toLowerCase()
                    .includes(ricerca)
        );

    if (!filtrate.length) {

        if (
            conversazioniCache.length === 0
        ) {

            contenitore.innerHTML = `
                <div class="stato-lista">
                    <strong>Nessuna conversazione</strong>
                    Vai sul profilo di un giocatore
                    per iniziare una nuova chat.
                </div>
            `;

        } else {

            contenitore.innerHTML = `
                <div class="stato-lista">
                    <strong>Nessun risultato</strong>
                    Nessuna conversazione corrisponde
                    alla ricerca.
                </div>
            `;
        }

        return;
    }

    contenitore.innerHTML = "";

    filtrate.forEach(
        conversazione => {

            const elemento =
                document.createElement(
                    "button"
                );

            elemento.type =
                "button";

            elemento.className =
                "conversazione" +
                (
                    uidConversazioneAperta ===
                    conversazione.altroUid
                        ? " attiva"
                        : ""
                );

            const avatar =
                document.createElement(
                    "div"
                );

            avatar.className =
                "avatar-conversazione";

            avatar.style.background =
                coloreDaNome(
                    conversazione.altroNome
                );

            avatar.textContent =
                iniziale(
                    conversazione.altroNome
                );

            const corpo =
                document.createElement(
                    "div"
                );

            corpo.className =
                "conversazione-corpo";

            const rigaSuperiore =
                document.createElement(
                    "div"
                );

            rigaSuperiore.className =
                "conversazione-riga-superiore";

            const nome =
                document.createElement(
                    "div"
                );

            nome.className =
                "conversazione-nome";

            nome.textContent =
                conversazione.altroNome ||
                "Utente";

            const data =
                document.createElement(
                    "div"
                );

            data.className =
                "conversazione-data";

            data.textContent =
                formatoGiorno(
                    conversazione.ultimaData
                );

            rigaSuperiore.appendChild(
                nome
            );

            rigaSuperiore.appendChild(
                data
            );

            const rigaInferiore =
                document.createElement(
                    "div"
                );

            rigaInferiore.className =
                "conversazione-riga-inferiore";

            const anteprima =
                document.createElement(
                    "div"
                );

            anteprima.className =
                "conversazione-anteprima";

            anteprima.textContent =
                conversazione.ultimoTesto ||
                "";

            rigaInferiore.appendChild(
                anteprima
            );

            if (
                Number(
                    conversazione.nonLetti
                ) > 0
            ) {

                const badge =
                    document.createElement(
                        "span"
                    );

                badge.className =
                    "badge-non-letti";

                badge.textContent =
                    conversazione.nonLetti;

                rigaInferiore.appendChild(
                    badge
                );
            }

            corpo.appendChild(
                rigaSuperiore
            );

            corpo.appendChild(
                rigaInferiore
            );

            elemento.appendChild(
                avatar
            );

            elemento.appendChild(
                corpo
            );

            elemento.addEventListener(
                "click",
                () => {

                    apriThread(
                        conversazione.altroUid,
                        conversazione.altroNome
                    );
                }
            );

            contenitore.appendChild(
                elemento
            );
        }
    );
}


/* ============================================================
   THREAD
   ============================================================ */

async function apriThread(
    uidDestinatario,
    nomeDestinatario
) {

    uidConversazioneAperta =
        uidDestinatario;

    nomeConversazioneAperta =
        nomeDestinatario || "Utente";

    document.body.classList.add(
        "thread-aperto"
    );

    window.history.replaceState(
        {},
        "",
        "messaggi-privati.html?con=" +
        encodeURIComponent(
            uidDestinatario
        ) +
        "&nome=" +
        encodeURIComponent(
            nomeDestinatario || ""
        )
    );

    document.getElementById(
        "chatVuota"
    ).style.display =
        "none";

    document.getElementById(
        "chatAttiva"
    ).style.display =
        "flex";

    const avatar =
        document.getElementById(
            "chatAvatar"
        );

    avatar.innerHTML = "";

    avatar.style.background =
        coloreDaNome(
            nomeDestinatario
        );

    avatar.textContent =
        iniziale(
            nomeDestinatario
        );

    document.getElementById(
        "chatNome"
    ).textContent =
        nomeDestinatario ||
        "Utente";

    document.getElementById(
        "inputMessaggio"
    ).focus();

    await caricaMessaggiThread(
        true
    );

    avviaAggiornamentoThread();

    renderConversazioni();
}

function chiudiThread() {

    uidConversazioneAperta =
        null;

    nomeConversazioneAperta =
        "";

    if (
        timerAggiornamento
    ) {

        clearInterval(
            timerAggiornamento
        );

        timerAggiornamento =
            null;
    }

    document.body.classList.remove(
        "thread-aperto"
    );

    document.getElementById(
        "chatAttiva"
    ).style.display =
        "none";

    document.getElementById(
        "chatVuota"
    ).style.display =
        "flex";

    window.history.replaceState(
        {},
        "",
        "messaggi-privati.html"
    );

    renderConversazioni();
}

function avviaAggiornamentoThread() {

    if (
        timerAggiornamento
    ) {

        clearInterval(
            timerAggiornamento
        );
    }

    timerAggiornamento =
        setInterval(
            () => {
                caricaMessaggiThread(
                    false
                );
            },
            2500
        );
}


/* ============================================================
   CARICAMENTO MESSAGGI
   ============================================================ */

async function caricaMessaggiThread(
    forzaScroll
) {

    if (
        !uidConversazioneAperta ||
        caricamentoMessaggiInCorso
    ) {
        return;
    }

    caricamentoMessaggiInCorso =
        true;

    try {

        const risposta =
            await fetch(
                API_BASE +
                "/api/messaggi-privati/" +
                encodeURIComponent(
                    uidConversazioneAperta
                ),
                {
                    credentials: "include"
                }
            );

        if (
            risposta.status === 401
        ) {

            window.location.href =
                "login.html?redirect=" +
                encodeURIComponent(
                    window.location.href
                );

            return;
        }

        const dati =
            await risposta.json();

        renderMessaggi(
            dati.messaggi || [],
            forzaScroll
        );

        /*
         * Aggiorniamo anche l'inbox perché l'API
         * segna come letti i messaggi ricevuti.
         */
        await aggiornaInboxSilenziosa();

    } catch (errore) {

        mostraToast(
            "Impossibile aggiornare la conversazione."
        );

    } finally {

        caricamentoMessaggiInCorso =
            false;
    }
}

function renderMessaggi(
    messaggi,
    forzaScroll
) {

    const box =
        document.getElementById(
            "messaggiChat"
        );

    const vecchiaAltezza =
        box.scrollHeight;

    const eraInFondo =
        box.scrollHeight -
        box.scrollTop -
        box.clientHeight <
        120;

    box.innerHTML = "";

    if (
        !messaggi.length
    ) {

        box.innerHTML = `
            <div class="chat-caricamento">
                Nessun messaggio. Inizia la conversazione!
            </div>
        `;

        return;
    }

    let ultimoGiorno =
        null;

    messaggi.forEach(
        messaggio => {

            const giorno =
                formatoGiorno(
                    messaggio.data
                );

            if (
                giorno &&
                giorno !== ultimoGiorno
            ) {

                const separatore =
                    document.createElement(
                        "div"
                    );

                separatore.className =
                    "giorno-chat";

                separatore.textContent =
                    giorno;

                box.appendChild(
                    separatore
                );

                ultimoGiorno =
                    giorno;
            }

            box.appendChild(
                creaBolla(
                    messaggio
                )
            );
        }
    );

    if (
        forzaScroll ||
        eraInFondo
    ) {

        requestAnimationFrame(
            scrollFondo
        );

    } else {

        const differenza =
            box.scrollHeight -
            vecchiaAltezza;

        if (differenza > 0) {

            box.scrollTop =
                Math.max(
                    0,
                    box.scrollTop +
                    differenza
                );
        }
    }
}

function creaBolla(
    messaggio
) {

    const mio =
        messaggio.daUid === mioUid;

    const riga =
        document.createElement(
            "div"
        );

    riga.className =
        "riga-messaggio " +
        (mio ? "mio" : "altro");

    const bolla =
        document.createElement(
            "div"
        );

    bolla.className =
        "bolla";

    const testo =
        document.createElement(
            "div"
        );

    testo.textContent =
        messaggio.testo || "";

    const meta =
        document.createElement(
            "div"
        );

    meta.className =
        "meta-messaggio";

    const ora =
        document.createElement(
            "span"
        );

    ora.textContent =
        formatoOra(
            messaggio.data
        );

    meta.appendChild(
        ora
    );

    if (!mio) {

        const segnala =
            document.createElement(
                "button"
            );

        segnala.type =
            "button";

        segnala.className =
            "segnala-messaggio";

        segnala.textContent =
            "Segnala";

        segnala.addEventListener(
            "click",
            () => {

                segnalaMessaggio(
                    messaggio.daNome ||
                    "Utente",
                    messaggio.testo ||
                    ""
                );
            }
        );

        meta.appendChild(
            segnala
        );
    }

    bolla.appendChild(
        testo
    );

    bolla.appendChild(
        meta
    );

    riga.appendChild(
        bolla
    );

    return riga;
}

function scrollFondo() {

    const box =
        document.getElementById(
            "messaggiChat"
        );

    box.scrollTop =
        box.scrollHeight;
}


/* ============================================================
   INVIO MESSAGGI
   ============================================================ */

async function inviaMessaggio() {

    const input =
        document.getElementById(
            "inputMessaggio"
        );

    const testo =
        input.value.trim();

    if (
        !testo ||
        !uidConversazioneAperta
    ) {

        return;
    }

    const bottone =
        document.getElementById(
            "btnInvia"
        );

    input.value =
        "";

    ridimensionaTextarea();

    bottone.disabled =
        true;

    try {

        const risposta =
            await fetch(
                API_BASE +
                "/api/messaggi-privati",
                {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        destinatarioUid:
                            uidConversazioneAperta,

                        testo
                    })
                }
            );

        const dati =
            await risposta.json();

        if (
            !risposta.ok
        ) {

            mostraToast(
                dati.errore ||
                "Errore durante l'invio."
            );

            input.value =
                testo;

            ridimensionaTextarea();

            return;
        }

        await caricaMessaggiThread(
            true
        );

    } catch (errore) {

        input.value =
            testo;

        ridimensionaTextarea();

        mostraToast(
            "Errore di connessione al server."
        );

    } finally {

        bottone.disabled =
            false;

        input.focus();
    }
}


/* ============================================================
   SEGNALAZIONE
   ============================================================ */

async function segnalaMessaggio(
    mittente,
    testoMessaggio
) {

    const conferma =
        window.confirm(
            "Vuoi segnalare questo messaggio allo staff?"
        );

    if (!conferma) {
        return;
    }

    try {

        const risposta =
            await fetch(
                API_BASE +
                "/api/contatti",
                {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        categoria:
                            "Segnalazione",

                        messaggio:
                            `Segnalazione messaggio privato da "${mittente}": "${testoMessaggio}"`
                    })
                }
            );

        const dati =
            await risposta.json();

        if (!risposta.ok) {

            mostraToast(
                dati.errore ||
                "Errore durante la segnalazione."
            );

            return;
        }

        mostraToast(
            "Segnalazione inviata allo staff."
        );

    } catch (errore) {

        mostraToast(
            "Errore durante l'invio della segnalazione."
        );
    }
}


/* ============================================================
   AGGIORNAMENTO INBOX
   ============================================================ */

async function aggiornaInboxSilenziosa() {

    try {

        const risposta =
            await fetch(
                API_BASE +
                "/api/conversazioni",
                {
                    credentials: "include"
                }
            );

        if (!risposta.ok) {
            return;
        }

        const dati =
            await risposta.json();

        conversazioniCache =
            Array.isArray(
                dati.conversazioni
            )
                ? dati.conversazioni
                : [];

        renderConversazioni();

    } catch (errore) {
        /* silenzioso */
    }
}


/* ============================================================
   RICERCA
   ============================================================ */

document
    .getElementById(
        "ricercaContatti"
    )
    .addEventListener(
        "input",
        renderConversazioni
    );


/* ============================================================
   PULSANTI
   ============================================================ */

document
    .getElementById(
        "btnTornaConversazioni"
    )
    .addEventListener(
        "click",
        chiudiThread
    );

document
    .getElementById(
        "btnInvia"
    )
    .addEventListener(
        "click",
        inviaMessaggio
    );


/* ============================================================
   TEXTAREA RESPONSIVE
   ============================================================ */

const inputMessaggio =
    document.getElementById(
        "inputMessaggio"
    );

function ridimensionaTextarea() {

    inputMessaggio.style.height =
        "auto";

    inputMessaggio.style.height =
        Math.min(
            inputMessaggio.scrollHeight,
            130
        ) + "px";
}

inputMessaggio.addEventListener(
    "input",
    ridimensionaTextarea
);

inputMessaggio.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            inviaMessaggio();
        }
    }
);


/* ============================================================
   AVVIO
   ============================================================ */

window.addEventListener(
    "beforeunload",
    () => {

        if (
            timerAggiornamento
        ) {

            clearInterval(
                timerAggiornamento
            );
        }
    }
);

avvia();
</script>
