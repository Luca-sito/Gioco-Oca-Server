<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messaggi privati | Giochi Società</title>

<style>
    * {
        box-sizing: border-box;
    }

    :root {
        --verde: #178861;
        --verde-scuro: #106d4d;
        --verde-hover: #147954;
        --verde-chiaro: #eaf7f1;
        --verde-soft: #f3faf7;

        --navy: #18232d;
        --navy-2: #22303b;

        --testo: #17222b;
        --testo-2: #55636e;
        --testo-3: #8b97a1;

        --sfondo: #eef2f5;
        --superficie: #ffffff;
        --superficie-2: #f8fafb;

        --bordo: #e1e7eb;
        --bordo-soft: #edf1f4;

        --mio: #d8f5e6;
        --altro: #ffffff;

        --ombra-leggera: 0 2px 8px rgba(20, 31, 40, 0.05);
        --ombra-media: 0 8px 30px rgba(20, 31, 40, 0.08);
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;

        background: var(--sfondo);
        color: var(--testo);

        font-family:
            Inter,
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Arial,
            Helvetica,
            sans-serif;
    }

    body {
        min-height: 100vh;
    }

    button,
    input,
    textarea {
        font: inherit;
    }

    button {
        border: 0;
    }

    /* =========================================================
       LAYOUT PRINCIPALE
       ========================================================= */

    .pagina-messaggi {
        width: 100%;
        height: 100%;
        min-height: 100vh;

        display: flex;

        background:
            linear-gradient(
                180deg,
                #f5f7f9 0%,
                #eef2f5 100%
            );
    }

    .app-messaggi {
        width: 100%;
        height: 100%;

        display: flex;
        overflow: hidden;

        background: var(--superficie);

        border: 0;
        border-radius: 0;
        box-shadow: none;
    }

    /* =========================================================
       SIDEBAR
       ========================================================= */

    .sidebar-conversazioni {
        width: 390px;
        min-width: 350px;
        height: 100%;

        display: flex;
        flex-direction: column;

        background:
            linear-gradient(
                180deg,
                #ffffff 0%,
                #fbfcfd 100%
            );

        border-right: 1px solid var(--bordo);
    }

    .sidebar-header {
        padding: 28px 24px 20px;

        border-bottom: 1px solid var(--bordo);

        background: #ffffff;
    }

    .sidebar-titolo-riga {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;

        margin-bottom: 22px;
    }

    .sidebar-brand {
        min-width: 0;
    }

    .sidebar-etichetta {
        margin-bottom: 7px;

        color: var(--verde);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.2px;
        text-transform: uppercase;
    }

    .sidebar-titolo {
        margin: 0;

        color: var(--testo);

        font-size: 28px;
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: -0.7px;
    }

    .sidebar-sottotitolo {
        margin-top: 7px;

        color: var(--testo-3);
        font-size: 13px;
        line-height: 1.4;
    }

    .btn-indietro {
        width: 42px;
        height: 42px;
        min-width: 42px;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        border: 1px solid #e1e6ea;
        border-radius: 11px;

        background: #f7f9fa;
        color: #51606b;

        cursor: pointer;

        transition:
            background 0.18s ease,
            border-color 0.18s ease,
            color 0.18s ease,
            transform 0.18s ease;
    }

    .btn-indietro:hover {
        background: #eef3f1;
        border-color: #d3e1dc;
        color: var(--verde-scuro);
        transform: translateY(-1px);
    }

    .btn-indietro:active {
        transform: scale(0.97);
    }

    .btn-indietro svg {
        width: 19px;
        height: 19px;
    }

    /* =========================================================
       RICERCA
       ========================================================= */

    .ricerca-conversazioni {
        position: relative;
    }

    .ricerca-conversazioni svg {
        position: absolute;
        left: 15px;
        top: 50%;

        width: 18px;
        height: 18px;

        transform: translateY(-50%);

        color: #8c98a1;
        pointer-events: none;
    }

    .ricerca-conversazioni input {
        width: 100%;
        height: 46px;

        padding: 0 16px 0 44px;

        border: 1px solid #dfe5e9;
        border-radius: 12px;

        outline: none;

        background: #f6f8f9;
        color: var(--testo);

        font-size: 14px;

        transition:
            background 0.18s ease,
            border-color 0.18s ease,
            box-shadow 0.18s ease;
    }

    .ricerca-conversazioni input::placeholder {
        color: #98a3ac;
    }

    .ricerca-conversazioni input:focus {
        background: #ffffff;
        border-color: #9ed5bf;

        box-shadow:
            0 0 0 3px rgba(23, 136, 97, 0.08);
    }

    /* =========================================================
       LISTA CONVERSAZIONI
       ========================================================= */

    .lista-conversazioni {
        flex: 1;
        min-height: 0;

        overflow-y: auto;

        scrollbar-width: thin;
        scrollbar-color: #cfd7dd transparent;
    }

    .lista-conversazioni::-webkit-scrollbar {
        width: 8px;
    }

    .lista-conversazioni::-webkit-scrollbar-track {
        background: transparent;
    }

    .lista-conversazioni::-webkit-scrollbar-thumb {
        background: #cfd7dd;
        border-radius: 99px;
    }

    .stato-lista {
        padding: 48px 28px;

        text-align: center;

        color: var(--testo-3);

        font-size: 14px;
        line-height: 1.6;
    }

    .stato-lista strong {
        display: block;

        margin-bottom: 7px;

        color: var(--testo);

        font-size: 15px;
        font-weight: 750;
    }

    .conversazione {
        width: 100%;
        min-height: 84px;

        display: flex;
        align-items: center;
        gap: 14px;

        padding: 13px 19px;

        border-bottom: 1px solid #f0f2f4;

        background: transparent;

        cursor: pointer;
        text-align: left;

        transition:
            background 0.15s ease,
            box-shadow 0.15s ease;
    }

    .conversazione:hover {
        background: #f8fafb;
    }

    .conversazione.attiva {
        background:
            linear-gradient(
                90deg,
                #edf8f3 0%,
                #f7fbf9 100%
            );

        box-shadow:
            inset 3px 0 0 var(--verde);
    }

    .avatar-conversazione {
        width: 53px;
        height: 53px;
        min-width: 53px;

        display: flex;
        align-items: center;
        justify-content: center;

        overflow: hidden;

        border-radius: 50%;

        color: #ffffff;

        font-size: 18px;
        font-weight: 800;

        box-shadow:
            inset 0 0 0 1px rgba(255, 255, 255, 0.18);
    }

    .avatar-conversazione img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .conversazione-corpo {
        min-width: 0;
        flex: 1;
    }

    .conversazione-riga-superiore {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    .conversazione-nome {
        min-width: 0;

        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;

        color: var(--testo);

        font-size: 14px;
        font-weight: 750;
    }

    .conversazione-data {
        flex-shrink: 0;

        color: #9aa5ad;

        font-size: 10px;
        font-weight: 500;
    }

    .conversazione-riga-inferiore {
        display: flex;
        align-items: center;
        gap: 8px;

        margin-top: 5px;
    }

    .conversazione-anteprima {
        min-width: 0;
        flex: 1;

        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;

        color: var(--testo-3);

        font-size: 12.5px;
        line-height: 1.4;
    }

    .badge-non-letti {
        min-width: 21px;
        height: 21px;

        padding: 0 6px;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        background: var(--verde);
        color: #ffffff;

        font-size: 10px;
        font-weight: 800;
    }

    /* =========================================================
       AREA PRINCIPALE CHAT
       ========================================================= */

    .area-chat {
        flex: 1;
        min-width: 0;
        min-height: 0;

        display: flex;
        flex-direction: column;

        background:
            radial-gradient(
                circle at 15% 15%,
                rgba(23, 136, 97, 0.025) 0,
                rgba(23, 136, 97, 0.025) 1px,
                transparent 1px
            ),
            #f5f8f9;

        background-size: 24px 24px;
    }

    /* =========================================================
       CHAT VUOTA
       ========================================================= */

    .chat-vuota {
        flex: 1;
        min-height: 0;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        padding: 40px;

        text-align: center;
    }

    .chat-vuota-icon {
        width: 82px;
        height: 82px;

        display: flex;
        align-items: center;
        justify-content: center;

        margin-bottom: 24px;

        border: 1px solid #d8eee5;
        border-radius: 22px;

        background: #eef9f4;
        color: var(--verde);

        box-shadow:
            0 10px 30px rgba(23, 136, 97, 0.08);
    }

    .chat-vuota-icon svg {
        width: 40px;
        height: 40px;
    }

    .chat-vuota h2 {
        margin: 0 0 9px;

        color: var(--testo);

        font-size: 25px;
        line-height: 1.2;
        font-weight: 800;
        letter-spacing: -0.4px;
    }

    .chat-vuota p {
        max-width: 500px;

        margin: 0;

        color: var(--testo-3);

        font-size: 14px;
        line-height: 1.7;
    }

    /* =========================================================
       CHAT ATTIVA
       ========================================================= */

    #chatAttiva {
        width: 100%;
        height: 100%;
    }

    /* =========================================================
       HEADER CHAT
       ========================================================= */

    .chat-header {
        min-height: 82px;

        display: flex;
        align-items: center;
        gap: 13px;

        padding: 13px 25px;

        background: rgba(255, 255, 255, 0.96);

        border-bottom: 1px solid var(--bordo);

        box-shadow:
            0 2px 10px rgba(20, 30, 40, 0.035);
    }

    .chat-header .btn-chat-azione {
        display: none;
    }

    .chat-header-info {
        min-width: 0;
        flex: 1;
    }

    .chat-header-nome {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;

        color: var(--testo);

        font-size: 16px;
        font-weight: 800;
    }

    .chat-header-stato {
        display: flex;
        align-items: center;
        gap: 6px;

        margin-top: 5px;

        color: var(--testo-3);

        font-size: 11px;
        font-weight: 600;
    }

    .chat-header-stato::before {
        content: "";

        width: 6px;
        height: 6px;

        border-radius: 50%;

        background: var(--verde);
    }

    /* =========================================================
       MESSAGGI
       ========================================================= */

    .messaggi-chat {
        flex: 1;
        min-height: 0;

        overflow-y: auto;

        padding: 28px 36px 22px;

        display: flex;
        flex-direction: column;
        gap: 8px;

        scrollbar-width: thin;
        scrollbar-color: #cbd4da transparent;
    }

    .messaggi-chat::-webkit-scrollbar {
        width: 8px;
    }

    .messaggi-chat::-webkit-scrollbar-track {
        background: transparent;
    }

    .messaggi-chat::-webkit-scrollbar-thumb {
        background: #cbd4da;
        border-radius: 99px;
    }

    .giorno-chat {
        align-self: center;

        margin: 5px 0 12px;

        padding: 6px 12px;

        border: 1px solid #e0e6ea;
        border-radius: 999px;

        background: rgba(255, 255, 255, 0.94);

        color: #89949d;

        font-size: 10px;
        font-weight: 750;

        box-shadow:
            0 2px 8px rgba(20, 30, 40, 0.04);
    }

    .riga-messaggio {
        width: 100%;

        display: flex;
    }

    .riga-messaggio.mio {
        justify-content: flex-end;
    }

    .riga-messaggio.altro {
        justify-content: flex-start;
    }

    .bolla {
        max-width: min(70%, 700px);

        padding: 10px 13px 8px;

        border-radius: 16px;

        color: var(--testo);

        font-size: 14px;
        line-height: 1.5;

        word-break: break-word;
        white-space: pre-wrap;

        box-shadow:
            0 1px 2px rgba(20, 30, 40, 0.05);
    }

    .riga-messaggio.mio .bolla {
        background: var(--mio);
        border-bottom-right-radius: 5px;
    }

    .riga-messaggio.altro .bolla {
        background: var(--altro);

        border: 1px solid #e7ecef;
        border-bottom-left-radius: 5px;
    }

    .meta-messaggio {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 7px;

        margin-top: 4px;

        color: #7b8790;

        font-size: 10px;
    }

    .riga-messaggio.mio .meta-messaggio {
        color: #698270;
    }

    .segnala-messaggio {
        padding: 0;

        background: transparent;
        color: #8b969e;

        font-size: 10px;

        cursor: pointer;
        text-decoration: underline;
    }

    .segnala-messaggio:hover {
        color: #cf3942;
    }

    .chat-caricamento {
        align-self: center;

        margin-top: auto;
        margin-bottom: auto;

        padding: 11px 15px;

        border: 1px solid #e5eaed;
        border-radius: 11px;

        background: rgba(255, 255, 255, 0.9);
        color: #849099;

        font-size: 13px;

        box-shadow:
            0 4px 15px rgba(20, 30, 40, 0.04);
    }

    /* =========================================================
       COMPOSITORE
       ========================================================= */

    .compositore {
        padding: 14px 22px 17px;

        background: #ffffff;

        border-top: 1px solid var(--bordo);
    }

    .riga-compositore {
        display: flex;
        align-items: flex-end;
        gap: 10px;

        max-width: 1180px;
        margin: 0 auto;

        padding: 7px 7px 7px 15px;

        border: 1px solid #dce3e7;
        border-radius: 17px;

        background: #f7f9fa;

        transition:
            background 0.18s ease,
            border-color 0.18s ease,
            box-shadow 0.18s ease;
    }

    .riga-compositore:focus-within {
        background: #ffffff;

        border-color: #99d1bb;

        box-shadow:
            0 0 0 3px rgba(23, 136, 97, 0.07);
    }

    .input-messaggio {
        flex: 1;
        min-width: 0;

        min-height: 40px;
        max-height: 130px;

        padding: 9px 2px;

        border: 0;
        outline: none;
        resize: none;

        background: transparent;
        color: var(--testo);

        font-size: 14px;
        line-height: 1.4;
    }

    .input-messaggio::placeholder {
        color: #929da5;
    }

    .btn-invia {
        width: 42px;
        height: 42px;
        min-width: 42px;

        display: inline-flex;
        align-items: center;
        justify-content: center;

        border-radius: 12px;

        background: var(--verde);
        color: #ffffff;

        cursor: pointer;

        transition:
            background 0.18s ease,
            transform 0.18s ease,
            box-shadow 0.18s ease;
    }

    .btn-invia:hover {
        background: var(--verde-scuro);

        transform: translateY(-1px);

        box-shadow:
            0 5px 12px rgba(23, 136, 97, 0.2);
    }

    .btn-invia:active {
        transform: scale(0.96);
    }

    .btn-invia:disabled {
        opacity: 0.5;
        cursor: default;
        transform: none;
        box-shadow: none;
    }

    .btn-invia svg {
        width: 18px;
        height: 18px;
    }

    .compositore-info {
        max-width: 1180px;

        margin: 7px auto 0;

        padding: 0 4px;

        color: #97a1a8;

        font-size: 10px;
    }

    .richiesta-messaggio {
    width: min(560px, 100%);
    margin: auto;
    padding: 30px;
    border: 1px solid #dfe7e4;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 12px 35px rgba(20, 31, 40, 0.07);
    text-align: center;
}

.richiesta-messaggio-icon {
    width: 62px;
    height: 62px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 18px;
    background: var(--verde-chiaro);
    color: var(--verde);
}

.richiesta-messaggio-icon svg {
    width: 30px;
    height: 30px;
}

.richiesta-messaggio h3 {
    margin: 0 0 9px;
    color: var(--testo);
    font-size: 20px;
    font-weight: 800;
}

.richiesta-messaggio p {
    margin: 0 auto;
    max-width: 430px;
    color: var(--testo-3);
    font-size: 13px;
    line-height: 1.65;
}

.richiesta-messaggio-azioni {
    margin-top: 23px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.btn-accetta-messaggio,
.btn-ignora-messaggio {
    min-height: 42px;
    padding: 0 18px;
    border-radius: 11px;
    font-size: 13px;
    font-weight: 750;
    cursor: pointer;
}

.btn-accetta-messaggio {
    background: var(--verde);
    color: #fff;
}

.btn-ignora-messaggio {
    border: 1px solid #dce3e7;
    background: #f7f9fa;
    color: #5c6973;
}

    /* =========================================================
       TOAST
       ========================================================= */

    #contenitore-toast {
        position: fixed;
        right: 22px;
        bottom: 22px;

        z-index: 1000;

        display: flex;
        flex-direction: column;
        gap: 8px;

        pointer-events: none;
    }

    .toast {
        max-width: 360px;

        padding: 12px 15px;

        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 11px;

        background: var(--navy);
        color: #ffffff;

        box-shadow:
            0 12px 35px rgba(20, 30, 40, 0.2);

        font-size: 13px;

        animation:
            comparsaToast 0.2s ease;
    }

    @keyframes comparsaToast {
        from {
            opacity: 0;
            transform: translateY(8px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* =========================================================
       TABLET
       ========================================================= */

    @media (max-width: 1100px) {

        .sidebar-conversazioni {
            width: 340px;
            min-width: 320px;
        }

        .messaggi-chat {
            padding-left: 24px;
            padding-right: 24px;
        }

        .bolla {
            max-width: 76%;
        }
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 900px) {

        .pagina-messaggi,
        .app-messaggi {
            width: 100%;
            height: 100%;
            min-height: 100vh;
        }

        .sidebar-conversazioni {
            width: 100%;
            min-width: 0;
        }

        .area-chat {
            width: 100%;
        }

        body.thread-aperto .sidebar-conversazioni {
            display: none;
        }

        body.thread-aperto .area-chat {
            display: flex;
        }

        body:not(.thread-aperto) .area-chat {
            display: none;
        }

        .sidebar-header {
            padding: 20px 16px 15px;
        }

        .sidebar-titolo {
            font-size: 24px;
        }

        .sidebar-sottotitolo {
            font-size: 12px;
        }

        .btn-indietro {
            width: 40px;
            height: 40px;
            min-width: 40px;
        }

        .conversazione {
            min-height: 78px;
            padding: 11px 14px;
        }

        .avatar-conversazione {
            width: 48px;
            height: 48px;
            min-width: 48px;
        }

        .chat-header {
            min-height: 68px;
            padding: 10px 12px;
        }

        .chat-header .btn-chat-azione {
            width: 38px;
            height: 38px;
            min-width: 38px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: #f2f5f6;
            color: #596670;

            cursor: pointer;
        }

        .chat-header .btn-chat-azione svg {
            width: 18px;
            height: 18px;
        }

        .messaggi-chat {
            padding: 18px 12px 15px;
        }

        .bolla {
            max-width: 84%;

            padding:
                8px
                11px
                7px;

            font-size: 13px;
        }

        .compositore {
            padding: 9px 10px 11px;
        }

        .riga-compositore {
            border-radius: 15px;
        }

        .compositore-info {
            font-size: 9px;
        }

        #contenitore-toast {
            right: 12px;
            bottom: 12px;
            left: 12px;
        }

        .toast {
            max-width: none;
        }
    }

    /* =========================================================
       MOBILE PICCOLO
       ========================================================= */

    @media (max-width: 520px) {

        .richiesta-messaggio {
    padding: 24px 18px;
}

.richiesta-messaggio-azioni {
    flex-direction: column;
}

.btn-accetta-messaggio,
.btn-ignora-messaggio {
    width: 100%;
}

        .sidebar-header {
            padding: 17px 13px 12px;
        }

        .sidebar-etichetta {
            font-size: 10px;
        }

        .sidebar-titolo {
            font-size: 21px;
        }

        .sidebar-sottotitolo {
            font-size: 11px;
        }

        .btn-indietro {
            width: 38px;
            height: 38px;
            min-width: 38px;
        }

        .conversazione {
            min-height: 74px;
            padding: 10px 12px;
        }

        .avatar-conversazione {
            width: 45px;
            height: 45px;
            min-width: 45px;

            font-size: 16px;

        }

        .conversazione-anteprima {
            font-size: 12px;
        }

        .chat-header-nome {
            font-size: 15px;
        }

        .chat-header-stato {

        }

        .messaggi-chat {

                15px
                10px

            font-size: 13px;
        }

        .btn-invia {
            width: 40px;
            height: 40px;
            min-width: 40px;
        }
    }
</style>
</head>

<body>

<div class="pagina-messaggi">

    <div class="app-messaggi">

        <!-- =====================================================
             SIDEBAR
             ===================================================== -->

        <aside class="sidebar-conversazioni">

            <div class="sidebar-header">

                <div class="sidebar-titolo-riga">

                    <div class="sidebar-brand">

                        <div class="sidebar-etichetta">
                            Giochi Società
                        </div>

                        <h1 class="sidebar-titolo">
                            Messaggi
                        </h1>

                        <div class="sidebar-sottotitolo">
                            Le tue conversazioni private
                        </div>

                    </div>

                    <button
                        type="button"
                        class="btn-indietro"
                        title="Torna indietro"
                        onclick="history.back()"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M15 18l-6-6 6-6"></path>
                        </svg>
                    </button>

                </div>

                <div class="ricerca-conversazioni">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"

                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-4-4"></path>
                    </svg>

                    <input
                        id="ricercaContatti"
                        type="text"

        <!-- =====================================================
             AREA CHAT

        <main class="area-chat">

            <!-- CHAT VUOTA -->

            <section
                class="chat-vuota"

            >

                <div class="chat-vuota-icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M21 11.5a8.38 8.38 0 0 1-9 8.5 8.63 8.63 0 0 1-4-.95L3 21l1.75-4.1A8.35 8.35 0 0 1 3 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5Z"></path>
                    </svg>

                </div>

                <h2>
                    I tuoi messaggi
                </h2>

                <p>
                    Seleziona una conversazione a sinistra
                    per iniziare a parlare con un altro giocatore.

            </section>

            <!-- CHAT ATTIVA -->

                    flex-direction:column;

                <!-- HEADER CHAT -->

                <header class="chat-header">

                    <button
                        type="button"
                        class="btn-chat-azione"
                        title="Torna alle conversazioni"
                        id="btnTornaConversazioni"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M15 18l-6-6 6-6"></path>
                        </svg>
                    </button>

                    <div
                        id="chatAvatar"
                        class="avatar-conversazione"
                    ></div>

                    <div class="chat-header-info">

                        <div
                            id="chatNome"

                        >
                            Utente
                        </div>

                        <div class="chat-header-stato">

                        </div>

                    </div>

                </header>

                <!-- MESSAGGI -->

                <div
                    id="messaggiChat"

                ></div>

                <!-- COMPOSITORE -->

                <div class="compositore">

                    <div class="riga-compositore">

                        <textarea
                            id="inputMessaggio"

                            placeholder="Scrivi un messaggio..."
                            maxlength="500"
                            rows="1"
                        ></textarea>

                        <button
                            type="button"
                            id="btnInvia"
                            class="btn-invia"
                            title="Invia messaggio"
                        >
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="m22 2-7 20-4-9-9-4Z"></path>
                                <path d="M22 2 11 13"></path>
                            </svg>
                        </button>

                    </div>

                    <div class="compositore-info">
                        Premi Invio per inviare · massimo 500 caratteri
                    </div>

                </div>

            </section>

        </main>

    </div>

</div>

<div id="contenitore-toast"></div>

<script>
/* ============================================================
   CONFIGURAZIONE
   ============================================================ */

const API_BASE =
    "https://gioco-oca-server.onrender.com";

const parametri =
    new URLSearchParams(window.location.search);

let mioUid = null;

let uidConversazioneAperta =
    parametri.get("con");

let nomeConversazioneAperta =
    parametri.get("nome") || "";

let conversazioniCache = [];

let timerAggiornamento =
    null;

let timerAggiornamentoInbox =
    null;

let caricamentoMessaggiInCorso =
    false;

let caricamentoInboxInCorso =
    false;


/* ============================================================
   UTILITY
   ============================================================ */

const PALETTE = [
    "#6a2c70",
    "#1e40af",
    "#2e7d59",
    "#c46c19",
    "#87951f",
    "#c93636",
    "#007c83",
    "#76584a"
];

function coloreDaNome(nome) {

    let somma = 0;

    for (
        let i = 0;
        i < (nome || "?").length;
        i++
    ) {
        somma +=
            nome.charCodeAt(i);
    }

    return PALETTE[
        somma % PALETTE.length
    ];
}

function iniziale(nome) {

    return (
        (nome || "?")
            .trim()
            .charAt(0)
            .toUpperCase()
        || "?"
    );
}

function escapeHtml(testo) {

    const div =
        document.createElement("div");

    div.textContent =
        testo == null
            ? ""
            : String(testo);

    return div.innerHTML;
}

function formatoOra(timestamp) {

    try {

        return new Date(timestamp)
            .toLocaleTimeString(
                "it-IT",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

    } catch {

        return "";
    }
}

function formatoGiorno(timestamp) {

    try {

        const data =
            new Date(timestamp);

        const oggi =
            new Date();

        const ieri =
            new Date();

        ieri.setDate(
            ieri.getDate() - 1
        );

        if (
            data.toDateString() ===
            oggi.toDateString()
        ) {
            return "Oggi";
        }

        if (
            data.toDateString() ===
            ieri.toDateString()
        ) {
            return "Ieri";
        }

        return data.toLocaleDateString(
            "it-IT",
            {
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        );

    } catch {

        return "";
    }
}

function mostraToast(testo) {

    const contenitore =
        document.getElementById(
            "contenitore-toast"
        );

    const toast =
        document.createElement("div");

    toast.className =
        "toast";

    toast.textContent =
        testo;

    contenitore.appendChild(
        toast
    );

    setTimeout(() => {

        toast.remove();

    }, 4000);
}


/* ============================================================
   AUTENTICAZIONE
   ============================================================ */

async function avvia() {

    try {

        const risposta =
            await fetch(
                API_BASE + "/api/me",
                {
                    credentials: "include"
                }
            );

        if (!risposta.ok) {

            window.location.href =
                "login.html?redirect=" +
                encodeURIComponent(
                    window.location.href
                );

            return;
        }

        const dati =
            await risposta.json();

        mioUid =
            dati.uid;

        await caricaInbox();

avviaAggiornamentoInbox();

if (
    uidConversazioneAperta
) {

            const conversazione =
                conversazioniCache.find(
                    c =>
                        c.altroUid ===
                        uidConversazioneAperta
                );

            apriThread(
                uidConversazioneAperta,
                conversazione
                    ? conversazione.altroNome
                    : nomeConversazioneAperta
            );
        }

    } catch (errore) {

        window.location.href =
            "login.html?redirect=" +
            encodeURIComponent(
                window.location.href
            );
    }
}


/* ============================================================
   INBOX
   ============================================================ */

async function caricaInbox() {

    try {

        const risposta =
            await fetch(
                API_BASE + "/api/conversazioni",
                {
                    credentials: "include"
                }
            );

        if (risposta.status === 401) {

            window.location.href =
                "login.html?redirect=" +
                encodeURIComponent(
                    window.location.href
                );

            return;
        }

        const dati =
            await risposta.json();

        conversazioniCache =
            Array.isArray(
                dati.conversazioni
            )
                ? dati.conversazioni
                : [];

        renderConversazioni();

    } catch (errore) {

        document.getElementById(
            "listaConversazioni"
        ).innerHTML = `
            <div class="stato-lista">
                <strong>Impossibile caricare i messaggi</strong>
                Controlla la connessione e riprova.
            </div>
        `;
    }
}

function avviaAggiornamentoInbox() {

    if (timerAggiornamentoInbox) {

        clearInterval(
            timerAggiornamentoInbox
        );
    }

    timerAggiornamentoInbox =
        setInterval(
            () => {

                aggiornaInboxSilenziosa();

            },
            2500
        );
}

function renderConversazioni() {

    const contenitore =
        document.getElementById(
            "listaConversazioni"
        );

    const ricerca =
        document
            .getElementById(
                "ricercaContatti"
            )
            .value
            .trim()
            .toLowerCase();

    const filtrate =
        conversazioniCache.filter(
            c =>
                !ricerca ||
                (c.altroNome || "")
                    .toLowerCase()
                    .includes(ricerca)
        );

    if (!filtrate.length) {

        if (
            conversazioniCache.length === 0
        ) {

            contenitore.innerHTML = `
                <div class="stato-lista">
                    <strong>Nessuna conversazione</strong>
                    Vai sul profilo di un giocatore
                    per iniziare una nuova chat.
                </div>
            `;

        } else {

            contenitore.innerHTML = `
                <div class="stato-lista">
                    <strong>Nessun risultato</strong>
                    Nessuna conversazione corrisponde
                    alla ricerca.
                </div>
            `;
        }

        return;
    }

    contenitore.innerHTML = "";

    filtrate.forEach(
        conversazione => {

            const elemento =
                document.createElement(
                    "button"
                );

            elemento.type =
                "button";

            elemento.className =
                "conversazione" +
                (
                    uidConversazioneAperta ===
                    conversazione.altroUid
                        ? " attiva"
                        : ""
                );

            const avatar =
                document.createElement(
                    "div"
                );

            avatar.className =
                "avatar-conversazione";

            avatar.style.background =
                coloreDaNome(
                    conversazione.altroNome
                );

            avatar.textContent =
                iniziale(
                    conversazione.altroNome
                );

            const corpo =
                document.createElement(
                    "div"
                );

            corpo.className =
                "conversazione-corpo";

            const rigaSuperiore =
                document.createElement(
                    "div"
                );

            rigaSuperiore.className =
                "conversazione-riga-superiore";

            const nome =
                document.createElement(
                    "div"
                );

            nome.className =
                "conversazione-nome";

            nome.textContent =
                conversazione.altroNome ||
                "Utente";

            const data =
                document.createElement(
                    "div"
                );

            data.className =
                "conversazione-data";

            data.textContent =
                formatoGiorno(
                    conversazione.ultimaData
                );

            rigaSuperiore.appendChild(
                nome
            );

            rigaSuperiore.appendChild(
                data
            );

            const rigaInferiore =
                document.createElement(
                    "div"
                );

            rigaInferiore.className =
                "conversazione-riga-inferiore";

            const anteprima =
                document.createElement(
                    "div"
                );

            anteprima.className =
                "conversazione-anteprima";

            anteprima.textContent =
                conversazione.ultimoTesto ||
                "";

            rigaInferiore.appendChild(
                anteprima
            );

            if (
                Number(
                    conversazione.nonLetti
                ) > 0
            ) {

                const badge =
                    document.createElement(
                        "span"
                    );

                badge.className =
                    "badge-non-letti";

                badge.textContent =
                    conversazione.nonLetti;

                rigaInferiore.appendChild(
                    badge
                );
            }

            corpo.appendChild(
                rigaSuperiore
            );

            corpo.appendChild(
                rigaInferiore
            );

            elemento.appendChild(
                avatar
            );

            elemento.appendChild(
                corpo
            );

            elemento.addEventListener(
                "click",
                () => {

                    apriThread(
                        conversazione.altroUid,
                        conversazione.altroNome
                    );
                }
            );

            contenitore.appendChild(
                elemento
            );
        }
    );
}


/* ============================================================
   THREAD
   ============================================================ */

async function apriThread(
    uidDestinatario,
    nomeDestinatario
) {

    uidConversazioneAperta =
        uidDestinatario;

    nomeConversazioneAperta =
        nomeDestinatario || "Utente";

    document.body.classList.add(
        "thread-aperto"
    );

    window.history.replaceState(
        {},
        "",
        "messaggi-privati.html?con=" +
        encodeURIComponent(
            uidDestinatario
        ) +
        "&nome=" +
        encodeURIComponent(
            nomeDestinatario || ""
        )
    );

    document.getElementById(
        "chatVuota"
    ).style.display =
        "none";

    document.getElementById(
        "chatAttiva"
    ).style.display =
        "flex";

    const avatar =
        document.getElementById(
            "chatAvatar"
        );

    avatar.innerHTML = "";

    avatar.style.background =
        coloreDaNome(
            nomeDestinatario
        );

    avatar.textContent =
        iniziale(
            nomeDestinatario
        );

    document.getElementById(
        "chatNome"
    ).textContent =
        nomeDestinatario ||
        "Utente";

    document.getElementById(
        "inputMessaggio"
    ).focus();

    await caricaMessaggiThread(
        true
    );

    avviaAggiornamentoThread();

    renderConversazioni();
}

function chiudiThread() {

    uidConversazioneAperta =
        null;

    nomeConversazioneAperta =
        "";

    if (
        timerAggiornamento
    ) {

        clearInterval(
            timerAggiornamento
        );

        timerAggiornamento =
            null;
    }

    document.body.classList.remove(
        "thread-aperto"
    );

    document.getElementById(
        "chatAttiva"
    ).style.display =
        "none";

    document.getElementById(
        "chatVuota"
    ).style.display =
        "flex";

    window.history.replaceState(
        {},
        "",
        "messaggi-privati.html"
    );

    renderConversazioni();
}

function avviaAggiornamentoThread() {

    if (
        timerAggiornamento
    ) {

        clearInterval(
            timerAggiornamento
        );
    }

    timerAggiornamento =
        setInterval(
            () => {
                caricaMessaggiThread(
                    false
                );
            },
            2500
        );
}


/* ============================================================
   CARICAMENTO MESSAGGI
   ============================================================ */

async function caricaMessaggiThread(
    forzaScroll
) {

    if (
        !uidConversazioneAperta ||
        caricamentoMessaggiInCorso
    ) {
        return;
    }

    caricamentoMessaggiInCorso =
        true;

    try {

        const risposta =
            await fetch(
                API_BASE +
                "/api/messaggi-privati/" +
                encodeURIComponent(
                    uidConversazioneAperta
                ),
                {
                    credentials: "include"
                }
            );

        if (
            risposta.status === 401
        ) {

            window.location.href =
                "login.html?redirect=" +
                encodeURIComponent(
                    window.location.href
                );

            return;
        }

        const dati =
    await risposta.json();

if (
    dati.bloccata === true &&
    dati.richiestaAmicizia === true
) {

    renderRichiestaMessaggio(
        nomeConversazioneAperta
    );

    await aggiornaInboxSilenziosa();

    return;
}

renderMessaggi(
    dati.messaggi || [],
    forzaScroll
);

await aggiornaInboxSilenziosa();

    } catch (errore) {

        mostraToast(
            "Impossibile aggiornare la conversazione."
        );

    } finally {

        caricamentoMessaggiInCorso =
            false;
    }
}

function renderRichiestaMessaggio(
    nomeMittente
) {

    const box =
        document.getElementById(
            "messaggiChat"
        );

    box.innerHTML = `
        <div class="richiesta-messaggio">

            <div class="richiesta-messaggio-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M21 11.5a8.38 8.38 0 0 1-9 8.5 8.63 8.63 0 0 1-4-.95L3 21l1.75-4.1A8.35 8.35 0 0 1 3 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5Z"></path>
                </svg>

            </div>

            <h3>
                Nuovo messaggio
            </h3>

            <p>
                <strong>${escapeHtml(nomeMittente || "Questo giocatore")}</strong>
                ti ha inviato un messaggio.
                Per leggerlo devi prima diventare suo amico.
            </p>

            <div class="richiesta-messaggio-azioni">

                <button
                    type="button"
                    class="btn-accetta-messaggio"
                    id="btnAccettaMessaggio"
                >
                    Diventa amico e leggi
                </button>

                <button
                    type="button"
                    class="btn-ignora-messaggio"
                    id="btnIgnoraMessaggio"
                >
                    Ignora
                </button>

            </div>

        </div>
    `;

    document
        .getElementById(
            "btnAccettaMessaggio"
        )
        .addEventListener(
            "click",
            accettaMessaggioEdiventaAmico
        );

    document
        .getElementById(
            "btnIgnoraMessaggio"
        )
        .addEventListener(
            "click",
            ignoraRichiestaMessaggio
        );
}

function renderMessaggi(
    messaggi,
    forzaScroll
) {

    const box =
        document.getElementById(
            "messaggiChat"
        );

    const vecchiaAltezza =
        box.scrollHeight;

    const eraInFondo =
        box.scrollHeight -
        box.scrollTop -
        box.clientHeight <
        120;

    box.innerHTML = "";

    if (
        !messaggi.length
    ) {

        box.innerHTML = `
            <div class="chat-caricamento">
                Nessun messaggio. Inizia la conversazione!
            </div>
        `;

        return;
    }

    let ultimoGiorno =
        null;

    messaggi.forEach(
        messaggio => {

            const giorno =
                formatoGiorno(
                    messaggio.data
                );

            if (
                giorno &&
                giorno !== ultimoGiorno
            ) {

                const separatore =
                    document.createElement(
                        "div"
                    );

                separatore.className =
                    "giorno-chat";

                separatore.textContent =
                    giorno;

                box.appendChild(
                    separatore
                );

                ultimoGiorno =
                    giorno;
            }

            box.appendChild(
                creaBolla(
                    messaggio
                )
            );
        }
    );

    if (
        forzaScroll ||
        eraInFondo
    ) {

        requestAnimationFrame(
            scrollFondo
        );

    } else {

        const differenza =
            box.scrollHeight -
            vecchiaAltezza;

        if (
            differenza > 0
        ) {

            box.scrollTop =
                Math.max(
                    0,
                    box.scrollTop +
                    differenza
                );
        }
    }
}

function creaBolla(
    messaggio
) {

    const mio =
        messaggio.daUid === mioUid;

    const riga =
        document.createElement(
            "div"
        );

    riga.className =
        "riga-messaggio " +
        (mio ? "mio" : "altro");

    const bolla =
        document.createElement(
            "div"
        );

    bolla.className =
        "bolla";

    const testo =
        document.createElement(
            "div"
        );

    testo.textContent =
        messaggio.testo || "";

    const meta =
        document.createElement(
            "div"
        );

    meta.className =
        "meta-messaggio";

    const ora =
        document.createElement(
            "span"
        );

    ora.textContent =
        formatoOra(
            messaggio.data
        );

    meta.appendChild(
        ora
    );

    if (!mio) {

        const segnala =
            document.createElement(
                "button"
            );

        segnala.type =
            "button";

        segnala.className =
            "segnala-messaggio";

        segnala.textContent =
            "Segnala";

        segnala.addEventListener(
            "click",
            () => {

                segnalaMessaggio(
                    messaggio.daNome ||
                    "Utente",
                    messaggio.testo ||
                    ""
                );
            }
        );

        meta.appendChild(
            segnala
        );
    }

    bolla.appendChild(
        testo
    );

    bolla.appendChild(
        meta
    );

    riga.appendChild(
        bolla
    );

    return riga;
}

function scrollFondo() {

    const box =
        document.getElementById(
            "messaggiChat"
        );

    box.scrollTop =
        box.scrollHeight;
}

async function accettaMessaggioEdiventaAmico() {

    if (!uidConversazioneAperta) {
        return;
    }

    const bottone =
        document.getElementById(
            "btnAccettaMessaggio"
        );

    const bottoneIgnora =
        document.getElementById(
            "btnIgnoraMessaggio"
        );

    if (bottone) {
        bottone.disabled = true;
        bottone.textContent = "Accettazione...";
    }

    if (bottoneIgnora) {
        bottoneIgnora.disabled = true;
    }

    try {

        const risposta =
            await fetch(
                API_BASE +
                "/api/amici/accetta-messaggio",
                {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        altroUid:
                            uidConversazioneAperta
                    })
                }
            );

        const dati =
            await risposta.json();

        if (!risposta.ok) {

            mostraToast(
                dati.errore ||
                "Impossibile accettare il messaggio."
            );

            if (bottone) {
                bottone.disabled = false;
                bottone.textContent =
                    "Diventa amico e leggi";
            }

            if (bottoneIgnora) {
                bottoneIgnora.disabled = false;
            }

            return;
        }

        await aggiornaInboxSilenziosa();

        await caricaMessaggiThread(
            true
        );

    } catch (errore) {

        mostraToast(
            "Errore di connessione al server."
        );

        if (bottone) {
            bottone.disabled = false;
            bottone.textContent =
                "Diventa amico e leggi";
        }

        if (bottoneIgnora) {
            bottoneIgnora.disabled = false;
        }
    }
}

function ignoraRichiestaMessaggio() {
    chiudiThread();
}


/* ============================================================
   INVIO MESSAGGI
   ============================================================ */

async function inviaMessaggio() {

    const input =
        document.getElementById(
            "inputMessaggio"
        );

    const testo =
        input.value.trim();

    if (
        !testo ||
        !uidConversazioneAperta
    ) {

        return;
    }

    const bottone =
        document.getElementById(
            "btnInvia"
        );

    input.value =
        "";

    ridimensionaTextarea();

    bottone.disabled =
        true;

    try {

        const risposta =
            await fetch(
                API_BASE +
                "/api/messaggi-privati",
                {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        destinatarioUid:
                            uidConversazioneAperta,

                        testo
                    })
                }
            );

        const dati =
            await risposta.json();

        if (
            !risposta.ok
        ) {

            mostraToast(
                dati.errore ||
                "Errore durante l'invio."
            );

            input.value =
                testo;

            ridimensionaTextarea();

            return;
        }

        await caricaMessaggiThread(
            true
        );

    } catch (errore) {

        input.value =
            testo;

        ridimensionaTextarea();

        mostraToast(
            "Errore di connessione al server."
        );

    } finally {

        bottone.disabled =
            false;

        input.focus();
    }
}


/* ============================================================
   SEGNALAZIONE
   ============================================================ */

async function segnalaMessaggio(
    mittente,
    testoMessaggio
) {

    const conferma =
        window.confirm(
            "Vuoi segnalare questo messaggio allo staff?"
        );

    if (!conferma) {
        return;
    }

    try {

        const risposta =
            await fetch(
                API_BASE +
                "/api/contatti",
                {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        categoria:
                            "Segnalazione",

                        messaggio:
                            `Segnalazione messaggio privato da "${mittente}": "${testoMessaggio}"`
                    })
                }
            );

        const dati =
            await risposta.json();

        if (!risposta.ok) {

            mostraToast(
                dati.errore ||
                "Errore durante la segnalazione."
            );

            return;
        }

        mostraToast(
            "Segnalazione inviata allo staff."
        );

    } catch (errore) {

        mostraToast(
            "Errore durante l'invio della segnalazione."
        );
    }
}


/* ============================================================
   AGGIORNAMENTO INBOX
   ============================================================ */

async function aggiornaInboxSilenziosa() {

    if (caricamentoInboxInCorso) {
        return;
    }

    caricamentoInboxInCorso = true;

    try {

        const risposta =
            await fetch(
                API_BASE +
                "/api/conversazioni",
                {
                    credentials: "include",
                    cache: "no-store"
                }
            );

        if (
            risposta.status === 401
        ) {

            window.location.href =
                "login.html?redirect=" +
                encodeURIComponent(
                    window.location.href
                );

            return;
        }

        if (!risposta.ok) {
            return;
        }

        const dati =
            await risposta.json();

        conversazioniCache =
            Array.isArray(
                dati.conversazioni
            )
                ? dati.conversazioni
                : [];

        renderConversazioni();

    } catch (errore) {

        /* aggiornamento silenzioso */

    } finally {

        caricamentoInboxInCorso =
            false;
    }
}


/* ============================================================
   RICERCA
   ============================================================ */

document
    .getElementById(
        "ricercaContatti"
    )
    .addEventListener(
        "input",
        renderConversazioni
    );


/* ============================================================
   PULSANTI
   ============================================================ */

document
    .getElementById(
        "btnTornaConversazioni"
    )
    .addEventListener(
        "click",
        chiudiThread
    );

document
    .getElementById(
        "btnInvia"
    )
    .addEventListener(
        "click",
        inviaMessaggio
    );


/* ============================================================
   TEXTAREA RESPONSIVE
   ============================================================ */

const inputMessaggio =
    document.getElementById(
        "inputMessaggio"
    );

function ridimensionaTextarea() {

    inputMessaggio.style.height =
        "auto";

    inputMessaggio.style.height =
        Math.min(
            inputMessaggio.scrollHeight,
            130
        ) + "px";
}

inputMessaggio.addEventListener(
    "input",
    ridimensionaTextarea
);

inputMessaggio.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            inviaMessaggio();
        }
    }
);


/* ============================================================
   AVVIO
   ============================================================ */

window.addEventListener(
    "beforeunload",
    () => {

        if (
            timerAggiornamento
        ) {

            clearInterval(
                timerAggiornamento
            );
        }

        if (
            timerAggiornamentoInbox
        ) {

            clearInterval(
                timerAggiornamentoInbox
            );
        }
    }
);

avvia();
</script>
